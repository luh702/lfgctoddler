      if (s.kind === 'class' && classById(s.classId)) {
        // v0.9 — 선생님 개인 로그인이 없어졌다. 예전 세션의 teacherId는 버리고 반만 이어받는다.
        return { kind: 'class', classId: s.classId };
      }
      // 예전(v0.4~v0.8) 선생님별 세션은 그 선생님의 반 세션으로 옮긴다
      if (s.teacherId) {
        var tr = teacherById(s.teacherId);
        if (tr && tr.classIds && tr.classIds.length) return { kind: 'class', classId: tr.classIds[0] };
      }
    } catch (e) { /* ignore */ }
    return null;
  }
  function saveSession() {
    if (!session) { try { window.localStorage.removeItem(SESSION_KEY); } catch (e) {} return; }
    safeSet(SESSION_KEY, JSON.stringify(session));
  }

  /* =========================================================
     6. 데이터 조회
     ========================================================= */
  // 지금 들어온 사람 — 관리자(임원) 또는 반(교사). 반은 선생님 개인을 가리지 않는다 (v0.9)
  function currentTeacher() {
    if (!session) return null;
    if (session.kind === 'admin') {
      var a = adminById(session.adminId);
      if (!a) return null;
      return { id: a.id, kind: 'admin', role: 'admin', name: a.name, title: a.title, classId: null };
    }
    var c = classById(session.classId);
    if (!c) return null;
    return {
      id: 'class:' + c.id, kind: 'class', role: 'teacher',
      classId: c.id, className: c.name,
      name: c.name + ' 교사',
      title: c.name + ' · 교사'
    };
  }
  function actorKey() {
    if (!session) return 'guest';
    if (session.kind === 'admin') return 'a:' + session.adminId;
    return 'c:' + session.classId;
  }
  function adminById(id) {
    for (var i = 0; i < data.admins.length; i++) if (data.admins[i].id === id) return data.admins[i];
    return null;
  }
  function teacherById(id) {
    for (var i = 0; i < data.teachers.length; i++) if (data.teachers[i].id === id) return data.teachers[i];
    return null;
  }
  function teachersOfClass(classId) {
    return data.teachers.filter(function (t) { return (t.classIds || []).indexOf(classId) >= 0; });
  }
  function teacherOfClass(classId) {
    var a = teachersOfClass(classId);
    return a.length ? a[0] : null;
  }
  function teacherNamesText(classId, sep) {
    var a = teachersOfClass(classId);
    if (!a.length) return '선생님 미배정';
    return a.map(function (t) { return t.name; }).join(sep || ' · ');
  }
  function dayRec(key) { return data.attendance[key] || {}; }
  function recOf(key, childId) { return dayRec(key)[childId] || null; }
  function statusOf(key, childId) {
    var r = recOf(key, childId);
    return r && (r.s === 'p' || r.s === 'a') ? r.s : null;
  }
  function noteOf(key, childId) {
    var r = recOf(key, childId);
    return r && r.note ? r.note : '';
  }

  /* ---------- 주간 기도제목 ---------- */
  function prayerOf(week, childId) {
    var w = data.prayers && data.prayers[week];
    return w ? (w[childId] || null) : null;
  }
  function prayerCount(p) {
    return p && p.prayed ? p.prayed.length : 0;
  }
  // 누가 적었는지 — 관리자는 '관리자', 반은 '○○반 교사' (v0.9: 선생님 개인 이름 대신 반 이름)
  function prayerByText(p) {
    if (!p || !p.by || p.by === 'seed') return '기도제목';
    var by = String(p.by);
    if (by.indexOf('a:') === 0) return '관리자';   // 임원 계정이 하나로 합쳐졌으니 옛 임원 기록도 '관리자'로
    if (by.indexOf('c:') === 0) {
      var c = classById(by.split(':')[1]);
      if (c) return c.name + ' 교사';
      var nm0 = p.byName || '';
      return nm0 ? (nm0 + ' 교사') : '교사';
    }
    var nm = p.byName || '';
    if (nm === '관리자' || nm === '임원 · 관리자') return nm;
    return nm ? (nm + ' 선생님') : '선생님';
  }
  function iPrayed(p) {
    return !!(p && p.prayed && p.prayed.indexOf(actorKey()) >= 0);
  }
  function setPrayer(week, childId, text) {
    if (!data.prayers) data.prayers = {};
    if (!data.prayers[week]) data.prayers[week] = {};
    var t = String(text == null ? '' : text).trim();
    var t2 = currentTeacher();
    if (!t) { delete data.prayers[week][childId]; return; }
    var prev = data.prayers[week][childId] || { prayed: [] };
    data.prayers[week][childId] = {
      text: t,
      by: actorKey(),
      byName: t2.role === 'admin' ? t2.name : className(t2.classId),
      at: Date.now(),
      prayed: prev.prayed || []
    };
  }

  /* =========================================================
     6-2. v2.1 — 🐑 순복이 가져간 친구 · 🙏 선생님 기도제목
     주일(일요일)마다 한 친구가 한 주 동안 순복이와 함께 지낸다. 기록은 주일 이름표로 남고,
     선생님 기도제목은 선생님 한 분마다 하나씩 남긴다 (두 기록 모두 서버로 간다).
     ========================================================= */
  function sbLog() {
    if (!data.soonboki || typeof data.soonboki !== 'object') data.soonboki = {};
    return data.soonboki;
  }
  function sbWeekOf(key) { return sundayOf(key || todayISO()); }
  function sbOf(week) { return sbLog()[sbWeekOf(week)] || null; }
  function sbActorName() {
    var t = currentTeacher();
    if (!t) return '';
    if (t.role === 'admin') return t.name || '관리자';
    return (t.className || className(t.classId)) + ' 교사';
  }
  // 이번 주 기록을 고른다 — 이미 있던 한 줄 메모는 그대로 이어받는다
  function sbSet(week, childId, memo) {
    var c = childById(childId);
    if (!c) return false;
    var w = sbWeekOf(week);
    var prev = sbLog()[w] || null;
    sbLog()[w] = {
      childId: c.id,
      childName: c.name,
      classId: c.classId,
      memo: (typeof memo === 'string') ? memo.slice(0, 40) : (prev ? (prev.memo || '') : ''),
      by: actorKey(),
      byName: sbActorName(),
      at: Date.now()
    };
    return true;
  }
  function sbMemo(week, memo) {
    var e = sbOf(week);
    if (!e) return false;
    e.memo = String(memo == null ? '' : memo).slice(0, 40);
    e.by = actorKey();
    e.byName = sbActorName();
    e.at = Date.now();
    return true;
  }
  function sbRemove(week) { delete sbLog()[sbWeekOf(week)]; }
  // 이 기록을 고칠 수 있나 — 관리자는 모든 반, 반 선생님은 자기 반 아이 기록만
  function sbCanEdit(t, entry) {
    if (!t) return false;
    if (t.role === 'admin') return true;
    return !entry || entry.classId === t.classId;
  }
  function sbChildName(e) {
    var c = e ? childById(e.childId) : null;
    return c ? c.name : ((e && e.childName) || '지난 친구');
  }
  function sbClassOf(e) {
    var c = e ? childById(e.childId) : null;
    return (c ? c.classId : ((e && e.classId) || ''));
  }
  // 지난 기록은 최근 주일부터
  function sbWeeksDesc() { return Object.keys(sbLog()).sort().reverse(); }
  // 이번 주 다음 주 기록은 아직 없어도 넘겨 볼 수 있게 12주까지 거슬러 올라간다
  function sbWeekLabel(wk) {
    var d = parseISO(wk);
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  function tpLog() {
    if (!data.teacherPrayers || typeof data.teacherPrayers !== 'object') data.teacherPrayers = {};
    return data.teacherPrayers;
  }
  function tpOf(tid) { return tpLog()[tid] || null; }
  function tpCount() { return Object.keys(tpLog()).length; }
  function tpSave(tid, text) {
    var tr = teacherById(tid);
    if (!tr) return false;
    var t = String(text == null ? '' : text).trim().slice(0, 200);
    var m = tpLog();
    if (!t) { delete m[tid]; return true; }
    m[tid] = { text: t, by: actorKey(), byName: tr.name, at: Date.now() };
    return true;
  }
  // 자기 반 선생님 것만 쓰고 고칠 수 있다 (관리자는 모두)
  function tpCanEdit(t, tid) {
    if (!t) return false;
    if (t.role === 'admin') return true;
    var tr = teacherById(tid);
    return !!(tr && (tr.classIds || []).indexOf(t.classId) >= 0);
  }
  function tpDateText(at) { return at ? fmtMD(iso(new Date(at))) : ''; }
  function kidsOf(classId, dateKey) {
    return data.children.filter(function (c) {
      if (classId && c.classId !== classId) return false;
      if (dateKey && c.enrolled > dateKey) return false;
      return true;
    });
  }
  function countsFor(dateKey, classId) {
    var kids = kidsOf(classId, dateKey);
    var p = 0, a = 0, u = 0;
    kids.forEach(function (k) {
      var s = statusOf(dateKey, k.id);
      if (s === 'p') p++;
      else if (s === 'a') a++;
      else u++;
    });
    return { p: p, a: a, u: u, total: kids.length, rate: kids.length ? Math.round(p / kids.length * 100) : 0 };
  }
  function kidsBirthdayIn(month) {
    return data.children.filter(function (c) { return parseISO(c.birth).getMonth() + 1 === month; })
      .sort(function (x, y) { return parseISO(x.birth).getDate() - parseISO(y.birth).getDate(); });
  }
  function isNewKid(c, refKey) {
    var d = daysBetween(c.enrolled, refKey);
    return d >= 0 && d <= 30;
  }
  function newKids(refKey) {
    return data.children.filter(function (c) { return isNewKid(c, refKey); })
      .sort(function (x, y) { return x.enrolled < y.enrolled ? 1 : -1; });
  }
  /* ---------- 첫 방문 · 졸업 D-day ---------- */
  function firstVisitOf(c) {
    return c.enrolled || c.firstVisitDate || c.joinedDate || '';
  }
  // 2026.10.18 처럼 짧게
  function fmtDot(key) {
    if (!key) return '';
    var d = parseISO(key);
    return d.getFullYear() + '.' + pad2(d.getMonth() + 1) + '.' + pad2(d.getDate());
  }
  // 온 지 며칠/몇 주째 — 새친구반은 주 단위가 더 와닿는다
  function sinceVisitText(c, refKey) {
    var f = firstVisitOf(c);
    if (!f) return '';
    var d = daysBetween(f, refKey || todayISO());
    if (d < 0) return '';
    if (d === 0) return '오늘 처음 방문';
    if (d < 21) return '온 지 ' + d + '일째';
    return '온 지 ' + Math.max(1, Math.round(d / 7)) + '주째';
  }
  // 영국 학기 시작은 기준 월(기본 9월) 1일 — 아이는 '졸업 기준 나이'(기본 만 5세)가 된 뒤
  //  처음 오는 기준 월 1일에 유아부를 졸업한다. (예: 2021년 10월생 → 만 5세 2026-10 → 2027-09-01)
  // v1.6 — 학기 시작 월과 기준 나이는 관리 탭 '졸업 기준'에서 바꾼다 (기본: 9월 · 만 5세)
  // v1.8 — 이미 지난 학기(예: 2026년 9월)를 '졸업 예정'으로 보여 주지 않는다.
  //  계산된 날이 지났으면 다가오는 다음 기준 월(2027년 9월)로 넘긴다 — 지금 명단에 있는 아이는 아직 유아부에 있다.
  function gradRuleText() {
    var s = settingsOf();
    return '만 ' + s.gradAge + '세 · ' + s.gradMonth + '월';
  }
  function autoGraduation(birth) {
    if (!birth || !/^\d{4}-\d{2}-\d{2}$/.test(String(birth))) return '';
    var b = parseISO(birth);
    if (isNaN(b.getTime())) return '';
    var s = settingsOf();
    var startMonth = s.gradMonth, age = s.gradAge;
    // 1) 기준 나이가 되는 날
    var aged = new Date(b.getFullYear() + age, b.getMonth(), b.getDate());
    // 2) 그날 이후 처음 오는 기준 월 1일
    var g = new Date(aged.getFullYear(), startMonth - 1, 1);
    if (g < aged) g = new Date(aged.getFullYear() + 1, startMonth - 1, 1);
    // 3) 이미 지난 학기는 예정으로 보여 주지 않고 다가오는 다음 학기로 넘긴다
    var today = startOfDay(new Date());
    for (var guard = 0; g < today && guard < 20; guard++) {
      g = new Date(g.getFullYear() + 1, g.getMonth(), 1);
    }
    return iso(g);
  }
  function graduationOf(c) {
    if (c.graduation && /^\d{4}-\d{2}-\d{2}$/.test(c.graduation)) return c.graduation;
    return autoGraduation(c.birth);
  }
  function gradDays(c) {
    var g = graduationOf(c);
    return g ? daysBetween(todayISO(), g) : null;
  }
  // v1.9 — 졸업 표기는 날짜 대신 연도로만: 올해 졸업 · 내년 졸업 (몇 개월·며칠 남았는지는 쓰지 않는다)
  function gradLabelFor(g) {
    if (!g) return '';
    if (daysBetween(todayISO(), g) < 0) return '지난 졸업';
    var y = parseISO(g).getFullYear();
    var nowY = new Date().getFullYear();
    if (y === nowY) return '올해 졸업';
    if (y === nowY + 1) return '내년 졸업';
    return y + '년 졸업';
  }
  function gradLabel(c) { return gradLabelFor(graduationOf(c)); }
  // v1.9 — 아이 카드·졸업 명단에서 쓰는 구간
  //   'past' 졸업일이 이미 지남(직접 지정한 날이 지난 경우) · 'due' 올해 졸업 · '' 그 외
  function gradHighlight(c) {
    var d = gradDays(c);
    if (d == null) return '';
    if (d < 0) return 'past';
    return parseISO(graduationOf(c)).getFullYear() <= new Date().getFullYear() ? 'due' : '';
  }
  // 졸업 명단에 모으는 아이: 올해 졸업 · 내년 졸업 · (직접 지정한) 지난 졸업
  function gradScope(c) {
    var g = graduationOf(c);
    if (!g) return '';
    if (gradDays(c) < 0) return 'past';
    var y = parseISO(g).getFullYear();
    var nowY = new Date().getFullYear();
    if (y <= nowY) return 'this';
    if (y === nowY + 1) return 'next';
    return '';
  }
  function gradBadge(c) {
    var g = graduationOf(c);
    if (!g) return '';
    var lab = gradLabel(c);
    var cls = lab === '지난 졸업' ? ' past' : lab === '올해 졸업' ? ' due' : '';
    return '<span class="tag-grad' + cls + '" title="' + esc(fmtLong(g)) +
      ' 유아부 졸업(초등 ' + settingsOf().gradMonth + '월 입학)' + (lab === '지난 졸업' ? ' · 이미 지난 날짜' : '') + '">🎓 ' + lab + '</span>';
  }

  /* ---------- v1.9 — 🎓 올해·내년 졸업 명단 ---------- */
  // 올해 졸업과 내년 졸업을 한 카드에 모으고, 이미 지난 졸업은 접어 둔다 — 가까운 학기부터
  function gradKids() {
    return data.children.filter(function (c) {
      return c.birth && gradScope(c) !== '';
    }).sort(function (a, b) {
      var da = gradDays(a), db = gradDays(b);
      if ((da < 0) !== (db < 0)) return da < 0 ? 1 : -1;
      return da < 0 ? db - da : da - db;
    });
  }
  function gradStripHtml() {
    var ks = gradKids();
    if (!ks.length) return '';
    var thisKs = ks.filter(function (k) { return gradScope(k) === 'this'; });
    var nextKs = ks.filter(function (k) { return gradScope(k) === 'next'; });
    var pastKs = ks.filter(function (k) { return gradScope(k) === 'past'; });
    var open = ui.gradOpen !== false;
    function rowHtml(k) {
      var sc = gradScope(k);
      var meta = classMeta(k.classId);
      var dcls = sc === 'past' ? ' past' : sc === 'this' ? ' soon' : '';
      return '<button type="button" class="grad-row" data-action="child-info" data-child="' + k.id + '">' +
        '<span class="gr-cls" style="background:' + meta.soft + ';color:' + meta.color + '">' + esc(className(k.classId)) + '</span>' +
        '<span class="gr-main"><b>' + esc(k.name) + '</b>' +
          '<small>' + esc(fmtDot(k.birth)) + '생 · 졸업 ' + esc(fmtDot(graduationOf(k))) + (isManualGrad(k) ? ' (직접 지정)' : '') + '</small></span>' +
        '<span class="dday' + dcls + '">' + esc(gradLabel(k)) + '</span>' +
      '</button>';
    }
    var rows = '';
    if (thisKs.length) rows += '<div class="grad-sec">올해 졸업 ' + thisKs.length + '명</div>' + thisKs.map(rowHtml).join('');
    if (nextKs.length) rows += '<div class="grad-sec">내년 졸업 ' + nextKs.length + '명</div>' + nextKs.map(rowHtml).join('');
    if (pastKs.length) {
      rows += ui.gradPastOpen
        ? '<div class="grad-sec">지난 졸업 ' + pastKs.length + '명 · 직접 지정한 졸업일이 지난 아이예요. 명단에서 빼거나 다음 반으로 보낼 때 참고하세요</div>' + pastKs.map(rowHtml).join('')
        : '<button type="button" class="grad-more" data-action="grad-past">지난 졸업 ' + pastKs.length + '명 보기 ›</button>';
    }
    var parts = [];
    if (thisKs.length) parts.push('올해 졸업 ' + thisKs.length + '명');
    if (nextKs.length) parts.push('내년 졸업 ' + nextKs.length + '명');
    var title = parts.length ? parts.join(' · ') : '지난 졸업 ' + pastKs.length + '명';
    var sub = '눌러서 아이 정보 보기' + (parts.length && pastKs.length ? ' · 지난 졸업 ' + pastKs.length + '명' : '');
    return '<div class="grad-card' + (open ? ' open' : '') + '">' +
      '<button type="button" class="grad-head" data-action="grad-toggle" aria-expanded="' + (open ? 'true' : 'false') + '">' +
        '<span class="gh-ico">🎓</span>' +
        '<span class="gh-txt"><b>' + title + '</b><small>' + esc(sub) + '</small></span>' +
        '<img class="gh-lamb sb-img" src="assets/soonbok-sit.png" alt="순복이">' +
        '<span class="chev">›</span>' +
      '</button>' +
      (open ? '<div class="grad-body">' + rows + '</div>' : '') +
    '</div>';
  }

  /* ---------- v1.3 — 반 배정 (새친구반 → 정규 반) ---------- */
  // 정규 반 목록 — 새친구반은 '배정 대상'이 아니라 '기다리는 곳'이다
  function regularClasses() {
    return data.classes.filter(function (c) { return c.id !== NEW_FRIEND_CLASS; });
  }
  // 새친구반 아이를 정규 반으로 보낼 수 있는 사람 — 관리자(임원)와 새친구반 담당 선생님
  function canAssignNewFriend(t, c) {
    if (!t || !c || c.classId !== NEW_FRIEND_CLASS) return false;
    if (t.role === 'admin') return true;
    return t.classId === NEW_FRIEND_CLASS;
  }
  // 이 아이를 이 반으로 옮길 수 있는가 — 관리자는 어디든, 새친구반 담당은 새친구반 → 정규 반만
  function canMoveChild(t, c, classId) {
    if (!t || !c || !classById(classId) || c.classId === classId) return false;
    if (t.role === 'admin') return true;
    return canAssignNewFriend(t, c) && classId !== NEW_FRIEND_CLASS;
  }
  // 새친구반 카드 아래에 바로 뜨는 반 배정 칩 — 원탭으로 배정
  function assignBarHtml(c, t) {
    if (!canAssignNewFriend(t, c)) return '';
    var targets = regularClasses();
    if (!targets.length) return '';
    return '<div class="assign-bar">' +
        '<span class="ab-label">🐣 반 배정</span>' +
        '<div class="assign-chips">' + targets.map(function (x) {
          return '<button type="button" class="assign-chip" data-action="assign-class" data-child="' + c.id +
            '" data-class="' + x.id + '" aria-label="' + esc(c.name) + ' 어린이를 ' + esc(x.name) + '으로 배정">' +
            esc(x.name) + '</button>';
        }).join('') + '</div>' +
      '</div>';
  }

  /* ---------- v1.3 — 졸업 예정 자동 계산 / 직접 지정 ---------- */
  function isManualGrad(c) {
    return !!(c && /^\d{4}-\d{2}-\d{2}$/.test(c.graduation || ''));
  }
  function gradAutoTextHtml(birth) {
    var g = autoGraduation(birth);
    if (!g) return '🎓 <span class="muted">생년월일을 넣으면 자동으로 계산돼요</span>';
    return '🎓 ' + esc(fmtDot(g)) + ' <small>' + esc(gradLabelFor(g)) + ' · ' + esc(gradRuleText()) + ' 학기</small>';
  }
  function gradAutoNoteText(birth) {
    var g = autoGraduation(birth);
    return g ? '생일 기준 자동은 ' + fmtDot(g) + '예요' : '생일 기준 자동 계산은 생년월일이 있어야 해요';
  }
  // 등록·수정 창의 졸업 입력 — [자동 계산] / [직접 지정] 전환 + 직접 지정 날짜
  function graduationFieldHtml(c) {
    var manual = isManualGrad(c) ? c.graduation : '';
    var birth = c ? c.birth : '';
    return '<div class="field grad-field" data-grad-field>' +
        '<span>졸업 <em>' + esc(gradRuleText()) + ' 기준</em></span>' +
        '<div class="seg" role="group" aria-label="졸업 시기 정하는 방식">' +
          '<button type="button" class="seg-btn' + (manual ? '' : ' active') + '" data-action="grad-mode" data-mode="auto">자동 계산</button>' +
          '<button type="button" class="seg-btn' + (manual ? ' active' : '') + '" data-action="grad-mode" data-mode="manual">직접 지정</button>' +
        '</div>' +
        '<div class="grad-auto" data-grad-auto' + (manual ? ' hidden' : '') + '>' + gradAutoTextHtml(birth) + '</div>' +
        '<div class="grad-manual" data-grad-manual' + (manual ? '' : ' hidden') + '>' +
          '<input class="input" name="graduation" type="date" value="' + esc(manual) + '" aria-label="졸업일 직접 지정">' +
          '<div class="grad-manual-note" data-grad-note>' + esc(gradAutoNoteText(birth)) + '</div>' +
          '<button type="button" class="grad-reset" data-action="grad-mode" data-mode="auto">↺ 자동 계산으로 되돌리기</button>' +
        '</div>' +
        '<input type="hidden" name="gradMode" value="' + (manual ? 'manual' : 'auto') + '">' +
      '</div>';
  }
  // 모달 안에서 생년월일·방식을 바꾸면 다시 그리기 (입력중인 다른 값은 그대로)
  function refreshGradField() {
    var root = document.querySelector('#modalRoot [data-grad-field]');
    if (!root) return;
    var form = root.closest ? root.closest('form') : null;
    if (!form) return;
    var modeEl = form.querySelector('[name="gradMode"]');
    var birthEl = form.querySelector('[name="birth"]');
    var manEl = form.querySelector('[name="graduation"]');
    var autoBox = root.querySelector('[data-grad-auto]');
    var manBox = root.querySelector('[data-grad-manual]');
    var note = root.querySelector('[data-grad-note]');
    var mode = modeEl ? modeEl.value : 'auto';
    var birth = birthEl ? birthEl.value : '';
    var auto = autoGraduation(birth);

    Array.prototype.forEach.call(root.querySelectorAll('.seg-btn'), function (b) {
      b.classList.toggle('active', b.getAttribute('data-mode') === mode);
    });
    if (autoBox) {
      autoBox.innerHTML = gradAutoTextHtml(birth);
      autoBox.classList.toggle('empty', !auto);
      autoBox.hidden = (mode !== 'auto');
    }
    if (manBox) manBox.hidden = (mode !== 'manual');
    if (note) {
      note.textContent = gradAutoNoteText(birth);
    }
    if (manEl) manEl.setAttribute('aria-required', mode === 'manual' ? 'true' : 'false');
  }

  // 수정 권한 — 관리자(임원)는 모든 반, 선생님은 자기 반만
  function canEdit(t, classId) {
    if (!t) return false;
    if (t.role === 'admin') return true;
    return !!(t.classId && t.classId === classId);
  }

  /* ---------- 아이 사진/아바타 ---------- */
  function avatarInner(c) {
    return c.photo ? '<img src="' + esc(c.photo) + '" alt="">' : esc(c.name.charAt(0));
  }
  // 동그린 사진을 누르면 아이 정보·사진 수정 모달이 열린다
  function avatarButtonHtml(c, extraCls, label, badge) {
    var meta = classMeta(c.classId);
    var cls = 'avatar avatar-btn' + (c.photo ? ' has-photo' : '') + (extraCls ? ' ' + extraCls : '');
    var style = c.photo ? '' : ' style="background:' + meta.soft + ';color:' + meta.color + '"';
    return '<button type="button" class="' + cls + '" data-action="child-info" data-child="' + c.id + '"' + style +
      ' aria-label="' + esc(c.name + ' ' + (label || '정보')) + '">' +
      avatarInner(c) +
      (badge ? '<span class="avatar-badge" aria-hidden="true">✎</span>' : '') +
      '</button>';
  }

  /* =========================================================
     7. 화면 렌더
     ========================================================= */
  function normalizeUi(t) {
    var valid = ui.cls === 'all' || data.classes.some(function (c) { return c.id === ui.cls; });
    if (!valid) ui.cls = t.role === 'admin' ? 'all' : (t.classId || data.classes[0].id);
    if (ui.view === 'admin' && t.role !== 'admin') ui.view = 'attendance';
    if (t.role !== 'admin') resetSel();   // v1.8 — 명단 정리(선택 삭제)는 관리자만
    if (!ui.date) ui.date = iso(mostRecentSunday(new Date()));
    if (!ui.pWeek) ui.pWeek = sundayOf(ui.date);
    if (!ui.pCls || (ui.pCls !== 'all' && !data.classes.some(function (c) { return c.id === ui.pCls; }))) ui.pCls = 'all';
    if (!ui.bMonth) {
      var d = parseISO(ui.date);
      ui.bMonth = { y: d.getFullYear(), m: d.getMonth() + 1 };
    }
  }

  function render() {
    var app = document.getElementById('app');
    var t = currentTeacher();
    if (!t) { app.innerHTML = loginHtml(); return; }

    normalizeUi(t);
    var body = '';
    if (ui.view === 'birthdays') body = birthdaysHtml(t);
    else if (ui.view === 'prayers') body = prayersHtml(t);
    else if (ui.view === 'stats') body = statsHtml(t);
    else if (ui.view === 'admin') body = adminHtml(t);
    else body = attendanceHtml(t);

    app.innerHTML = headerHtml(t) + bannerHtml() + '<main class="view">' + body + '</main>' + tabbarHtml(t);
    try { document.title = settingsOf().title + ' 출석부'; } catch (e) {}
    paintSync();

    if (ui.memoOpen) {
      var ta = document.querySelector('textarea[data-memo="' + ui.memoOpen + '"]');
      if (ta) {
        ta.focus();
        try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) {}
      }
    }
  }

      memoForm = '<form id="sbMemoForm" class="sbm-memo" novalidate>' +
          '<input class="input" name="memo" type="text" maxlength="40" autocomplete="off" value="' + esc(e.memo || '') + '" placeholder="한 줄 메모 (선택) · 예: 이번 주도 순복이가 함께해요" aria-label="순복이 메모">' +
          '<button type="submit" class="save">메모</button>' +
        '</form>' +
        '<button type="button" class="sb-del" data-action="sb-del" data-week="' + wk + '">' + (isThis ? '이번 주' : sbWeekLabel(wk) + ' 주') + ' 기록 지우기</button>';
    }

    // 고르기 — 반에 입장한 선생님(자기 반) · 관리자(모든 반)
    var picker = '';
    if (!t) {
      picker = '<div class="sb-note">🍎 선생님은 <b>반에 입장한 뒤</b> 출석 화면의 순복이 카드에서 누가 가져갔는지 고를 수 있어요. 여기서는 지난 기록만 볼 수 있어요.</div>';
    } else if (!editable) {
      picker = '<div class="sb-note">🔒 ' + esc(className(cls)) + ' 기록이에요. 다른 반 기록은 그 반 선생님이나 관리자만 바꿀 수 있어요.</div>';
    } else {
      var list = t.role === 'admin' ? data.classes : data.classes.filter(function (c) { return c.id === t.classId; });
      var grid = '';
      list.forEach(function (c) {
        var kids = kidsOf(c.id);
        if (!kids.length) return;
        if (t.role === 'admin' && list.length > 1) {
          grid += '<div class="sb-grp" style="color:' + classMeta(c.id).color + '"><i></i>' + esc(c.name) + '</div>';
        }
        grid += '<div class="sb-grid">' + kids.map(function (k) {
          var on = !!(e && e.childId === k.id);
          return '<button type="button" class="sb-kid' + (on ? ' on' : '') + '" data-action="sb-pick" data-child="' + k.id + '" data-week="' + wk + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
            '<span class="av">' + (k.photo ? '<img src="' + esc(k.photo) + '" alt="">' : esc(k.name.charAt(0))) + '</span>' +
            '<span class="nm">' + esc(k.name) + '</span>' +
            (t.role === 'admin' ? '<span class="cl">' + esc(c.name.replace('반', '')) + '</span>' : '') +
          '</button>';
        }).join('') + '</div>';
      });
      picker = '<div class="sb-pick-h"><span>' + (isThis ? '이번 주' : sbWeekLabel(wk) + ' 주') + '는 누가 가져갔나요?</span><small>한 번 누르면 바로 저장돼요</small></div>' +
        (grid || '<div class="empty" style="padding:14px">이 반에는 아직 등록된 친구가 없어요.</div>');
    }

    // 지난 기록 — 최근 주일부터
    // v2.1 — 창 안쪽 탭: 먼저 '전체 기록'(누가 가져갔나)이 보이고, 선생님은 [이번 주 고르기]로 기록
    var weeks = sbWeeksDesc();
    // 누른 주(보통 이번 주)는 기록이 없어도 목록 맨 위에 한 줄로 보여 준다
    var histWeeks = weeks.slice();
    if (histWeeks.indexOf(wk) < 0) histWeeks.push(wk);
    histWeeks.sort().reverse();

    var hist = '<div class="sb-hist"><div class="sb-pick-h"><span>전체 기록</span><small>' + (weeks.length ? weeks.length + '주 · 최근 주일부터' : '아직 없어요') + '</small></div>';
    hist += histWeeks.map(function (w) {
      var x = sbOf(w);
      var isNow = (w === wk);
      if (!x) {
        return '<div class="sb-h none">' +
          '<span class="d">' + sbWeekLabel(w) + '<small>' + WD[parseISO(w).getDay()] + '요일</small></span>' +
          '<span class="n">아직 기록 전<small>' + (isNow ? '이번 주 · 아직 없어요' : '그 주 기록 없음') + '</small></span>' +
        '</div>';
      }
      var c = sbClassOf(x);
      return '<button type="button" class="sb-h' + (isNow ? ' now' : '') + '" data-action="sb-hist" data-week="' + w + '">' +
        '<span class="d">' + sbWeekLabel(w) + '<small>' + WD[parseISO(w).getDay()] + '요일</small></span>' +
        '<span class="n">' + esc(sbChildName(x)) +
          '<small>' + (c ? esc(className(c)) : '') + (x.memo ? ' · ' + esc(x.memo) : '') + '</small></span>' +
        '<span class="go">›</span>' +
      '</button>';
    }).join('');
    if (!weeks.length) {
      hist += '<div class="sb-note">처음 기록을 남기면 이곳에 매주 누가 가져갔는지 차곡차곡 쌓여요.</div>';
    }
    hist += '</div>';

    var tabBar = !t ? '' : '<div class="sb-tabs">' +
      '<button type="button" class="' + (sbTab === 'hist' ? 'on' : '') + '" data-action="sb-tab" data-tab="hist">📋 전체 기록 <b>' + weeks.length + '</b></button>' +
      '<button type="button" class="' + (sbTab === 'pick' ? 'on' : '') + '" data-action="sb-tab" data-tab="pick">🐑 이번 주 고르기</button>' +
    '</div>';

    var bodyHtml;
    if (sbTab === 'pick' && t) {
      bodyHtml = memoForm + picker;
    } else {
      bodyHtml = hist + (t ? '' : '<div class="sb-note">🍎 선생님은 <b>반에 입장한 뒤</b> 출석 화면의 순복이 카드에서 누가 가져갔는지 고를 수 있어요.</div>');
      if (t && editable) {
        bodyHtml += '<button type="button" class="add-btn sb-pickbtn" data-action="sb-tab" data-tab="pick">🐑 ' + (isThis ? '이번 주' : sbWeekLabel(wk) + ' 주') + ' 순복이 고르기</button>';
      }
    }

    return '<div class="modal-head"><div><h3>🐑 순복이 가져간 친구</h3>' +
        '<p>매주 한 친구가 한 주 동안 순복이와 함께 지내요</p></div>' +
        '<button class="x-btn" data-action="modal-close" aria-label="닫기">✕</button></div>' +
      weekNav + hero + tabBar + bodyHtml +
      '<div class="modal-actions" style="margin-top:14px"><button type="button" class="btn ghost" data-action="modal-close">닫기</button></div>';
  }

  function sbPick(childId, week) {
    var t = currentTeacher();
    var c = childById(childId);
    if (!t || !c) return;
    if (!canEdit(t, c.classId)) { toast('다른 반 친구는 그 반 선생님만 고를 수 있어요.'); return; }
    var wk = sbWeekOf(week);
    sbSet(wk, c.id);
    save();
    openSoonboki(wk);
    toast(c.name + ' 친구가 ' + (wk === sbThisWeek() ? '이번 주' : sbWeekLabel(wk) + ' 주') + ' 한 주 동안 순복이와 함께 지내요 🐑');
  }

  function sbRemoveFlow(week) {
    var wk = sbWeekOf(week);
    var e = sbOf(wk);
    if (!e) return;
    if (!sbCanEdit(currentTeacher(), e)) { toast('이 기록은 그 반 선생님이나 관리자만 지울 수 있어요.'); return; }
    openConfirm('순복이 기록을 지울까요?',
      sbWeekLabel(wk) + ' 주 기록(' + sbChildName(e) + ')을 지웁니다.',
      function () {
        confirmCb = null;
        sbRemove(wk);
        save();
        render();
        openSoonboki(wk);
        toast('순복이 기록을 지웠어요');
      });
  }

  /* =========================================================
     v2.1 — 🙏 선생님 기도제목 (쓰기 · 고치기 · 함께 보기)
     ========================================================= */
  // v2.1 — 기도 탭에 바로 보이는 선생님 기도제목 (누르지 않아도 읽힌다)
  function tpCardHtml(t, x) {
    var p = tpOf(x.id);
    var cid = (x.classIds || [])[0] || '';
    var meta = classMeta(cid);
    var can = tpCanEdit(t, x.id);
    return '<div class="tp-card">' +
      '<div class="tp-h"><span class="nm">' + esc(x.name) + ' 선생님</span>' +
        ((x.classIds || []).length
          ? '<span class="pill" style="background:' + meta.soft + ';color:' + meta.color + '">' + esc(x.classIds.map(className).join('·')) + '</span>'
          : '') +
        (can ? '<button type="button" class="edit" data-action="tp-edit" data-teacher="' + x.id + '">✏️ 수정</button>' : '') +
      '</div>' +
      '<div class="tp-t">' + esc(p.text) + '</div>' +
      (p.at ? '<div class="tp-by">' + tpDateText(p.at) + ' · ' + esc(p.byName || x.name) + '</div>' : '') +
    '</div>';
  }

  function tpInlineHtml(t) {
    var written = tpOrder(data.teachers.filter(function (x) { return !!tpOf(x.id); }));
    var blank = tpOrder(data.teachers.filter(function (x) { return !tpOf(x.id); }));
    var mineBlank = blank.filter(function (x) { return tpCanEdit(t, x.id); });
    var cards = written.map(function (x) { return tpCardHtml(t, x); }).join('');
    var chips = mineBlank.map(function (x) {
      return '<button type="button" data-action="tp-edit" data-teacher="' + x.id + '">+ ' + esc(x.name) + '</button>';
    }).join('');
    return '<div class="section-title">🙏 선생님 기도제목 <small>' +
        (written.length ? written.length + '명 작성 · 함께 기도해요' : '아직 없어요 · 내 이름을 눌러 적어 보세요') + '</small></div>' +
      (cards || '<div class="tp-empty-note">🙏 선생님들의 기도제목이 이곳에 그대로 보여요. 아직 적은 선생님이 없어요 — 아래 내 이름을 누르면 첫 기도제목을 남길 수 있어요.</div>') +
      (mineBlank.length
        ? '<div class="tp-empty">' + chips + '</div>'
        : (written.length ? '' : '')) +
      (t && t.role === 'admin' && blank.length
        ? '<div class="data-note" style="padding:6px 4px 0">기도제목을 아직 안 적은 선생님 ' + blank.length + '명은 관리 탭 > 선생님 기도제목에서도 쓸 수 있어요.</div>'
        : '');
  }

  function tpOrder(list) {
    var order = {};
    data.classes.forEach(function (c, i) { order[c.id] = i; });
    function rank(tr) {
      var best = 99;
      (tr.classIds || []).forEach(function (id) {
        if (order[id] != null && order[id] < best) best = order[id];
      });
      return best;
    }
    return list.slice().sort(function (a, b) {
      var ra = rank(a), rb = rank(b);
      if (ra !== rb) return ra - rb;
      return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0);
    });
  }

  function openTeacherPrayers() {
    var t = currentTeacher();
    if (!t) return;
    var written = tpOrder(data.teachers.filter(function (x) { return !!tpOf(x.id); }));
    var blank = tpOrder(data.teachers.filter(function (x) { return !tpOf(x.id); }));

    var cards = written.map(function (x) { return tpCardHtml(t, x); }).join('');

    var mineBlank = blank.filter(function (x) { return tpCanEdit(t, x.id); });
    var chips = mineBlank.map(function (x) {
      return '<button type="button" data-action="tp-edit" data-teacher="' + x.id + '">+ ' + esc(x.name) + '</button>';
    }).join('');

    openModal(
      '<div class="modal-head"><div><h3>🙏 선생님 기도제목</h3>' +
        '<p>선생님들이 함께 나누는 기도제목이에요 · ' + written.length + '명 작성</p></div>' +
        '<button class="x-btn" data-action="modal-close" aria-label="닫기">✕</button></div>' +
      (cards || '<div class="card empty"><img class="empty-lamb" src="assets/soonbok-sit.png" alt="순복이">아직 선생님 기도제목이 없어요.<br>아래에서 내 이름을 눌러 처음으로 적어 보세요.</div>') +
      (mineBlank.length
        ? '<div class="sb-pick-h"><span>아직 안 쓰신 선생님</span><small>' + mineBlank.length + '명 · 이름을 누르면 써요</small></div>' +
          '<div class="tp-empty">' + chips + '</div>'
        : '') +
      '<div class="sb-note">🙏 관리자 PIN 없이도 반에 입장한 선생님은 우리 반 선생님 기도제목을 쓸 수 있어요. 다른 반은 보기만 돼요.</div>' +
      '<div class="modal-actions" style="margin-top:14px"><button type="button" class="btn ghost" data-action="modal-close">닫기</button></div>'
    );
  }

  function openTpForm(teacherId) {
    var t = currentTeacher();
    var tr = teacherById(teacherId);
    if (!t || !tr) return;
    if (!tpCanEdit(t, tr.id)) { toast('다른 반 선생님 기도제목은 그 반 선생님이나 관리자만 쓸 수 있어요.'); return; }
    var p = tpOf(tr.id);
    var where = (tr.classIds || []).length ? (tr.classIds || []).map(className).join(' · ') : '미배정';
    openModal(
      '<div class="modal-head"><div><h3>' + esc(tr.name) + ' 선생님 기도제목</h3>' +
        '<p>' + esc(where) + (p && p.at ? ' · ' + tpDateText(p.at) + '에 남김' : '') + '</p></div>' +
        '<button class="x-btn" data-action="modal-close" aria-label="닫기">✕</button></div>' +
      '<form id="tpForm" novalidate>' +
        '<input type="hidden" name="tid" value="' + esc(tr.id) + '">' +
        '<label class="field"><span>기도제목 <em>🙏</em></span>' +
          '<textarea class="input" name="text" maxlength="200" placeholder="예: 아이들이 건강하게 자라도록 · 이번 주 전도 모임에 마음이 모이도록">' + esc(p ? p.text : '') + '</textarea></label>' +
        '<div class="field-hint">기도 탭 맨 위 <b>선생님 기도제목</b>에서 모든 선생님이 함께 봐요.</div>' +
        '<div class="form-error" id="tpError" hidden></div>' +
        '<div class="modal-actions">' +
          '<button type="button" class="btn ghost" data-action="modal-close">취소</button>' +
          (p ? '<button type="button" class="btn ghost" data-action="tp-del" data-teacher="' + tr.id + '" style="color:#B25A60">지우기</button>' : '') +
          '<button type="submit" class="btn primary">저장</button>' +
        '</div>' +
      '</form>'
    );
  }

  function submitTp(form) {
    var fd = new FormData(form);
    var tid = String(fd.get('tid') || '');
    var text = String(fd.get('text') || '').trim().slice(0, 200);
    var t = currentTeacher();
    var tr = teacherById(tid);
    if (!t || !tr || !tpCanEdit(t, tr.id)) { closeModal(); toast('권한이 없어요.'); return; }
    if (!text) {
      var err = document.getElementById('tpError');
      if (err) { err.textContent = '기도제목을 적어 주세요.'; err.hidden = false; }
      return;
    }
    tpSave(tid, text);
    save();
    closeModal();
    render();
    toast(tr.name + ' 선생님 기도제목을 저장했어요 🙏');
  }

  function tpRemoveFlow(teacherId) {
    var tr = teacherById(teacherId);
    if (!tr) return;
    if (!tpCanEdit(currentTeacher(), tr.id)) { toast('권한이 없어요.'); return; }
    openConfirm('기도제목을 지울까요?', tr.name + ' 선생님의 기도제목을 지웁니다.', function () {
      confirmCb = null;
      tpSave(tr.id, '');
      save();
      closeModal();
      render();
      openTeacherPrayers();
      toast('기도제목을 지웠어요');
    });
  }

  /* ---------- 관리자 입장 (하나의 계정 → 바로 4자리 PIN) ---------- */
  function openAdminLogin() {
    var a = data.admins && data.admins[0];
    if (!a) { toast('관리자 계정을 찾지 못했어요'); return; }
    openPin('admin', a.id);
  }

  /* ---------- PIN 입력 시트 ---------- */
  var pinState = null;   // { kind:'admin'|'class', id, digits:'' }

  var PIN_ERR = 'PIN이 맞지 않아요. 다시 입력해 주세요.';

  function openPin(kind, id) {
    // 없는 계정·반이면 아무것도 열지 않는다
    if (kind === 'admin') { if (!adminById(id)) return; }
    else if (kind === 'class') {
      if (!classById(id)) return;
      // 반은 잠금이 꺼져 있으면 PIN 없이 확인만 하고 들어간다
      if (!data.classPinEnabled) { openClassConfirm(id); return; }
    } else return;
    pinState = { kind: kind, id: id, digits: '', err: false };
    renderPin();
  }

  // 반 카드 → (잠금 OFF) 확인 한 번 / (잠금 ON) 4자리 PIN
  function openClassLogin(classId) {
    var c = classById(classId);
    if (!c) return;
    if (data.classPinEnabled) { openPin('class', classId); return; }
    openClassConfirm(classId);
  }

  // 반 입장 확인 — PIN 없이 [취소] / [입장] (기본값). 선생님 개인 선택 없이 반으로 들어간다.
  function openClassConfirm(classId) {
    var c = classById(classId);
    if (!c) return;
    var meta = classMeta(classId);
    var ts = teachersOfClass(classId);
    var names = ts.length ? ts.map(function (t) { return esc(t.name); }).join(' · ') : '선생님 미배정';
    pinState = null;
    confirmCb = function () { loginAsClass(classId); };
    openModal(
      '<div class="modal-head">' +
        '<div><h3>' + esc(c.name) + '으로 입장하실까요?</h3><p>' + (c.desc ? esc(c.desc) + ' · ' : '') + '아이 ' + kidsOf(classId).length + '명</p></div>' +
        '<button class="x-btn" data-action="modal-close" aria-label="닫기">✕</button>' +
      '</div>' +
      '<div class="who-card">' +
        '<span class="cc-emoji" style="background:' + meta.soft + ';color:' + meta.color + '">' + meta.emoji + '</span>' +
        '<div class="who-txt"><span class="wl">👩‍🏫 담당 선생님</span><b class="wn">' + names + '</b></div>' +
      '</div>' +
      '<div class="who-note">' +
        (ts.length ? '누가 입장해도 같은 반으로 기록돼요' : '아직 담당 선생님이 없어요 · 관리 탭에서 배정할 수 있어요') +
      '</div>' +
      '<div class="readonly-note" style="margin-top:0"><span>🍎</span><span>출석·메모·유의사항·기도제목을 고칠 수 있어요. 다른 반은 <b>보기만</b> 됩니다.</span></div>' +
      '<div class="modal-actions">' +
        '<button type="button" class="btn ghost" data-action="modal-close">취소</button>' +
        '<button type="button" class="btn primary" data-action="confirm-ok">입장</button>' +
      '</div>'
    );
  }

  // "○○반으로 입장하실까요?" · "관리자(임원)로 입장하실까요?"
  function pinPrompt() {
    if (!pinState) return 'PIN 번호';
    if (pinState.kind === 'admin') return '관리자(임원)로 입장하실까요?';
    var c = classById(pinState.id);
    return c ? (c.name + '으로 입장하실까요?') : '입장하실까요?';
  }
  function pinTargetName() {
    if (!pinState) return '';
    if (pinState.kind === 'admin') return '관리자';
    var c = classById(pinState.id);
    return c ? c.name : '';
  }
  function pinTargetSub() {
    if (!pinState) return '';
    if (pinState.kind === 'admin') return '임원 · 교역자 · 모든 반 관리';
    return '담당 선생님 · ' + teacherNamesText(pinState.id, ' · ');
  }
  function pinDemo() {
    if (!pinState) return DEFAULT_ADMIN_PIN;
    if (pinState.kind === 'admin') {
      var a = adminById(pinState.id);
      return a ? a.pin : DEFAULT_ADMIN_PIN;
    }
    var c = classById(pinState.id);
    return c ? c.pin : '1111';
  }
  function renderPin() {
    if (!pinState) return;
    var d = pinState.digits;
    var dots = '';
    for (var i = 0; i < 4; i++) dots += '<span class="pin-dot' + (i < d.length ? ' on' : '') + '" id="pinDot' + i + '"></span>';
    var keys = '';
    [1,2,3,4,5,6,7,8,9].forEach(function (n) {
      keys += '<button class="pin-key" data-action="pin-key" data-key="' + n + '">' + n + '</button>';
    });
    keys += '<button class="pin-key fn" data-action="pin-clear">지우기</button>' +
      '<button class="pin-key" data-action="pin-key" data-key="0">0</button>' +
      '<button class="pin-key fn" data-action="pin-close">취소</button>';

    openModal(
      '<div class="pin-wrap' + (pinState.err ? ' shake' : '') + '">' +
        '<div class="modal-head">' +
          '<div><h3>' + esc(pinPrompt()) + '</h3><p>숫자 4자리를 입력해 주세요</p></div>' +
          '<button class="x-btn" data-action="pin-close" aria-label="닫기">✕</button>' +
        '</div>' +
        '<div class="pin-who">' +
          '<span class="cc-emoji" style="background:var(--primary-soft)">' +
            '<img src="assets/soonbok-wave.png" alt="순복이"></span>' +
          '<b>' + esc(pinTargetName()) + '</b>' +
          '<small>' + esc(pinTargetSub()) + '</small>' +
        '</div>' +
        '<div class="pin-dots">' + dots + '</div>' +
        '<div class="pin-err" id="pinErr">' + (pinState.err ? PIN_ERR : '') + '</div>' +
        '<div class="pin-pad">' + keys + '</div>' +
        '<div class="pin-demo">🧪 데모 PIN: ' + esc(pinDemo()) + '</div>' +
      '</div>'
    );
  }

  /* 숫자를 눌렀을 때는 모달을 다시 그리지 않고 점 4개와 오류 문구만 바꾼다 (깜빡임 없음) */
  function pinDotEls() {
    var out = [];
    try {
      if (document.querySelectorAll) {
        var nodes = document.querySelectorAll('.pin-dot');
        if (nodes && nodes.length) {
          for (var i = 0; i < nodes.length && i < 4; i++) out.push(nodes[i]);
          return out;
        }
      }
    } catch (e) { /* 무시하고 id로 찾는다 */ }
    for (var j = 0; j < 4; j++) {
      var el = document.getElementById ? document.getElementById('pinDot' + j) : null;
      if (el) out.push(el);
    }
    return out;
  }
  function paintPin() {
    if (!pinState) return;
    var n = pinState.digits.length;
    var dots = pinDotEls();
    for (var i = 0; i < dots.length; i++) {
      var on = i < n;
      if (dots[i] && dots[i].classList) dots[i].classList[on ? 'add' : 'remove']('on');
    }
    var errEl = document.getElementById ? document.getElementById('pinErr') : null;
    if (errEl) errEl.textContent = pinState.err ? PIN_ERR : '';
  }
  function pinShake() {
    try {
      var w = document.querySelector ? document.querySelector('.pin-wrap') : null;
      if (!w || !w.classList) return;
      w.classList.remove('shake');
      void w.offsetWidth;                         // 애니메이션을 처음부터 다시
      w.classList.add('shake');
      setTimeout(function () { if (w.classList) w.classList.remove('shake'); }, 420);
    } catch (e) {}
  }
  function pinKey(n) {
    if (!pinState || pinState.digits.length >= 4) return;
    if (pinState.err) pinState.err = false;
    pinState.digits += String(n);
    paintPin();
    if (pinState.digits.length === 4) setTimeout(pinSubmit, 110);
  }
  function pinBack() {
    if (!pinState) return;
    pinState.err = false;
    pinState.digits = pinState.digits.slice(0, -1);
    paintPin();
  }
  function pinSubmit() {
    if (!pinState) return;
    var st = pinState;
    if (st.digits.length < 4) return;
    if (st.digits !== pinDemo()) {
      st.digits = '';
      st.err = true;
      paintPin();
      pinShake();
      return;
    }
    pinState = null;
    if (st.kind === 'admin') loginAsAdmin(st.id);
    else loginAsClass(st.id);
  }

  /* ---------- 헤더 / 배너 / 탭바 ---------- */
  // v0.9 — 머리글에는 개인 선생님 이름 대신 반 이름과 역할만 보인다 (관리자는 '관리자')
  function headerHtml(t) {
    var roleTxt = t.role === 'admin' ? (t.title || '관리자') : (className(t.classId) + ' · 교사');
    var whoTxt = t.role === 'admin' ? '관리자' : className(t.classId);
    return '' +
      '<header class="app-header">' +
        '<div class="brand">' +
          '<button type="button" class="brand-mark" data-action="help-open" aria-label="순복이의 사용법 안내 열기" title="순복이의 사용법 안내">' +
            '<img class="sb-img" src="assets/soonbok-face.png" alt="순복이"></button>' +
          '<div class="brand-txt"><b>' + esc(settingsOf().title) + '</b>' +

          '</div>' +
        '</div>' +
        '<div class="hdr-tools">' +
          '<button type="button" class="hdr-help" data-action="help-open" aria-label="도움말 · 순복이의 사용법 안내" title="도움말">?</button>' +
          '<button class="logout" data-action="logout">' + esc(whoTxt) + ' <span>· 나가기</span></button>' +
        '</div>' +
      '</header>';

  // v1.6 — 제목의 마지막 단어만 색을 준다 (예: 런던순복음교회 <span>유아부</span>)
  function titleHtml() {
    var s = settingsOf().title;
    var i = s.lastIndexOf(' ');
    if (i > 0 && i < s.length - 1) return esc(s.slice(0, i)) + ' <span>' + esc(s.slice(i + 1)) + '</span>';
    return esc(s);
  }
  // v1.6 — 교사 한 줄 공지 (비우면 배너 없음)
  function noticeHtml() {
    var n = settingsOf().notice;
    if (!n) return '';
    return '<div class="notice-bar"><span class="nb-ico">📢</span><span class="nb-tx">' + esc(n) + '</span></div>';
  }
  function bannerHtml() {
    return '<div class="proto-banner">' +
      '<span id="syncBadge" class="sync-badge ' + sync.status + '">' + syncIcon() + ' ' + syncText() + '</span>' +
      '<span><b>선생님 모두 같은 자료</b> · 한 기기에서 체크하면 다른 기기에도 바로 보여요</span>' +
    '</div>';
  }
  function tabbarHtml(t) {
    var tabs = [
      { id: 'attendance', label: '출석', ico: '✅' },
      { id: 'prayers',    label: '기도', ico: '🙏' },
      { id: 'birthdays',  label: '생일', ico: '🎂' },
      { id: 'stats',      label: '통계', ico: '📊' }
    ];
    if (t.role === 'admin') tabs.push({ id: 'admin', label: '관리', ico: '⚙️' });

    var cols = tabs.map(function (x) {
      return '<button class="tab' + (ui.view === x.id ? ' active' : '') + '" data-action="tab" data-tab="' + x.id + '">' +
        '<span class="ico">' + x.ico + '</span><span>' + x.label + '</span></button>';
    }).join('');

    return '<nav class="tabbar" style="grid-template-columns:repeat(' + tabs.length + ',1fr)">' + cols + '</nav>';
  }

  /* ---------- 출석 탭 ---------- */
  function attendanceHtml(t) {
    var dateKey = ui.date;
    var cls = ui.cls;
    var isAdmin = t.role === 'admin';
    var visibleClasses = cls === 'all' ? data.classes : data.classes.filter(function (c) { return c.id === cls; });
    var stats = countsFor(dateKey, cls === 'all' ? null : cls);
    var editable = isAdmin || cls === 'all' || (t.classId && t.classId === cls);
    var myClassOnly = !isAdmin && cls !== 'all' && !(t.classId && t.classId === cls);
    var month = parseISO(dateKey).getMonth() + 1;
    var bdays = kidsBirthdayIn(month);

    // 날짜 바
    var dateBar =
      '<div class="card date-bar">' +
        '<button class="date-nav" data-action="date-prev" aria-label="이전 주일">‹</button>' +
        '<div class="date-mid">' +
          '<div class="date-main">' + (parseISO(dateKey).getMonth() + 1) + '월 ' + parseISO(dateKey).getDate() + '일 <span class="wk">(' + WD[parseISO(dateKey).getDay()] + ')</span></div>' +
          '<input class="date-input" type="date" id="dateInput" value="' + dateKey + '" aria-label="날짜 선택">' +
        '</div>' +
        '<button class="date-nav" data-action="date-next" aria-label="다음 주일">›</button>' +
      '</div>';

    // 반 칩 — 누구나 다른 반을 보기만 할 수 있다
    var chips = '';
    var allSt = countsFor(dateKey, null);
    chips += chipHtml('all', '전체', allSt.total, ui.cls === 'all', false)
      .replace('</button>', '<span class="cnt">' + allSt.p + '/' + allSt.total + '</span></button>');
    // v0.7 — 반 칩도 반 목록 순서 그대로. 담임 선생님도 같은 순서로 본다 (v1.6: ▲▼ 순서)
    data.classes.forEach(function (c) {
      var st = countsFor(dateKey, c.id);
      var locked = !canEdit(t, c.id);
      chips += chipHtml(c.id, c.name, st.total, ui.cls === c.id, locked) .replace('</button>',
        '<span class="cnt">' + st.p + '/' + st.total + '</span></button>');
    });
    chips = '<div class="chips">' + chips + '</div>';

    // 요약
    var pct = stats.rate;
    var pW = stats.total ? Math.round(stats.p / stats.total * 1000) / 10 : 0;
    var aW = stats.total ? Math.round(stats.a / stats.total * 1000) / 10 : 0;
    var summary =
      '<div class="card summary">' +
        '<div class="summary-top">' +
          '<div>' +
            '<div class="left">' + (cls === 'all' ? '유아부 전체' : esc(className(cls))) + ' · ' + stats.total + '명</div>' +
            '<div class="summary-big"><b>' + stats.p + '</b>명 출석</div>' +
          '</div>' +
          '<div class="summary-rate">출석률 ' + pct + '%</div>' +
        '</div>' +
        '<div class="stacked">' +
          '<i style="width:' + pW + '%;background:var(--present)"></i>' +
          '<i style="width:' + aW + '%;background:var(--absent)"></i>' +
        '</div>' +
        '<div class="counts">' +
          '<span><i class="d" style="background:var(--present)"></i>출석 ' + stats.p + '</span>' +
          '<span><i class="d" style="background:var(--absent)"></i>결석 ' + stats.a + '</span>' +
          '<span><i class="d" style="background:#D8CDC2"></i>미체크 ' + stats.u + '</span>' +
        '</div>' +
        (editable ? '<button class="all-btn" data-action="all-present">모두 출석으로 표시</button>' : '') +
      '</div>';

    // 보기 전용 안내
    var readOnly = '';
    if (myClassOnly) {
      readOnly = '<div class="readonly-note"><span>🔒</span><span><b>' + esc(className(cls)) + '은 보기 전용</b>이에요. 출석·메모·유의사항·기도제목은 ' +
        esc(teacherNamesText(cls)) + ' 선생님만 고칠 수 있어요.</span></div>';
    }

    // 생일 스트립
    var bStrip = '';
    if (bdays.length) {
      var names = bdays.map(function (k) { return k.name; }).join(', ');
      bStrip =
        '<button class="bday-strip" data-action="go-birthdays">' +
          '<span class="bday-ico">🎂</span>' +
          '<span class="bday-txt"><b>이달의 생일 ' + bdays.length + '명</b><small>' + esc(names) + '</small></span>' +
          '<span class="chev">›</span>' +
        '</button>';
    }

    // v1.7 — 이번 달 선생님 생일 스트립 (생일 축하를 챙기기 쉽게)
    var tStrip = '';
    var tBdays = teachersBirthdayIn(month);
    if (tBdays.length) {
      tStrip =
        '<button class="bday-strip t-strip" data-action="go-birthdays">' +
          '<span class="bday-ico">🎉</span>' +
          '<span class="bday-txt"><b>이번 달 선생님 생일 ' + tBdays.length + '명</b><small>' +
            esc(tBdays.map(function (x) { return x.t.name + ' ' + mdShort(x.b); }).join(' · ')) + '</small></span>' +
          '<span class="chev">›</span>' +
        '</button>';
    }

    // 아이 목록
    var list = '';
    visibleClasses.forEach(function (c) {
      var kids = kidsOf(c.id, dateKey);
      var st = countsFor(dateKey, c.id);
      list +=
        '<div class="group-head">' +
          '<span class="dot" style="background:' + classMeta(c.id).color + '"></span>' +
          '<span>' + esc(c.name) + '</span>' +
          '<span class="sub">' + (c.desc ? esc(c.desc) + ' · ' : '') + esc(teacherNamesText(c.id)) + '</span>' +
          '<span class="cnt">' + st.p + '/' + st.total + '</span>' +
        '</div>';
      if (c.id === NEW_FRIEND_CLASS && (isAdmin || canAddNewFriend(t))) {
        list += '<div class="nf-tip">🐣 적응이 끝난 친구는 카드 아래 <b>반 이름</b>을 누르면 바로 그 반으로 배정돼요 (사진을 눌러 <b>반 배정 / 이동</b>에서 골라도 돼요)</div>';
      }
      if (!kids.length) {
        list += '<div class="card empty"><img class="empty-lamb" src="assets/soonbok-wave.png" alt="순복이">아직 등록된 어린이가 없어요.</div>';
      } else {
        kids.forEach(function (k) { list += childHtml(k, t, dateKey); });
      }
    });

    // 새친구 등록은 새친구반 선생님과 임원(관리자)만 — 나머지 반은 버튼을 보여 주지 않는다
    var canAddKid = canAddNewFriend(t) && (isAdmin || cls === 'all' || cls === NEW_FRIEND_CLASS);
    var addBtn = canAddKid
      ? '<div class="data-note" style="text-align:center;padding:2px 6px 0">📸 동그린 사진을 누르면 아이 사진과 정보를 바로 넣을 수 있어요</div>' +
        '<button class="add-btn" data-action="new-friend">+ 새친구 등록</button>'
      : '';

    return noticeHtml() + dateBar + chips + summary + sbCardHtml(t) + rosterHtml(t, cls) + readOnly + bStrip + tStrip + gradStripHtml() +
      '<div class="section-title"><span>출석 명단 <small>' + esc(fmtLong(dateKey)) + ' ' + fmtWk(dateKey) + '</small></span></div>' +
      list + addBtn;
  }

  function chipHtml(id, label, count, active, locked) {
    return '<button class="chip' + (active ? ' active' : '') + '" data-action="class" data-class="' + id + '">' +
      (locked ? '<span class="lock">🔒</span>' : '') +
      '<span class="nm">' + esc(label) + '</span>' +
      '</button>';

  // v0.9 — 담당 선생님 명단 — 반마다 누가 맡고 있는지 누구나 보고, 필요하면 펼쳐서 전번을 본다
  function rosterHtml(t, cls) {

        '<span class="rh-ico">👩‍🏫</span>' +

  /* ---------- v1.8 — 관리 탭 명단 정리의 아이 줄 · 아래 버튼줄 ---------- */
  function selRowHtml(k) {
    var on = !!ui.selIds[k.id];

  function mgBarHtml() {

  function setSelRowState(el, on) {

  function refreshMgBar() {

  function childHtml(c, t, dateKey) {

              : '') +
            (c.traits
              ? '<button type="button" class="trait-pill" data-action="child-info" data-child="' + c.id + '" title="' + esc(c.traits) + '">' +
                  '<span>⚠️</span><span class="tx">' + esc(c.traits) + '</span></button>'

            (pr ? '<span class="pray-pill">🙏 기도제목</span>' : '') +

          '<div class="child-actions">' +

  /* ---------- 기도 탭 ---------- */
  function prayerCardsHtml(t, week, cls) {
    var scope = kidsOf(cls === 'all' ? null : cls);
    var order = {};
    data.classes.forEach(function (c, i) { order[c.id] = i; });
    var rows = [];
    scope.forEach(function (k) {
      var p = prayerOf(week, k.id);
      rows.push({ k: k, p: (p && p.text) ? p : null });
      var own = t.classId === k.classId ? 0 : 1;
      rows[rows.length - 1].own = own;
    });
    rows.sort(function (a, b) {
      if (a.own !== b.own) return a.own - b.own;
      var ca = order[a.k.classId] || 0, cb = order[b.k.classId] || 0;
      if (ca !== cb) return ca - cb;
      return a.k.name < b.k.name ? -1 : 1;
    });

    var withP = rows.filter(function (r) { return r.p; });
    var without = rows.filter(function (r) { return !r.p; });

    var cards = withP.map(function (r) {
      var k = r.k, p = r.p, meta = classMeta(k.classId);
      var on = iPrayed(p);
      var editable = canEdit(t, k.classId);
      return '' +
        '<div class="prayer-card' + (t.classId === k.classId ? ' mine' : '') + '">' +
          '<div class="pr-head">' +
            '<span class="nm">' + esc(k.name) + '</span>' +
            '<span class="pill" style="background:' + meta.soft + ';color:' + meta.color + '">' + esc(className(k.classId)) + '</span>' +
            (editable ? '<button class="edit" data-action="prayer-edit" data-child="' + k.id + '">✏️ 수정</button>' : '') +
          '</div>' +
          '<div class="pr-text">' + esc(p.text) + '</div>' +
          '<div class="pr-foot">' +
            '<span class="pr-by">' + esc(prayerByText(p)) + '</span>' +
            '<button class="amen-btn' + (on ? ' on' : '') + '" data-action="prayer-amen" data-child="' + k.id + '" data-week="' + week + '">' +
              '🙏 함께 기도했어요 <b>' + prayerCount(p) + '</b></button>' +
          '</div>' +
        '</div>';
    }).join('');

    var mineWithout = without.filter(function (r) { return canEdit(t, r.k.classId); });

      var meta = classMeta(r.k.classId);

        '<span class="pill" style="background:' + meta.soft + ';color:' + meta.color + '">' + esc(className(r.k.classId)) + '</span>' +
        '<button data-action="prayer-edit" data-child="' + r.k.id + '">+ 쓰기</button>' +
      '</div>';
    }).join('');

    return { cards: cards, withCount: withP.length, emptyRows: emptyRows, mineWithout: mineWithout.length, total: scope.length };
  }

    // 반별 현황

    // 4주 추이
    var weeks = [3, 2, 1, 0].map(function (k) { return iso(addDays(parseISO(sundayOf(dateKey)), -7 * k)); });

        chartSvg(weeks) +

      '<div class="section-title">이달의 생일 <small>' + (parseISO(dateKey).getMonth() + 1) + '월 · ' + bdays.length + '명</small></div>' +
      '<div class="card" style="padding:10px">' + bdayHtml + '</div>';

  function chartSvg(weeks) {
    var W = 340, H = 190, padL = 26, padR = 8, padT = 20, padB = 26;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var groupW = plotW / weeks.length;
    var n = Math.max(1, data.classes.length);
    var barW = n >= 5 ? 9 : (n === 4 ? 11 : 12);
    var gap = n >= 5 ? 3 : 4;
    var barsW = barW * n + gap * (n - 1);
    var out = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="최근 4주 반별 출석률 막대그래프">';

    [0, 50, 100].forEach(function (v) {
      var y = padT + plotH * (1 - v / 100);
      out += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '" stroke="#EFE6DA" stroke-width="1"' +
        (v === 0 ? '' : ' stroke-dasharray="3 4"') + '/>';
      out += '<text x="' + (padL - 6) + '" y="' + (y + 3.5) + '" text-anchor="end" font-size="9" fill="#B0A296">' + v + '</text>';
    });

    weeks.forEach(function (wk, i) {
      var cx = padL + groupW * i + groupW / 2;
      data.classes.forEach(function (c, j) {
        var st = countsFor(wk, c.id);
        var rate = st.total ? st.p / st.total : 0;
        var h = st.total ? Math.max(st.p > 0 ? 3 : 0, plotH * rate) : 0;
        var x = cx - barsW / 2 + j * (barW + gap);
        var y = padT + plotH - h;
        out += '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + Math.max(h, 0.6) + '" rx="3" fill="' +
          classMeta(c.id).color + '" opacity="' + (st.total ? 0.92 : 0.25) + '">' +
          '<title>' + esc(c.name) + ' ' + fmtMD(wk) + ' · ' + st.p + '/' + st.total + '명 (' + Math.round(rate * 100) + '%)</title></rect>';
      });
      var all = countsFor(wk, null);
      out += '<text x="' + cx + '" y="' + (padT - 7) + '" text-anchor="middle" font-size="10" font-weight="700" fill="#6B5C53">' + all.rate + '%</text>';
      out += '<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle" font-size="9.5" fill="#9B8B80">' + fmtMD(wk) + '</text>';
      if (i === weeks.length - 1) {
        out += '<circle cx="' + cx + '" cy="' + (H - 2) + '" r="2" fill="#DE8B62"/>';
      }
    });

    out += '</svg>';
    return out;
  }

  function adminHtml(t) {

    var exBirth = (gDate.getFullYear() - st.gradAge - 1) + '-' + pad2(st.gradMonth) + '-02';
    var exGrad = autoGraduation(exBirth);
    var settingsBlock =

  function afterLogin(cls) {
    ui.view = 'attendance';
    ui.memoOpen = null;
    ui.rosterOpen = false;
    resetSel();
    ui.cls = cls;
    ui.date = iso(mostRecentSunday(new Date()));
    ui.pWeek = sundayOf(ui.date);
    ui.pCls = 'all';
    var d = parseISO(ui.date);
    ui.bMonth = { y: d.getFullYear(), m: d.getMonth() + 1 };
    closeModal();
    render();
  }
  function loginAsAdmin(adminId) {
    var a = adminById(adminId);
    if (!a) return;
    session = { kind: 'admin', adminId: a.id };
    saveSession();
    afterLogin('all');
    toast('관리자(임원 · 교역자)로 입장했어요');
  }
  function loginAsClass(classId) {
    var c = classById(classId);
    if (!c) return;
    session = { kind: 'class', classId: classId };
    saveSession();
    afterLogin(classId);
    toast(c.name + ' · 교사로 입장했어요');
  }

  function logout() {
    session = null;
    saveSession();
    closeModal();
    ui.view = 'attendance';
    ui.memoOpen = null;
    ui.pWeek = null;
    resetSel();
    render();
  }

  function setStatus(childId, s, deferSave) {
    var key = ui.date;
    if (!data.attendance[key]) data.attendance[key] = {};
    var day = data.attendance[key];
    var rec = day[childId];
    if (!rec) { rec = { s: null, note: '', by: null, at: null }; day[childId] = rec; }
    rec.s = s;
    rec.by = session ? actorKey() : null;
    rec.at = Date.now();
    if (!rec.s && !rec.note) delete day[childId];
    if (!deferSave) save();
  }

  function toggleChild(childId) {
    var t = currentTeacher();
    var c = data.children.filter(function (x) { return x.id === childId; })[0];
    if (!t || !c || !canEdit(t, c.classId)) { toast('이 반은 보기 전용이에요.'); return; }
    var cur = statusOf(ui.date, childId);
    var next = cur === null ? 'p' : cur === 'p' ? 'a' : null;
    setStatus(childId, next);
    render();
  }

  function allPresent() {
    var t = currentTeacher();
    var cls = ui.cls;
    var kids = kidsOf(cls === 'all' ? null : cls, ui.date).filter(function (k) { return canEdit(t, k.classId); });
    if (!kids.length) { toast('출석 체크할 어린이가 없어요.'); return; }
    var scopeTxt = cls === 'all'
      ? (t.role === 'admin' ? '유아부 전체' : className(t.classId) + ' 내')
      : className(cls);
    openConfirm('모두 출석으로 표시할까요?',
      scopeTxt + ' ' + kids.length + '명을 출석으로 바꿔요. 결석한 어린이는 다시 눌러서 바꿀 수 있어요.',
      function () {
        kids.forEach(function (k) { setStatus(k.id, 'p'); });
        save(); closeModal(); render();

  function submitNewFriend(form) {
    var t0 = currentTeacher();
    if (!canAddNewFriend(t0)) { closeModal(); toast('새친구 등록은 새친구반 선생님과 임원(관리자)만 할 수 있어요.'); return; }
    var fd = new FormData(form);
    var name = String(fd.get('name') || '').trim();
    var birth = String(fd.get('birth') || '').trim();
    var monthsRaw = String(fd.get('months') || '').trim();
    var errEl = document.getElementById('nfError');

    function fail(msg) {
      if (errEl) { errEl.textContent = msg; errEl.hidden = false; }
    }
    if (!name) { fail('이름을 입력해 주세요.'); return; }
    if (!birth && !monthsRaw) { fail('생년월일이나 개월수 중 하나는 필요해요.'); return; }
    if (!birth) {
      var m = parseInt(monthsRaw, 10);
      if (!m || m < 1 || m > 96) { fail('개월수를 1~96 사이로 입력해 주세요.'); return; }
      var now = new Date();
      birth = birthFromAge(m, now.getMonth() + 1, Math.min(now.getDate(), 28));
    }

    var classId = String(fd.get('classId') || '');
    if (!classById(classId)) classId = data.classes[0].id;
    // 임원이 아니면 자기 반으로만 등록 (새친구반 선생님 → 새친구반)
    if (t0.role !== 'admin' && classId !== t0.classId) classId = t0.classId;

    var child = {
      id: 'n' + Date.now().toString(36),
      name: name,
      birth: birth,
      classId: classId,
      guardian: String(fd.get('guardian') || '').trim() || '연락처 미입력',
      note: String(fd.get('note') || '').trim(),
      traits: String(fd.get('traits') || '').trim().slice(0, 160),
      // 첫 방문일을 고르면 그 날부터 명단에 보이고, 새로 등록하면 오늘부터
      enrolled: (function () {
        var v = String(fd.get('firstVisit') || '').trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(v) && v <= todayISO()) return v;
        return ui.date && ui.date < todayISO() ? ui.date : todayISO();
      })()
    };
    if (draft && draft.photo) child.photo = draft.photo;
    // 졸업 예정을 직접 지정했으면 그 날짜를, 아니면 생년월일 기준 자동 계산을 쓴다
    var gMode0 = String(fd.get('gradMode') || 'auto');
    var gVal0 = String(fd.get('graduation') || '').trim();
    if (gMode0 === 'manual' && /^\d{4}-\d{2}-\d{2}$/.test(gVal0)) child.graduation = gVal0;
    data.children.push(child);

    if (fd.get('firstCheck')) setStatus(child.id, 'p', true);

    var ok = save(true);
    if (!ok && child.photo) { delete child.photo; ok = save(true); }   // 사진 때문에 용량이 찼다면 사진 없이 등록
    closeModal();
    if (ui.cls !== 'all') ui.cls = classId;
    ui.memoOpen = null;
    render();
    if (!ok) toast('저장 공간이 가득 차 저장하지 못했어요. 사진을 줄이거나 초기화 후 다시 시도해 주세요.');
    else toast(name + ' 어린이를 ' + className(classId) + '에 등록했어요 🎉');
  }

  /* ---------- 사진 블록 / 아이 정보 모달 ---------- */
  function photoPreviewInner(photo) {
    return photo ? '<img src="' + esc(photo) + '" alt="아이 사진">' : '👶';
  }
  function photoHintText(photo) {
    return photo
      ? '약 ' + photoKb(photo) + 'KB · 모든 기기에서 함께 보여요'
      : '동그린 얼굴 사진이 좋아요 · 자동으로 160px로 줄여 저장해요';
  }
  function photoToolsInner(photo) {
    return '<label class="photo-btn" for="photoInput">📷 ' + (photo ? '사진 바꾸기' : '사진 선택') + '</label>' +
      '<button type="button" class="photo-btn del" data-action="photo-remove"' + (photo ? '' : ' disabled') + '>사진 삭제</button>' +
      '<span class="photo-hint">' + photoHintText(photo) + '</span>';
  }
  /* ---------- v1.4 — 종이 등록카드 사진으로 자동 입력 ---------- */
  // 브라우저에서 사진을 줄여 Supabase Edge Function(scan-registration)으로 보내고,
  // 돌아온 항목을 입력칸에 채운다. 전송 전에 항상 긴 변 1280px JPEG로 줄인다.
  var CARD_MAX_FILE = 20 * 1024 * 1024;          // 원본 사진 허용 용량
  var CARD_TARGET_CHARS = 1300000;               // base64 문자열 상한(Edge Function 본문 여유)

  function scanEndpoint() {
    return SUPABASE_URL + '/functions/v1/scan-registration';
  }

  function scanBlockHtml() {
    return '<div class="scan-block">' +
      '<button type="button" class="scan-btn" id="scanBtn" data-action="scan-card">' +
        '<span class="ico">📷</span><span class="tx">등록카드 사진으로 자동 입력</span></button>' +
      '<input type="file" id="cardInput" class="photo-input" accept="image/*" capture="environment" aria-label="등록카드 사진 선택">' +
      '<div class="scan-note">종이 등록카드를 찍으면 이름·생년월일·보호자 연락처·메모를 채워 드려요. 저장 전에 꼭 확인해 주세요.</div>' +
      '<div class="scan-status" id="scanStatus" hidden></div>' +
    '</div>';
  }

  function setScanBusy(on, label) {
    var btn = document.getElementById('scanBtn');
    if (!btn) return;
    btn.disabled = !!on;
    if (on) btn.classList.add('busy'); else btn.classList.remove('busy');
    var tx = btn.querySelector('.tx');
    if (tx) tx.textContent = on ? (label || '사진 읽는 중...') : '등록카드 사진으로 자동 입력';
  }

  function showScanStatus(text, kind) {
    var el = document.getElementById('scanStatus');
    if (!el) return;
    if (!text) { el.hidden = true; el.textContent = ''; el.className = 'scan-status'; return; }
    el.hidden = false;
    el.textContent = text;
    el.className = 'scan-status' + (kind ? ' ' + kind : '');
  }

  function handleCardScan(input) {
    var file = input && input.files && input.files[0];
    try { input.value = ''; } catch (e) {}     // 같은 사진을 다시 고를 수 있도록
    if (!file || !draft) return;
    if (String(file.type || '').indexOf('image/') !== 0) {
      showScanStatus('사진 파일(JPG·PNG)만 올릴 수 있어요.', 'err');
      return;
    }
    if (file.size && file.size > CARD_MAX_FILE) {
      showScanStatus('사진이 너무 커요. 20MB 이하 사진으로 다시 골라 주세요.', 'err');
      return;
    }
    setScanBusy(true, '사진 읽는 중...');
    showScanStatus('사진을 읽고 있어요 · 보통 5~10초 걸려요');
    shrinkForScan(file, function (err, image) {
      if (err) { setScanBusy(false); showScanStatus(err, 'err'); return; }
      postScan(image);
    });
  }

  function shrinkForScan(file, cb) {
    if (typeof FileReader === 'undefined' || typeof Image === 'undefined') {
      cb('이 브라우저에서는 사진을 읽을 수 없어요.');
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var out = drawScan(img);
        if (out) cb(null, out);
        else cb('사진을 줄이지 못했어요. 다른 사진으로 다시 시도해 주세요.');
      };
      img.onerror = function () {
        cb('이 사진은 열 수 없어요. JPG나 PNG로 바꾼 뒤 다시 골라 주세요(아이폰 HEIC 사진).');
      };
      img.src = String(reader.result || '');
    };
    reader.onerror = function () { cb('사진을 읽지 못했어요. 다시 시도해 주세요.'); };
    reader.readAsDataURL(file);
  }

  function drawScanOnce(img, maxSide, quality) {
    try {
      var w = img.naturalWidth || img.width || 0;
      var h = img.naturalHeight || img.height || 0;
      if (!w || !h) return '';
      var scale = Math.min(1, maxSide / Math.max(w, h));
      var cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(w * scale));
      cv.height = Math.max(1, Math.round(h * scale));
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      return cv.toDataURL('image/jpeg', quality);
    } catch (e) {
      return '';
    }
  }

  // 긴 변 1280px부터 시작해 용량이 크면 한 단계씩 더 줄인다
  function drawScan(img) {
    var tries = [[1280, 0.85], [1280, 0.7], [1100, 0.62], [900, 0.55]];
    var best = '';
    for (var i = 0; i < tries.length; i++) {
      var url = drawScanOnce(img, tries[i][0], tries[i][1]);
      if (!url) continue;
      best = url;
      if (url.length <= CARD_TARGET_CHARS) break;
    }
    if (!best) return null;
    return { dataUrl: best, mimeType: 'image/jpeg' };
  }

  function postScan(image) {
    if (typeof fetch !== 'function') {
      setScanBusy(false);
      showScanStatus('이 브라우저에서는 사진 자동 입력을 쓸 수 없어요. 직접 입력해 주세요.', 'err');
      return;
    }
    var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var finished = false;
    var timer = setTimeout(function () {
      if (finished) return;
      finished = true;
      if (ctrl) ctrl.abort();
    }, 45000);

    fetch(scanEndpoint(), {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ imageBase64: image.dataUrl, mimeType: image.mimeType }),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (res) {
      return res.json().then(function (obj) { return obj; }, function () { return null; });
    }).then(function (obj) {
      clearTimeout(timer);
      finished = true;
      setScanBusy(false);
      if (!obj) { showScanStatus('사진을 읽지 못했어요. 잠시 뒤 다시 시도해 주세요.', 'err'); return; }
      if (!obj.ok) { showScanStatus(String(obj.error || '사진을 읽지 못했어요.'), 'err'); return; }
      fillFromCard(obj.data || {}, obj.warning);
    }).catch(function (e) {
      clearTimeout(timer);
      finished = true;
      setScanBusy(false);
      showScanStatus(e && e.name === 'AbortError'
        ? '사진 읽기가 오래 걸려 멈췄어요. 다시 시도해 주세요.'
        : '인터넷 연결을 확인한 뒤 다시 시도해 주세요.', 'err');
    });
  }

  // 메모에서 알레르기·주의 문장만 골라 유의사항 칸에 넣는다
  function cardWarningPart(notes) {
    var parts = String(notes || '').split(/[,\n·]/);
    for (var i = 0; i < parts.length; i++) {
      if (/알레르기|아토피|주의|특이/.test(parts[i])) {
        return parts[i].replace(/^[\s:：]+/, '').trim().slice(0, 160);
      }
    }
    return '';
  }

  function fillFromCard(d, warning) {
    var form = document.getElementById('newFriendForm') || document.getElementById('childForm');
    if (!form) return;
    var filled = [];
    function set(name, value) {
      if (!value) return;
      var el = form.querySelector('[name="' + name + '"]');
      if (!el) return;
      el.value = value;
      filled.push(name);
    }
    set('name', d.name);
    set('birth', d.birthDate);
    set('guardian', d.parentPhone);
    set('firstVisit', d.firstVisitDate && d.firstVisitDate <= todayISO() ? d.firstVisitDate : '');
    set('note', d.notes);
    set('traits', cardWarningPart(d.notes));
    if (typeof refreshGradField === 'function') refreshGradField();

    var labels = { name: '이름', birth: '생년월일', guardian: '보호자 연락처', firstVisit: '첫 방문일', note: '메모', traits: '유의사항' };
    if (!filled.length) {
      showScanStatus(warning || '사진에서 글자를 읽지 못했어요. 직접 입력해 주세요.', 'warn');
      return;
    }
    var names = filled.map(function (k) { return labels[k] || k; }).join('·');
    showScanStatus((warning ? warning + ' ' : '') + names + '을(를) 채웠어요 · 값이 맞는지 확인하고 저장해 주세요.',
      warning ? 'warn' : '');
  }

  function photoBlockHtml(editable) {

      '<input type="file" id="photoInput" class="photo-input" accept="image/*" aria-label="아이 사진 선택">' +
    '</div>';
  }
  // 모달을 다시 그리지 않고 사진 미리보기만 바꾼다(입력하던 이름·메모가 지워지지 않도록)
  function refreshPhotoPreview() {

  function handlePhotoPick(input) {

  function infoRow(label, valueHtml) {

  function recentStatHtml(c) {

  function prayerHistoryHtml(c, week, limit) {

  function prayerBlockHtml(c, can, week) {

  function submitChildInfo(form) {
    var t = currentTeacher();
    var c = draft && childById(draft.childId);
    var errEl = document.getElementById('ciError');
    function fail(msg) { if (errEl) { errEl.textContent = msg; errEl.hidden = false; } }
    if (!c) { closeModal(); return; }
    if (!canEdit(t, c.classId)) { fail('이 반 아이 정보는 해당 반 선생님만 바꿀 수 있어요.'); return; }

    var fd = new FormData(form);
    var name = String(fd.get('name') || '').trim();
    if (!name) { fail('이름을 입력해 주세요.'); return; }
    var birthIn = String(fd.get('birth') || '').trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(birthIn) || birthIn > todayISO()) {
      fail('생년월일을 정확히 넣어 주세요. 생년월일로 졸업 시기를 계산해요.'); return;
    }
    var gMode = String(fd.get('gradMode') || 'auto');
    var gradIn = String(fd.get('graduation') || '').trim();
    if (gMode === 'manual' && !/^\d{4}-\d{2}-\d{2}$/.test(gradIn)) {
      fail('졸업일을 골라 주세요. 생일로 계산하려면 [자동 계산]을 눌러 주세요.'); return;
    }
    var wantClass = String(fd.get('classId') || '');
    if (wantClass && wantClass !== c.classId && classById(wantClass) && !canMoveChild(t, c, wantClass)) {
      fail('반 이동은 관리자(임원)와 새친구반 담당 선생님만 할 수 있어요.'); return;
    }

    var before = c.photo || '';
    var next = draft.photo || '';
    var changedPhoto = next !== before;
    var fromClass = c.classId;

    c.name = name.slice(0, 20);
    c.birth = birthIn;
    c.guardian = String(fd.get('guardian') || '').trim() || '연락처 미입력';
    c.note = String(fd.get('note') || '').trim().slice(0, 200);
    c.traits = String(fd.get('traits') || '').trim().slice(0, 160);
    if (next) c.photo = next; else delete c.photo;

    // 이번 주 기도제목 — 내용이 바뀌었을 때만 저장·삭제한다
    var prayerVal = fd.get('prayer');
    if (prayerVal != null) {
      var pWeek = sundayOf(ui.date);
      var prevP = prayerOf(pWeek, c.id);
      var newText = String(prayerVal).trim();
      if (newText !== (prevP ? prevP.text : '')) setPrayer(pWeek, c.id, newText);
    }

    // 반 배정 / 이동 — 관리자, 또는 새친구반 담당 선생님(새친구반 → 정규 반)
    if (wantClass && wantClass !== c.classId && classById(wantClass)) {
      c.classId = wantClass;
    }

    // 첫 방문 · 졸업 예정 — 자동 계산이면 c.graduation 을 지워 생일 기준으로 돌린다
    var fv = String(fd.get('firstVisit') || '').trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(fv)) c.enrolled = fv;
    if (gMode === 'manual') c.graduation = gradIn; else delete c.graduation;

    var ok = save(true);
    if (!ok) {
      // 용량이 부족하면 사진·반 이동만 원래대로 되돌리고 나머지 정보는 살린다
      if (before) c.photo = before; else delete c.photo;
      c.classId = fromClass;
      var ok2 = save(true);
      fail(ok2
        ? '저장 공간이 부족해 사진은 저장하지 못했어요. 이름·메모는 저장했어요.'
        : '저장 공간이 가득 차 저장하지 못했어요. 사진을 몇 장 지운 뒤 다시 시도해 주세요.');
      render();
      return;
    }
    closeModal();
    render();
    if (c.classId !== fromClass) toast(classMoveMessage(c, fromClass, c.classId));
    else if (!changedPhoto) toast('아이 정보를 저장했어요');
    else toast(c.photo ? '사진을 저장했어요 📸' : '사진을 지웠어요');
  }

  /* ---------- v1.8 — 명단 일괄 삭제 (관리자 · 관리 탭) ---------- */
  function deleteChildrenByIds(ids) {
    var set = {};
    ids.forEach(function (id) { set[id] = true; });
    data.children = data.children.filter(function (x) { return !set[x.id]; });
    Object.keys(data.attendance || {}).forEach(function (day) {
      if (!data.attendance[day]) return;
      ids.forEach(function (id) { delete data.attendance[day][id]; });
    });
    Object.keys(data.prayers || {}).forEach(function (week) {
      if (!data.prayers[week]) return;
      ids.forEach(function (id) { delete data.prayers[week][id]; });
    });
  }

    if (!ids.length) { toast('지울 아이를 먼저 체크해 주세요.'); return; }
    var names = ids.map(function (id) { var k = childById(id); return k ? k.name : ''; });
    var listTxt = names.slice(0, 10).join(', ') + (names.length > 10 ? ' 외 ' + (names.length - 10) + '명' : '');
    openConfirm('선택한 ' + ids.length + '명을 명단에서 지울까요?',
      listTxt + ' — 이 아이들의 출석·메모·기도제목 기록도 함께 지워지고, 되돌릴 수 없어요.',
      function () {
        deleteChildrenByIds(ids);
        resetSel();
        save();
        closeModal();
        render();
        toast(ids.length + '명을 명단에서 지웠어요');
      }, '지우기');

  function submitTeacherForm(form) {
    if (!adminOnly()) { closeModal(); return; }
    var fd = new FormData(form);
    var name = String(fd.get('name') || '').trim();
    var errEl = document.getElementById('tfError');
    function fail(msg) { if (errEl) { errEl.textContent = msg; errEl.hidden = false; } }
    if (!name) { fail('이름을 입력해 주세요.'); return; }
    var phone = String(fd.get('phone') || '').trim() || phoneFor(name);
    var classId = editState ? editState.classId : null;

    // v1.7 — 생일 (월·일만) · 둘 다 비우면 생일 없음
    var bmo = String(fd.get('bmonth') || '').replace(/\D/g, '');
    var bda = String(fd.get('bday') || '').replace(/\D/g, '');
    var bmd = (bmo && bda) ? normBirthMD(bmo + '-' + bda) : '';
    if ((bmo || bda) && !bmd) { fail('생일을 월과 일 모두 골라 주세요 (예: 3월 14일).'); return; }

    var tr = editState && editState.id ? teacherById(editState.id) : null;
    var list = null;
    if (fd.get('hasClasses')) {
      list = data.classes.filter(function (c) { return !!fd.get('cls_' + c.id); }).map(function (c) { return c.id; });
    }
    if (tr) {
      tr.name = name.slice(0, 20);
      tr.phone = phone;
      if (list) tr.classIds = list;
      if (bmd) tr.birthday = bmd; else delete tr.birthday;
      toast(tr.name + ' 선생님을 ' + ((tr.classIds || []).length ? (tr.classIds || []).map(className).join(' · ') : '미배정') + '으로 저장했어요');
    } else {
      var id = 't' + Date.now().toString(36);
      var nt = { id: id, name: name.slice(0, 20), phone: phone, classIds: list || (classId ? [classId] : []) };
