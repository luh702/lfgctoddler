  /* ---------- v1.1 / v1.5 — 아이·선생님 끌어서 반 이동 ----------
     · PC(마우스·펜)           : Pointer Events
     · 손가락(안드로이드·아이폰): Touch Events — touchmove 에서 직접 preventDefault 해
       페이지 스크롤·iOS 고무줄 스크롤·길게 누르기 선택에 이벤트를 빼앗기지 않는다.
     · 두 경로는 같은 dnd 상태를 쓰고, 포인터 경로는 pointerType==='touch' 를 무시해
       한 번의 손가락 동작이 두 번 처리되지 않는다. */
  var DND_MOVE = 6;            // 이만큼 움직이면 '끌기'로 본다(그 전엔 그냥 탭)
  var dnd = {
    mode: '', on: false, kind: null, id: null, handle: null, row: null,
    ghost: null, bar: null, over: null, pid: null,
    sx: 0, sy: 0, lx: 0, ly: 0, label: '', sub: '', raf: 0, blockClickUntil: 0
  };

  // 떨어뜨릴 수 있는 곳인가 — 선생님은 '반 관리'의 반 카드와 아래 '놓을 반' 칩, 아이는 그 밖에 반별 명단 그룹도
  function dndAllowed(el) {
    if (!el || !el.getAttribute || !el.getAttribute('data-drop-class')) return false;
    if (el.classList.contains('dt-chip')) return true;
    if (dnd.kind === 'teacher') return el.classList.contains('admin-class');
    return true;
  }

  function dndZoneAt(x, y) {
    if (typeof x !== 'number' || typeof y !== 'number') return null;
    var el = document.elementFromPoint(x, y);
    while (el && el !== document.body) {
      if (el.getAttribute && el.getAttribute('data-drop-class')) return dndAllowed(el) ? el : null;
      el = el.parentElement;
    }
    return null;
  }

  // 누르기 시작한 곳이 손잡이(⠿)인지 확인하고, 끌 대상 정보를 잡아 둔다 (아직 끌기는 아님)
  function dndPrepare(e) {
    var target = e.target;
    var handle = (target && target.closest) ? target.closest('[data-drag]') : null;
    if (!handle) return false;
    var t = currentTeacher();
    if (!t || t.role !== 'admin') return false;      // 관리자(임원)만 반 이동
    var kind = handle.getAttribute('data-drag');
    var id = handle.getAttribute('data-id');
    if (!kind || !id) return false;
    var label, sub;
    if (kind === 'child') {
      var k = childById(id);
      if (!k) return false;
      label = k.name; sub = '다른 반에 놓으면 이동';
    } else {
      var tr = teacherById(id);
      if (!tr) return false;
      label = tr.name + ' 선생님'; sub = '반 카드나 반 이름 칩에 놓기';
    }
    dndCleanup();
    dnd.kind = kind; dnd.id = id; dnd.handle = handle;
    dnd.row = handle.closest('.move-row') || handle.closest('.mg-row');
    dnd.label = label; dnd.sub = sub; dnd.on = false;
    handle.classList.add('armed');
    return true;
  }

  // 끌기 시작 — 손가락(또는 마우스)이 화면에서 움직였다
  function dndBegin(x, y) {
    dnd.on = true;
    document.body.classList.add('dnd-on');
    if (dnd.row) dnd.row.classList.add('dnd-src');
    dnd.ghost = document.createElement('div');
    dnd.ghost.className = 'dnd-ghost';
    dnd.ghost.innerHTML = esc(dnd.label) + '<small>' + esc(dnd.sub) + '</small>';
    document.body.appendChild(dnd.ghost);
    dndBuildTargets();
    dndUpdate(x, y);
    dndAutoScroll();
  }

  // 화면 아래에 '놓을 반' 칩을 띄운다 — 반 카드가 화면 밖에 있어도 손가락으로 바로 놓을 수 있다
  function dndBuildTargets() {
    if (dnd.bar) return;
    var bar = document.createElement('div');
    bar.className = 'dnd-targets';
    bar.innerHTML =
      '<div class="dt-label">📚 ' + (dnd.kind === 'teacher' ? '이 선생님의 담당 반으로 놓기' : '옮길 반을 눌러 주세요') + '</div>' +
      '<div class="dt-chips">' + data.classes.map(function (c) {
        return '<button type="button" class="dt-chip" data-drop-class="' + c.id + '">' + esc(c.name) + '</button>';
      }).join('') + '</div>';
    document.body.appendChild(bar);
    dnd.bar = bar;
  }

  function dndUpdate(x, y) {
    dnd.lx = x; dnd.ly = y;
    if (dnd.ghost) {
      var w = dnd.ghost.offsetWidth || 120, h = dnd.ghost.offsetHeight || 40;
      var gx = Math.max(w / 2 + 6, Math.min(window.innerWidth - w / 2 - 6, x));
      var gy = Math.max(h + 18, Math.min(window.innerHeight - 8, y));
      dnd.ghost.style.left = gx + 'px';
      dnd.ghost.style.top = gy + 'px';
    }
    var zone = dndZoneAt(x, y);
    if (zone !== dnd.over) {
      if (dnd.over) dnd.over.classList.remove('dnd-over');
      dnd.over = zone;
      if (zone) zone.classList.add('dnd-over');
    }
  }

  // 화면 가장자리에서 계속 스크롤 — 손가락을 멈춰 있어도 목록이 흘러간다
  function dndAutoScroll() {
    if (!dnd.on) return;
    var vh = window.innerHeight, edge = 84, dy = 0;
    var overChip = !!(dnd.over && dnd.over.classList.contains('dt-chip'));
    if (!overChip) {
      if (dnd.ly < edge) dy = -Math.min(18, 5 + (edge - dnd.ly) / 4);
      else if (dnd.ly > vh - edge) dy = Math.min(18, 5 + (dnd.ly - (vh - edge)) / 4);
    }
    if (dy) {
      var before = window.scrollY;
      window.scrollBy(0, dy);
      if (window.scrollY !== before) dndUpdate(dnd.lx, dnd.ly);
    }
    dnd.raf = requestAnimationFrame(dndAutoScroll);
  }

  function dndFinish(x, y) {
    var kind = dnd.kind, id = dnd.id, wasOn = dnd.on;
    var zone = wasOn ? dndZoneAt(x, y) : null;
    var classId = zone ? zone.getAttribute('data-drop-class') : null;
    dndCleanup();
    if (!wasOn) return;
    dnd.blockClickUntil = Date.now() + 350;   // 손을 떼며 만들어지는 클릭이 수정 창을 열지 않게
    if (!classId) { toast('반 이름 위에 놓으면 그 반으로 옮겨져요'); return; }
    if (kind === 'child') moveChild(id, classId);
    else moveTeacher(id, classId);
  }

  function dndCleanup() {
    if (dnd.raf) { try { cancelAnimationFrame(dnd.raf); } catch (e) {} dnd.raf = 0; }
    if (dnd.handle) {
      try { if (dnd.pid != null) dnd.handle.releasePointerCapture(dnd.pid); } catch (e) {}
      dnd.handle.removeEventListener('pointermove', dndPointerMove);
      dnd.handle.removeEventListener('pointerup', dndPointerUp);
      dnd.handle.removeEventListener('pointercancel', dndPointerCancel);
      dnd.handle.classList.remove('armed');
    }
    if (dnd.ghost && dnd.ghost.parentNode) dnd.ghost.parentNode.removeChild(dnd.ghost);
    if (dnd.bar && dnd.bar.parentNode) dnd.bar.parentNode.removeChild(dnd.bar);
    if (dnd.over) dnd.over.classList.remove('dnd-over');
    if (dnd.row) dnd.row.classList.remove('dnd-src');
    document.body.classList.remove('dnd-on');
    dnd.on = false; dnd.mode = ''; dnd.handle = null; dnd.row = null; dnd.ghost = null;
    dnd.bar = null; dnd.over = null; dnd.pid = null; dnd.kind = null; dnd.id = null;
  }

  /* ---- PC: Pointer Events (마우스·펜). 손가락(pointerType==='touch')은 아래 터치 경로가 맡는다 ---- */
  function dndPointerDown(e) {
    if (e.pointerType === 'touch') return;                 // 중복 처리 방지
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (!dndPrepare(e)) return;
    dnd.mode = 'pointer'; dnd.pid = e.pointerId;
    dnd.sx = e.clientX; dnd.sy = e.clientY; dnd.lx = e.clientX; dnd.ly = e.clientY;
    try { dnd.handle.setPointerCapture(e.pointerId); } catch (err) {}
    dnd.handle.addEventListener('pointermove', dndPointerMove);
    dnd.handle.addEventListener('pointerup', dndPointerUp);
    dnd.handle.addEventListener('pointercancel', dndPointerCancel);
  }
  function dndPointerMove(e) {
    if (dnd.mode !== 'pointer' || dnd.pid !== e.pointerId || !dnd.handle) return;
    if (!dnd.on) {
      var dx = e.clientX - dnd.sx, dy = e.clientY - dnd.sy;
      if (Math.abs(dx) < DND_MOVE && Math.abs(dy) < DND_MOVE) return;
      dndBegin(e.clientX, e.clientY);
    }
    if (e.cancelable) e.preventDefault();
    dndUpdate(e.clientX, e.clientY);
  }
  function dndPointerUp(e) {
    if (dnd.mode !== 'pointer' || dnd.pid !== e.pointerId) return;
    dndFinish(e.clientX, e.clientY);
  }
  function dndPointerCancel(e) {
    if (dnd.mode !== 'pointer' || dnd.pid !== e.pointerId) return;
    dndCleanup();
  }

  /* ---- 손가락: Touch Events (안드로이드 크롬 · iOS 사파리) ---- */
  function dndTouchPoint(e) {
    var t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]);
    return t ? { x: t.clientX, y: t.clientY } : null;
  }
  function dndTouchStart(e) {
    if (e.touches && e.touches.length > 1) { dndCleanup(); return; }   // 두 손가락은 끌기가 아니다
    if (!dndPrepare(e)) return;
    dnd.mode = 'touch';
    var p = dndTouchPoint(e);
    if (!p) return;
    dnd.sx = p.x; dnd.sy = p.y; dnd.lx = p.x; dnd.ly = p.y;
  }
  function dndTouchMove(e) {
    if (dnd.mode !== 'touch' || !dnd.handle) return;
    var p = dndTouchPoint(e);
    if (!p) return;
    if (!dnd.on) {
      var dx = p.x - dnd.sx, dy = p.y - dnd.sy;
      if (Math.abs(dx) < DND_MOVE && Math.abs(dy) < DND_MOVE) return;
      dndBegin(p.x, p.y);
    }
    // 여기서 막지 않으면 iOS 사파리가 고무줄 스크롤·길게 누르기 선택으로 가져간다
    if (e.cancelable) e.preventDefault();
    dndUpdate(p.x, p.y);
  }
  function dndTouchEnd(e) {
    if (dnd.mode !== 'touch' || !dnd.handle) return;
    if (!dnd.on) { dndCleanup(); return; }     // 그냥 눌렀다 뗀 탭 — 아래 클릭(수정)은 그대로 살린다
    var p = dndTouchPoint(e);
    if (e.cancelable) e.preventDefault();
    dndFinish(p ? p.x : dnd.lx, p ? p.y : dnd.ly);
  }
  function dndTouchCancel() {
    if (dnd.mode !== 'touch') return;
    dndCleanup();
  }

  // 선생님을 반 카드에 놓으면 그 반 담당으로 (여러 반은 [수정]에서 체크)
  function moveTeacher(teacherId, classId) {
    if (!adminOnly()) return;
    var tr = teacherById(teacherId), c = classById(classId);
    if (!tr || !c) return;
    var cur = (tr.classIds || []).slice();
    if (cur.length === 1 && cur[0] === classId) { toast(tr.name + ' 선생님은 이미 ' + c.name + '이에요'); return; }
    var before = cur.length ? cur.map(className).join(' · ') : '미배정';
    tr.classIds = [classId];
    save();
    render();
    toast(tr.name + ' 선생님을 ' + before + '에서 ' + c.name + '으로 옮겼어요');
  }

  // 아이 반 이동 — 관리자(어디든) · 새친구반 담당 선생님(새친구반 → 정규 반만)
  function moveChild(childId, classId) {
    var c = childById(childId);
    if (!c || !classById(classId) || c.classId === classId) return;
    if (!canMoveChild(currentTeacher(), c, classId)) {
      toast('반 이동은 새친구반 담당 선생님과 관리자(임원)만 할 수 있어요.');
      return;
    }
    var fromId = c.classId;
    c.classId = classId;
    save();
    render();
    toast(classMoveMessage(c, fromId, classId));
  }

  // 새친구반 카드의 반 이름을 누르면 한 번 더 확인하고 바로 배정한다
  function confirmAssign(c, classId) {
    if (!canMoveChild(currentTeacher(), c, classId)) {
      toast('반 이동은 새친구반 담당 선생님과 관리자(임원)만 할 수 있어요.');
      return;
    }
    openConfirm(c.name + ' 어린이를 ' + className(classId) + '으로 배정할까요?',
      '새친구반에서 ' + className(classId) + '으로 옮기고 서버에도 바로 저장해요. 출석·메모·기도제목 기록은 그대로 따라갑니다.',
      function () { closeModal(); moveChild(c.id, classId); },
      className(classId) + '으로 배정');
  }

  // 반이 바뀔 때의 안내 문구 — 새친구반에서 정규 반으로는 '배정'이라고 말해 준다
  function classMoveMessage(c, fromId, toId) {
    if (fromId === NEW_FRIEND_CLASS && toId !== NEW_FRIEND_CLASS) {
      return c.name + ' 어린이를 ' + className(toId) + '으로 배정했어요 🎉';
    }
    if (toId === NEW_FRIEND_CLASS) {
      return c.name + ' 어린이를 새친구반으로 옮겼어요';
    }
    return c.name + ' 어린이를 ' + className(fromId) + '에서 ' + className(toId) + '으로 옮겼어요';
  }

  function resetData() {
    openConfirm('샘플 데이터로 초기화할까요?',
      '출석·아이 사진·새친구·반 배정 기록이 모두 지워지고 처음 샘플 상태로 돌아가요. 지금은 자료를 함께 쓰므로 선생님 모든 기기에 똑같이 적용돼요.',
      function () {
        data = seedData();
        save();
        ui.memoOpen = null;
        ui.pWeek = null;
        var t = currentTeacher();
        ui.cls = t && t.role === 'admin' ? 'all' : (t && t.classId) || 'all';
        closeModal();
        render();
        toast('샘플 데이터로 초기화했어요');
      });
  }

  /* ---------- 모달 / 토스트 ---------- */
  function openModal(inner) {
    var root = document.getElementById('modalRoot');
    root.innerHTML = '<div class="modal-backdrop" data-action="backdrop"><div class="modal" role="dialog" aria-modal="true">' + inner + '</div></div>';
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    var root = document.getElementById('modalRoot');
    if (root) root.innerHTML = '';
    document.body.style.overflow = '';
    confirmCb = null;
    draft = null;
    editState = null;
    pinState = null;
    // 다른 기기에서 온 변경이 창을 닫을 때까지 밀려 있었으면 지금 반영한다
    if (sync.needsRender) { sync.needsRender = false; render(); }
  }
  function openConfirm(title, body, cb, okLabel) {
    confirmCb = cb;
    openModal(
      '<div class="modal-head"><h3>' + esc(title) + '</h3>' +
      '<button class="x-btn" data-action="modal-close" aria-label="닫기">✕</button></div>' +
      '<p class="confirm-body">' + esc(body) + '</p>' +
      '<div class="modal-actions">' +
        '<button class="btn ghost" data-action="modal-close">취소</button>' +
        '<button class="btn primary" data-action="confirm-ok">' + esc(okLabel || '확인') + '</button>' +
      '</div>'
    );
  }
  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
  }

  /* =========================================================
     9. 이벤트
     ========================================================= */
  // 끌고 난 직후의 클릭은 삼킨다 — 손을 떼면서 줄/버튼이 눌려 수정 창이 열리는 것을 막는다
  document.addEventListener('click', function (e) {
    if (Date.now() < dnd.blockClickUntil) {
      dnd.blockClickUntil = 0;
      e.stopPropagation();
      e.preventDefault();
    }
  }, true);

  document.addEventListener('click', function (e) {
    // v1.5 — 줄 전체가 '수정'을 여는 줄에서 셀렉트·입력칸을 눌렀을 때는 그대로 둔다
    if (e.target && e.target.closest && e.target.closest('select,input,textarea')) return;
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var a = el.getAttribute('data-action');

    if (a === 'backdrop') {
      if (e.target === el) closeModal();
      return;
    }

    switch (a) {
      case 'admin-open':
        openAdminLogin();
        break;

      case 'pin-open': {
        var pKind = el.getAttribute('data-kind');
        var pId = el.getAttribute('data-id');
        if (pKind === 'class') openClassLogin(pId);
        else openPin(pKind, pId);
        break;
      }

      case 'pin-key':
        pinKey(el.getAttribute('data-key'));
        break;

      case 'pin-clear':
        pinBack();
        break;

      case 'pin-close':
        pinState = null;
        closeModal();
        break;

      case 'help-open':
        openHelp();
        break;

      case 'logout':
        logout();
        break;

      case 'tab':
        ui.view = el.getAttribute('data-tab');
        ui.memoOpen = null;
        resetSel();                         // v1.8 — 탭을 옮기면 체크 해제
        if (ui.view === 'birthdays') {
          var bd = parseISO(ui.date);
          ui.bMonth = { y: bd.getFullYear(), m: bd.getMonth() + 1 };
        }
        if (ui.view === 'prayers' && !ui.pWeek) ui.pWeek = sundayOf(ui.date);
        render();
        break;

      case 'date-prev':
      case 'date-next':
        ui.date = iso(addDays(parseISO(ui.date), a === 'date-prev' ? -7 : 7));
        ui.memoOpen = null;
        resetSel();                         // v1.8 — 주일을 옮기면 체크 해제
        render();
        break;

      case 'class':
        ui.cls = el.getAttribute('data-class');
        ui.memoOpen = null;
        resetSel();                         // v1.8 — 반을 옮기면 체크 해제
        render();
        break;

      case 'roster-toggle':
        ui.rosterOpen = !ui.rosterOpen;
        render();
        break;

      case 'grad-toggle':
        ui.gradOpen = (ui.gradOpen === false);
        render();
        break;

      case 'grad-past':
        ui.gradPastOpen = !ui.gradPastOpen;
        render();
        break;

      case 'pclass':
        ui.pCls = el.getAttribute('data-class');
        render();
        break;

      case 'toggle':
        toggleChild(el.getAttribute('data-child'));
        break;

      case 'all-present':
        allPresent();
        break;

      /* ---- v1.8 — 관리 탭 명단 정리 (일괄 선택 삭제) ---- */
      case 'mg-class':
        if (!adminOnly()) break;
        ui.mgCls = el.getAttribute('data-class') || 'all';
        resetSel();
        render();
        break;

      case 'sel-pick': {
        if (!adminOnly()) break;
        var selKid = el.getAttribute('data-child');
        if (!selKid) break;
        if (ui.selIds[selKid]) delete ui.selIds[selKid];
        else ui.selIds[selKid] = true;
        setSelRowState(el, !!ui.selIds[selKid]);
        refreshMgBar();
        break;
      }

      case 'sel-all': {
        if (!adminOnly()) break;
        var allOn = selAllOn();
        var idsAll = mgVisibleChildIds();
        if (allOn) idsAll.forEach(function (id) { delete ui.selIds[id]; });
        else idsAll.forEach(function (id) { ui.selIds[id] = true; });
        // 화면을 다시 그리지 않고 체크 표시만 바꾼다 (보던 자리를 지킨다)
        var srows = document.querySelectorAll('.mg-scroll .sel-row');
        for (var sri = 0; sri < srows.length; sri++) {
          setSelRowState(srows[sri], !!ui.selIds[srows[sri].getAttribute('data-child')]);
        }
        refreshMgBar();
        break;
      }

      case 'sel-del':
        bulkDeleteChildren();
        break;

      case 'memo': {
        var id = el.getAttribute('data-child');
        var kid = data.children.filter(function (x) { return x.id === id; })[0];
        if (!kid || !canEdit(currentTeacher(), kid.classId)) { toast('다른 반 메모는 그 반 선생님만 쓸 수 있어요.'); return; }
        ui.memoOpen = (ui.memoOpen === id) ? null : id;
        render();
        break;
      }

      case 'memo-done':
        ui.memoOpen = null;
        render();
        break;

      case 'new-friend':
        openNewFriend();
        break;

      case 'scan-card': {
        var ci = document.getElementById('cardInput');
        if (ci) ci.click();
        break;
      }

      case 'child-info':
        openChildInfo(el.getAttribute('data-child'));
        break;

      /* ---- v1.3 — 새친구반 카드에서 바로 반 배정 ---- */
      case 'assign-class': {
        var acKid = childById(el.getAttribute('data-child'));
        var acCls = el.getAttribute('data-class');
        if (!acKid || !acCls) break;
        confirmAssign(acKid, acCls);
        break;
      }

      /* ---- v1.3 — 졸업 예정: 자동 계산 ↔ 직접 지정 ---- */
      case 'grad-mode': {
        var gf = el.closest ? el.closest('[data-grad-field]') : null;
        var gForm = gf ? gf.closest('form') : null;
        if (!gForm) break;

  //  값이 없는(undefined·함수) 항목은 JSON과 같이 빼고 비교한다
  function canon(v) {
    var t = typeof v;
    if (v === null) return 'null';
    if (t === 'undefined' || t === 'function') return undefined;

    var sbRow = data.soonboki || {};

  function writeRow(key, value) {
    if (!data || value == null) return false;
    if (key === 'meta') {
      if (Array.isArray(value.admins) && value.admins.length) data.admins = value.admins;
      if (typeof value.version === 'number') data.version = value.version;
      if (typeof value.className === 'string') data.className = value.className;
      if (typeof value.classPinEnabled === 'boolean') data.classPinEnabled = value.classPinEnabled;
      if (value.settings) data.settings = normSettings(value.settings);
      return true;
    }
    if (key === 'classes') {
      if (!Array.isArray(value)) return false;
      // 반은 이름·소개·PIN(과 새로 만든 반의 색·이모지)만 둔다 (예전 저장값의 연령 표시는 버린다)
      data.classes = orderClasses(value.map(function (c) {
        var x = { id: c.id, name: c.name || '반', desc: (typeof c.desc === 'string') ? c.desc.slice(0, 40) : '', pin: normPin(c.pin, CLASS_PINS[c.id] || '1111') };
        if (typeof c.color === 'string' && /^#[0-9A-Fa-f]{6}$/.test(c.color)) x.color = c.color;
        if (typeof c.soft === 'string' && /^#[0-9A-Fa-f]{6}$/.test(c.soft)) x.soft = c.soft;
        if (typeof c.emoji === 'string' && c.emoji) x.emoji = c.emoji.slice(0, 4);
        return x;
      }));
      return true;
    }
    if (key === 'teachers') { if (!Array.isArray(value)) return false; data.teachers = value; return true; }
    if (key === 'children') { if (!Array.isArray(value)) return false; data.children = value; return true; }
    // v2.1 — 순복이 기록 · 선생님 기도제목 (형식만 다듬어 그대로 받는다)
    if (key === SB_ROW_KEY) { data.soonboki = normSoonboki(value); return true; }
    if (key === TP_ROW_KEY) { data.teacherPrayers = normTeacherPrayers(value); return true; }
    if (key.indexOf('att:') === 0) {
      if (!data.attendance) data.attendance = {};
      data.attendance[key.slice(4)] = (value && typeof value === 'object') ? value : {};
      return true;
    }
    if (key.indexOf('prayer:') === 0) {
      if (!data.prayers) data.prayers = {};
      data.prayers[key.slice(7)] = (value && typeof value === 'object') ? value : {};

  function mergeRecords(localMap, remoteMap, isPrayer) {
    var out = {};
    remoteMap = remoteMap || {}; localMap = localMap || {};
    Object.keys(remoteMap).forEach(function (id) { out[id] = remoteMap[id]; });
    Object.keys(localMap).forEach(function (id) {

      if (!b) { out[id] = a; return; }
      var ta = Number(a && a.at) || 0, tb = Number(b && b.at) || 0;
      var pick = (ta >= tb) ? a : b;
      if (isPrayer && a && b) {

  //  force=true (첫 연결): 서버에 있는 자료가 이 기기 자료보다 우선한다
  function applyRows(rows, force) {
    var changed = false;
    (rows || []).forEach(function (row) {
      if (!row || !row.key) return;
      var key = String(row.key);
      var rev = Number(row.rev) || 0;
      if (sync.revs[key] != null && rev <= sync.revs[key]) return;      // 이미 반영한 차례
      if (force) {
        if (writeRow(key, row.data)) changed = true;
        sync.base[key] = canon(row.data);
        sync.revs[key] = rev;
        return;
      }
      var localValue = rowsFromData()[key];
      var dirty = sync.base[key] !== canon(localValue);          // 이 기기에서 고친 내용이 아직 안 올라갔다
      if (dirty && isWeekKey(key)) {
        writeRow(key, mergeRecords(localValue, row.data, key.indexOf('prayer:') === 0));
        sync.base[key] = canon(row.data);
        sync.revs[key] = rev;
        changed = true;
        schedulePush(120);
      } else if (dirty) {
        sync.revs[key] = rev;
        changed = true;
        schedulePush(120);
      } else {
        if (writeRow(key, row.data)) changed = true;
        sync.base[key] = canon(row.data);
        sync.revs[key] = rev;
      }
    });
    return changed;
  }

    var up = [], del = [];
    Object.keys(rows).forEach(function (k) {
      if (sync.base[k] !== canon(rows[k])) up.push(k);
    });
    Object.keys(sync.base).forEach(function (k) { if (!(k in rows)) del.push(k); });
    if (!up.length && !del.length) {
      if (sync.pulled) setSyncStatus('saved');
      return;
    }

    sync.busy = true;
    setSyncStatus('saving');
    var now = Date.now();
    var payload = up.map(function (k) {
      return { key: k, data: rows[k], rev: Math.max(now, (sync.revs[k] || 0) + 1), updated_by: syncDeviceId() };
    });

    var step = Promise.resolve();
    if (payload.length) {
      step = step.then(function () { return sb.from(SYNC_TABLE).upsert(payload, { onConflict: 'key' }); });
    }
    if (del.length) {
      step = step.then(function () { return sb.from(SYNC_TABLE).delete().in('key', del); });
    }

    step.then(function (res) {
      if (res && res.error) throw new Error(res.error.message || 'upsert failed');
      payload.forEach(function (row) {
        sync.revs[row.key] = row.rev;
        sync.base[row.key] = canon(row.data);
      });
      del.forEach(function (k) { delete sync.base[k]; delete sync.revs[k]; });
      try { window.localStorage.removeItem(SYNC_PENDING_KEY); } catch (e) {}
      setSyncStatus('saved');
      broadcastKeys(up.concat(del));
      if (sync.again) { sync.again = false; schedulePush(120); }
    }).catch(function (err) {
      sync.lastError = (err && err.message) || String(err);
      saveFailed();
    }).then(function () {
      sync.busy = false;
    });
  }

  /* ---------- 서버에서 이 기기로 ---------- */
  function pullAll(done, force) {
    if (!sb) { if (done) done(new Error('no client')); return; }
    sb.from(SYNC_TABLE).select('key,data,rev').then(function (res) {
      if (res.error) { if (done) done(res.error); return; }
      var changed = applyRows(res.data || [], force);
      if (done) done(null, changed);
    }).catch(function (err) { if (done) done(err); });
  }

  function pullKeys(keys, done) {
    if (!sb) return;
    var q = sb.from(SYNC_TABLE).select('key,data,rev');
    if (keys && keys.length) q = q.in('key', keys);
    q.then(function (res) {
      if (res.error) { saveFailed(); return; }
      var changed = applyRows(res.data || []);
      if (changed) refreshAfterSync();
      else paintSync();
      if (done) done();
    }).catch(function () { saveFailed(); });
  }

  /* ---------- 실시간 알림 ---------- */
  function broadcastKeys(keys) {
    if (!sync.channel || !keys || !keys.length) return;
    try {
      sync.channel.send({ type: 'broadcast', event: 'changed', payload: { keys: keys, from: syncDeviceId() } });
    } catch (e) { /* 방송 실패해도 주기 확인이 있다 */ }
  }

  function subscribeRealtime() {
    if (!sb) return;
    try {
      var ch = sb.channel(SYNC_CHANNEL_NAME, { config: { broadcast: { self: false } } });
      ch.on('broadcast', { event: 'changed' }, function (msg) {
        var keys = (msg && msg.payload && msg.payload.keys) || null;
        pullKeys(keys);
      });
      ch.on('postgres_changes', { event: '*', schema: 'public', table: SYNC_TABLE }, function (p) {
        var row = (p && p.new) || null;
        if (row && row.updated_by === syncDeviceId()) return;    // 내가 올린 것은 이미 반영됨
        pullKeys(row && row.key ? [row.key] : null);
      });
      ch.subscribe();
      sync.channel = ch;
    } catch (e) { /* 실시간을 못 켜도 주기 확인으로 동기화된다 */ }
  }

  function startPolling() {
    if (sync.pollTimer) return;
    sync.pollTimer = setInterval(function () {
      if (document.hidden || !sb) return;
      sb.from(SYNC_TABLE).select('key,rev').then(function (res) {
        if (res.error) return;
        var need = [];
        (res.data || []).forEach(function (r) {
          if (sync.revs[r.key] == null || Number(r.rev) > sync.revs[r.key]) need.push(r.key);
        });
        if (need.length) pullKeys(need);
      }).catch(function () {});
    }, 30000);
  }

  /* ---------- 시작 · 첫 동기화 ---------- */
  function restorePending() {
    var raw = safeGet(SYNC_PENDING_KEY);
    if (!raw) return null;
    try {
      var p = JSON.parse(raw);
      return (p && p.rows && Object.keys(p.rows).length) ? p.rows : null;
    } catch (e) { return null; }
  }

  function syncConnect() {
    if (sb) { return; }
    try {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: false, autoRefreshToken: false }
      });
    } catch (e) { sb = null; sync.started = false; setSyncStatus('local'); return; }

    sync.started = true;
    setSyncStatus('start');
    firstSync();
  }

  // 첫 동기화 — 서버 자료를 먼저 받아온 뒤, 이 기기에만 있는 내용을 올린다
  function firstSync() {
    if (!sb) return;
    var pending = restorePending();
    pullAll(function (err) {
      if (err) {
        setSyncStatus('error');
        if (firstSyncTimer) return;
        firstSyncTimer = setTimeout(function () { firstSyncTimer = null; firstSync(); }, 8000);
        return;
      }
      sync.pulled = true;
      // 지난번에 못 올린 변경은 이 기기 내용을 살려 다시 올린다
      if (pending) {
        Object.keys(pending).forEach(function (k) {
          if (isWeekKey(k)) writeRow(k, mergeRecords(rowsFromData()[k], pending[k], k.indexOf('prayer:') === 0));
          else writeRow(k, pending[k]);
        });
      }

      refreshAfterSync();
      subscribeRealtime();
      startPolling();
      schedulePush(0);
      setSyncStatus('saved');
    }, true);
  }

  var firstSyncTimer = null;

  function syncStart() {
    if (sync.booted) return;
    sync.booted = true;
    // v2.1 — ?local=1 : 이 기기에만 저장하는 시험·시연 모드 (서버에 아무것도 올리지 않는다)
    if (LOCAL_ONLY) { setSyncStatus('local'); return; }
    // 진단용 — 앱은 이 값을 쓰지 않는다 (브라우저 콘솔에서 상태 확인)
    try {
      window.__lfgcSync = {
        state: function () {
          return {
            started: sync.started, pulled: sync.pulled, status: sync.status,
            error: sync.lastError, channel: !!sync.channel, pollTimer: !!sync.pollTimer,
            revs: sync.revs, baseKeys: Object.keys(sync.base)
          };
        },
        pull: function () { pullKeys(null, function () { render(); }); },
        push: function () { pushChanges(); },
        diff: function (k) {
          var local = canon(rowsFromData()[k]);
          return { key: k, base: sync.base[k], local: local, same: sync.base[k] === local };
        },
        pending: function () { var p = restorePending(); return p ? Object.keys(p) : null; }
      };
    } catch (e) {}
    if (window.supabase && window.supabase.createClient) { syncConnect(); return; }
    // CDN이 아직이거나 막혔을 때 — 늦게라도 오면 연결한다
    window.__sbReady = function () { syncConnect(); };
    setTimeout(function () { if (!sb || !sync.started) setSyncStatus('local'); }, 12000);
  }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && sync.started && sb) pullKeys(null);
  });
  window.addEventListener('online', function () {
    if (sync.started && sb) pullKeys(null);
  });

  /* =========================================================
     10. 시작
     ========================================================= */
  function init() {
    data = loadData();
    session = loadSession();
    if (session) {
      var t = currentTeacher();
      if (t) {
        ui.cls = t.role === 'admin' ? 'all' : (t.classId || (data.classes[0] && data.classes[0].id));
      } else { session = null; }
    }
    ui.date = iso(mostRecentSunday(new Date()));
    ui.pWeek = sundayOf(ui.date);
    var d = parseISO(ui.date);
    ui.bMonth = { y: d.getFullYear(), m: d.getMonth() + 1 };
    render();
    syncStart();                        // v1.0 — 공유 DB에서 자료 받아오기 시작
  }

  init();
})();
</script>
</body>
</html>
