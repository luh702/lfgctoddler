<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta property="og:title" content="런던순복음교회 유아부 출석부">
<meta property="og:description" content="런던순복음교회 유아부 반별 출석체크 및 기도제목 관리">
<meta property="og:type" content="website">
<meta property="og:site_name" content="런던순복음교회 유아부">
<meta property="og:image" content="https://luh702.github.io/lfgctoddler/assets/soonbok-wave.png">
<meta property="og:image:alt" content="런던순복음교회 유아부 마스코트 순복이">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* =========================================================
   런던순복음교회 유아부 주일 출석체크 — 시범용 프로토타입
   single file / vanilla HTML+CSS+JS / localStorage
   v0.5 — 반별 로그인 + 임원(관리자) 로그인 · 유의사항 · 주간 기도제목
   v0.6 — PIN 깜빡임 제거 · 반은 확인 한 번으로 입장(잠금은 선택) · 새친구 등록 권한
   v0.7 — 로그인 첫 화면은 반 카드 중심 · 임원은 작은 [관리] 버튼 → 명단 → PIN · 반 순서 고정
   v0.8 — 임원 계정을 하나(관리자 · 임원·교역자)로 통합 · [관리자 입장] → 바로 4자리 PIN
          관리 탭은 '관리자 비밀번호(PIN) 변경' 카드 하나
   v0.9 — 선생님 개인 로그인 없이 '반'으로 입장 · 담당 선생님 명단 보기
          관리 탭에서 선생님 추가·수정·삭제, 반 이름·PIN 관리, 아이 삭제 (관리자 전체 권한)
   v1.0 — Supabase 실시간 공유 저장 (모든 기기·선생님이 같은 자료) · 오프라인은 기기 저장 후 자동 재전송
   v1.3 — 졸업 예정 생년월일 자동 계산 + 직접 지정(자동 복귀) · 새친구반 카드에서 원탭 반 배정
   v1.4 — 등록카드 사진으로 자동 입력(📷 Gemini 비전) · 졸업 예정자 카드 강조
   v1.5 — 반 소개(한 줄 설명) 기본값 비움 · 반 입장 창은 '담당 선생님' 이름 순서
          🎓 졸업 예정자 모아보기 · 손가락(안드로이드·아이폰) 드래그·수정 개선
   v1.6 — 관리 탭에서 직접: 반 추가·삭제·순서(▲▼) · 부서 제목 · 교사 한 줄 공지
          졸업 기준(월·나이) 설정 · 모두 app_state(meta)로 모든 기기에 바로 반영
   v1.7 — 명단 일괄 선택 삭제(관리자 · 출석 탭 ☑️ 선택) · 선생님 생일(월·일만) 등록과
          이번 달 생일 모아보기(관리 카드 · 출석 스트립 · 생일 탭) — teachers 행 birthday
   v1.8 — 명단 일괄 정리(선택 삭제)를 출석 탭에서 관리 탭으로 옮김 — 출석 화면은 출석 체크만
          관리 탭 '명단 정리'에서 반별 필터·체크·전체 선택/해제·선택 삭제
   v1.9 — 졸업 표기를 '올해 졸업 · 내년 졸업'으로 (졸업 예정·D-day·남은 개월 표시 없음)
          나이도 '몇 개월' 없이 'N세'로만 — 아이 카드·생일·명단·정보 창 공통
   v2.0 — 교회 마스코트 '순복이' 캐릭터를 앱 곳곳에 (머리글 얼굴 · 로그인 인사 · 생일 ·
          관리 · 졸업 카드 · PIN 창) · 머리글 [?]나 순복이 얼굴을 누르면 '순복이의 사용법 안내'
   v2.1 — 🐑 순복이 가져간 친구: 로그인 화면 맨 위 카드 + 출석 화면 카드 → 주일별 기록·지난 기록 ·
          반에 입장하면 누가 가져갔는지 원탭 선택(관리자는 모든 반) · 한 줄 메모
          🙏 선생님 기도제목: 기도 탭·관리 탭에서 선생님별로 쓰고 함께 보기(관리자 PIN 불필요)
          ?local=1 로 열면 이 기기에만 저장하는 시험 모드(서버에는 아무것도 올리지 않음)
   ========================================================= */
:root{
  --bg:#FAF6EF;
  --bg-soft:#F4EDE2;
  --card:#FFFFFF;
  --ink:#3A2F2A;
  --ink-soft:#6B5C53;
  --muted:#9B8B80;
  --line:#EFE6DA;
  --primary:#DE8B62;
  --primary-dark:#C97550;
  --primary-soft:#FBEDE4;
  --present:#5FA97C;
  --present-soft:#EAF6EE;
  --absent:#D4787F;
  --absent-soft:#FBECEE;
  --unchecked:#A99C92;
  --unchecked-soft:#F1EBE3;
  --radius:18px;
  --shadow:0 8px 24px rgba(122,96,72,.08);
  --shadow-sm:0 2px 8px rgba(122,96,72,.07);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:#EFE7DA;color:var(--ink);
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans CJK KR','Malgun Gothic','맑은 고딕',sans-serif;
  font-size:15px;line-height:1.45;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[hidden]{display:none !important}

#app{
  max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);
  position:relative;overflow-x:clip;
}
@media (min-width:520px){
  #app{box-shadow:0 20px 60px rgba(90,70,50,.14),0 0 0 1px rgba(90,70,50,.04)}
}

/* ---------------- 로그인 ---------------- */
.login{
  min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  padding:34px 22px calc(26px + env(safe-area-inset-bottom));
  background:
    radial-gradient(120% 55% at 50% -5%, #FFF3E2 0%, rgba(255,243,226,0) 62%),
    radial-gradient(90% 40% at 50% 105%, #FDF0E7 0%, rgba(253,240,231,0) 70%),
    var(--bg);
}
.login-top{text-align:center;margin-bottom:26px}
.login-mark{
  width:78px;height:78px;border-radius:27px;background:#fff;margin:0 auto 16px;
  display:grid;place-items:center;font-size:38px;box-shadow:var(--shadow);
  border:1px solid #fff;
}
.login-top h1{font-size:21px;font-weight:800;letter-spacing:-.4px;line-height:1.3}
.login-top h1 span{color:var(--primary-dark)}
.login-top p{margin-top:7px;color:var(--muted);font-size:13px;font-weight:500}
.login-note{
  margin-top:20px;text-align:center;font-size:11.5px;line-height:1.6;color:var(--muted);
  background:rgba(255,255,255,.6);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;
}
.login-ver{text-align:center;font-size:10.5px;color:#B7AAA0;margin-top:14px;letter-spacing:.2px}
@media (max-height:650px){ .login{justify-content:flex-start;padding-top:22px} .login-mark{width:64px;height:64px;font-size:31px;margin-bottom:12px} .login-top{margin-bottom:18px} }
/* PIN 시트 · 반 카드 5개가 세로로는 좁은 화면에서도 잘리지 않고 스크롤되도록 */
@media (max-height:820px){ .login{justify-content:flex-start;padding-top:28px} }
@media (max-height:740px){
  .login{padding-top:24px;padding-bottom:18px}
  .login-mark{width:64px;height:64px;font-size:31px;margin-bottom:11px;border-radius:22px}
  .login-top{margin-bottom:14px}
  .login-top h1{font-size:19px}
  .login-top p{margin-top:5px;font-size:12px}
  .login-note{margin-top:13px;padding:10px 12px}
  .login-ver{margin-top:10px}
}

/* ================= v0.5 — 로그인 2단 · PIN · 기도 · 유의사항 ================= */
.login-sec{margin-top:16px}
.login-sec:first-of-type{margin-top:0}
.sec-head{
  display:flex;align-items:center;gap:6px;padding:0 3px 8px;
  font-size:12px;font-weight:800;color:var(--ink-soft);letter-spacing:-.2px;
}
.sec-head .ico{font-size:14px}
.sec-head span{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--muted)}
.class-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.class-grid > .class-card:last-child:nth-child(odd){grid-column:1 / -1}
.class-card{
  display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px 12px 11px;
  background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow-sm);
  transition:transform .12s ease,box-shadow .12s ease;min-width:0;
}
.class-card:active{transform:scale(.98);box-shadow:none}
.cc-top{display:flex;align-items:center;gap:7px;min-width:0}
.cc-emoji{
  width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex:0 0 auto;
}
.cc-name{min-width:0;font-size:14px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-lock{margin-left:auto;font-size:10px;opacity:.55;flex:0 0 auto}
.cc-meta{font-size:10.5px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-teachers{font-size:10.5px;line-height:1.45;color:var(--ink-soft);font-weight:700;min-height:15px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc-foot{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);font-weight:700;margin-top:1px}
.cc-dot{width:6px;height:6px;border-radius:99px;display:inline-block}

/* PIN 입력 시트 */
.pin-wrap{text-align:center}
.pin-who{display:flex;flex-direction:column;align-items:center;gap:7px;margin:2px 0 14px}
.pin-who .cc-emoji{width:48px;height:48px;border-radius:16px;font-size:24px}
.pin-who b{font-size:17px;font-weight:800;letter-spacing:-.3px}
.pin-who small{font-size:11.5px;color:var(--muted);font-weight:700}
.pin-dots{display:flex;justify-content:center;gap:13px;margin:4px 0 6px}
.pin-dot{
  width:15px;height:15px;border-radius:50%;border:1.5px solid #DCCFC2;background:#fff;transition:all .12s;
}
.pin-dot.on{background:var(--primary);border-color:var(--primary);transform:scale(1.06)}
.pin-err{height:17px;font-size:11.5px;font-weight:800;color:var(--absent);margin:2px 0 6px}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:290px;margin:0 auto}
.pin-key{
  height:52px;border-radius:15px;background:#fff;border:1px solid var(--line);
  font-size:20px;font-weight:800;color:var(--ink);box-shadow:var(--shadow-sm);
}
.pin-key:active{background:var(--primary-soft)}
.pin-key.fn{font-size:14px;color:var(--ink-soft);background:#FBF7F0}
.pin-key:disabled{opacity:.35}
.pin-demo{
  margin:13px auto 0;max-width:290px;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 11px;border-radius:12px;background:#F1FAF8;border:1px dashed #CBE9E1;
  color:#2E7E70;font-size:11px;font-weight:800;
}
/* 잠금이 켜졌을 때 반 카드 안내 */
.cc-lock:empty{display:none}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
.pin-wrap.shake .pin-dots{animation:shake .34s}

/* 유의사항 / 기도 배지 */
.trait-pill{
  display:inline-flex;align-items:center;gap:4px;max-width:100%;margin-top:5px;
  padding:3px 8px;border-radius:999px;background:#FFF3E4;border:1px solid #F3DEC2;
  color:#A2673A;font-size:10.5px;font-weight:800;letter-spacing:-.2px;
}
.trait-pill .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pray-pill{
  display:inline-flex;align-items:center;gap:4px;margin-top:5px;margin-left:4px;
  padding:3px 8px;border-radius:999px;background:#F1EEFB;border:1px solid #DED7F5;
  color:#6A5CAE;font-size:10.5px;font-weight:800;
}
.trait-box{
  padding:11px 12px;border-radius:13px;background:#FFF8EE;border:1px solid #F3E2C9;
  color:#8A5E33;font-size:12px;font-weight:700;line-height:1.55;margin-bottom:12px;
}
.trait-box b{display:block;font-size:10.5px;color:#B07B45;margin-bottom:3px;letter-spacing:.1px}

/* 기도 탭 */
.week-nav{display:flex;align-items:center;gap:8px;padding:9px}
.week-nav .mn-btn{width:40px;height:44px;border-radius:12px;border:1px solid var(--line);background:#FFFDF9;font-size:16px;color:var(--ink-soft);flex:0 0 auto}
.week-nav .wk-mid{flex:1;min-width:0;text-align:center}
.week-nav .wk-mid b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.3px}
.week-nav .wk-mid small{display:block;font-size:10.5px;color:var(--muted);font-weight:700;margin-top:1px}
.prayer-card{
  background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);
  padding:12px 13px;margin-top:8px;
}
.prayer-card.mine{border-color:#E2DCF7;background:linear-gradient(0deg,#FBF9FF,#FFFFFF)}
.pr-head{display:flex;align-items:center;gap:8px;min-width:0}
.pr-head .nm{min-width:0;font-size:14px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-head .pill{flex:0 0 auto}
.pr-head .edit{margin-left:auto;flex:0 0 auto;font-size:10.5px;font-weight:800;color:var(--primary-dark);background:var(--primary-soft);border-radius:999px;padding:4px 9px}
.pr-text{margin-top:7px;font-size:12.5px;line-height:1.6;color:#4A3D36;font-weight:600;white-space:pre-wrap;word-break:break-word}
.pr-foot{display:flex;align-items:center;gap:8px;margin-top:9px}
.pr-by{font-size:10px;color:var(--muted);font-weight:700}
.amen-btn{
  margin-left:auto;display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;
  padding:6px 11px;border-radius:999px;border:1px solid #DED7F5;background:#F6F4FD;
  color:#6A5CAE;font-size:11px;font-weight:800;
}
.amen-btn.on{background:#6A5CAE;border-color:#6A5CAE;color:#fff}
.amen-btn:active{transform:scale(.97)}
.prayer-note{
  padding:10px 12px;border-radius:13px;background:#F6F4FD;border:1px dashed #DED7F5;
  color:#6A5CAE;font-size:11px;font-weight:700;line-height:1.55;
}
.pr-empty{
  border:1px dashed #E4CBB0;border-radius:14px;background:#FFFDF8;
  padding:10px 12px;margin-top:8px;display:flex;align-items:center;gap:8px;
}
.pr-empty .nm{flex:1;min-width:0;font-size:12.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-empty button{flex:0 0 auto;font-size:11px;font-weight:800;color:var(--primary-dark);background:var(--primary-soft);border-radius:999px;padding:5px 10px}

/* 관리 탭 — 관리자·선생님 관리 */
.mg-list{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow-sm)}
.mg-row{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid #F6F0E7}
.mg-row:last-child{border-bottom:0}
.mg-row .who{flex:1;min-width:0}
.mg-row .who b{display:block;font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mg-row .who small{display:block;font-size:10.5px;color:var(--muted);font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mg-row .pin-chip{flex:0 0 auto;font-size:10px;font-weight:800;color:#7A6757;background:#F6F0E7;border-radius:999px;padding:3px 8px;letter-spacing:.5px}
.mini-btn{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:3px;min-height:36px;padding:7px 11px;font-size:11.5px;font-weight:800;color:var(--ink-soft);background:#FBF7F0;border:1px solid var(--line);border-radius:999px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mini-btn:active{background:#F1E7D8}
.mini-btn.icon{min-width:36px;padding:7px 8px;font-size:13px}
.teacher-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tchip{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:#FBF7F0;border:1px solid var(--line);font-size:10.5px;font-weight:800;color:var(--ink-soft)}
.tchip button{font-size:10px;color:#B25A60;font-weight:800;padding:0 0 0 1px}
.tchip .tnm{font:inherit;color:inherit;font-weight:800;padding:0}
.assign-row{display:flex;align-items:center;gap:7px;margin-top:7px}
.assign-row .select{height:40px;font-size:12px}
.assign-add{flex:0 0 auto;height:40px;padding:0 11px;border-radius:11px;background:var(--ink);color:#fff;font-size:11.5px;font-weight:800}
.role-pill{font-size:9.5px;font-weight:800;border-radius:999px;padding:2px 7px;background:#F1EEFB;color:#6A5CAE;white-space:nowrap}
.form-inline{display:flex;gap:7px;margin-bottom:10px}
.form-inline .input{height:44px}
.form-inline .btn{flex:0 0 auto;height:44px;padding:0 14px;border-radius:12px;font-size:12.5px}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:2px 0 12px}
.check-grid label{display:flex;align-items:center;gap:7px;padding:9px 10px;border-radius:11px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink-soft)}
.check-grid input{width:16px;height:16px;accent-color:var(--present);flex:0 0 auto}

/* ============ v0.6 — 반 확인 입장 · 잠금 스위치 · 깜빡임 없는 PIN ============ */
.who-card{
  display:flex;align-items:center;gap:11px;padding:12px 13px;margin:2px 0 12px;
  background:#FFFDF8;border:1px solid var(--line);border-radius:15px;
}
.who-card .cc-emoji{width:42px;height:42px;border-radius:14px;font-size:20px}
.who-txt{flex:1;min-width:0}
.who-txt b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.2px}
.who-txt small{display:block;margin-top:2px;font-size:10.5px;color:var(--muted);font-weight:700;line-height:1.45}
/* v1.5 — '담당 선생님' 라벨이 먼저, 그 아래에 선생님 이름 */
.who-txt .wl{display:block;font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:-.1px}
.who-txt .wn{display:block;font-size:13.5px;font-weight:800;letter-spacing:-.2px;margin-top:2px;line-height:1.45;word-break:keep-all}
.who-note{font-size:10.5px;font-weight:700;color:var(--muted);margin:-4px 2px 12px;line-height:1.5}
/* 데모 PIN 안내 — 버튼 없이 한 줄로만 (한 번에 채우기 삭제) */
.pin-demo{display:block;text-align:center;line-height:1.4}
.pin-err{transition:opacity .12s}
/* 반별 비밀번호 잠금 스위치 (관리 탭) */
.switch-row{
  display:flex;align-items:center;gap:11px;padding:12px 13px;
  background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow-sm);
}
.switch-row .sw-txt{flex:1;min-width:0}
.switch-row .sw-txt b{display:block;font-size:12.5px;font-weight:800;letter-spacing:-.2px}
.switch-row .sw-txt small{display:block;margin-top:3px;font-size:10.5px;line-height:1.5;color:var(--muted);font-weight:700}
.switch{
  flex:0 0 auto;position:relative;width:48px;height:28px;border-radius:999px;
  background:#E6DACC;border:1px solid #DCCFC2;transition:background .16s ease,border-color .16s ease;
}
.switch::after{
  content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(90,70,50,.28);transition:transform .16s ease;
}
.switch[aria-checked="true"]{background:var(--present);border-color:var(--present)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* 아주 좁은 폰(320px)에서도 반 카드 이름이 잘리지 않도록 */
@media (max-width:359px){
  .cc-lock{display:none}
  .cc-name{font-size:13px}
  .cc-teachers{font-size:10px}
  .admin-entry small{display:none}
}

/* ============ v0.7 — 로그인은 반 카드가 주인공 · 임원은 작은 [관리] 버튼 ============ */
/* 로그인 머리 — 반 카드에 자리를 주려고 한 단계 작게 */
.login-top{margin-bottom:18px}
.login-mark{width:64px;height:64px;border-radius:22px;font-size:31px;margin-bottom:12px}
.login-top h1{font-size:20px}
.login-top p{margin-top:6px;font-size:12.5px}
.login-sec.classes{margin-top:0}
.class-grid.primary{gap:10px}
.class-grid.primary .class-card{padding:14px 13px 13px;border-radius:19px}
.class-grid.primary .cc-emoji{width:34px;height:34px;border-radius:11px;font-size:17px}
.class-grid.primary .cc-name{font-size:15px}
.class-grid.primary .cc-meta{font-size:11px}
.class-grid.primary .cc-teachers{font-size:10.5px;min-height:16px}
/* 다섯 번째(새친구반)는 한 줄을 다 쓰므로 가로로 눕혀 자리를 아끼고 눈에 띄게 */
.class-grid.primary > .class-card:last-child:nth-child(odd){
  display:grid;grid-template-columns:1fr auto;
  grid-template-areas:"top meta" "top teachers";
  align-items:center;column-gap:12px;row-gap:3px;
}
.class-grid.primary > .class-card:last-child:nth-child(odd) .cc-top{grid-area:top}
.class-grid.primary > .class-card:last-child:nth-child(odd) .cc-meta{grid-area:meta;text-align:right;align-self:end}
.class-grid.primary > .class-card:last-child:nth-child(odd) .cc-teachers{grid-area:teachers;text-align:right;align-self:start;min-height:0}
/* 이름·문장이 단어 중간에서 끊기지 않도록 */
.cc-teachers,.login-note{word-break:keep-all}
/* 임원 · 관리자 — 반 카드에 비기지 않는 보조 줄 */
.admin-entry{
  display:flex;align-items:center;gap:7px;width:100%;margin-top:14px;
  padding:9px 12px;border-radius:13px;text-align:left;
  background:rgba(255,255,255,.55);border:1px solid var(--line);
  transition:background .14s ease,border-color .14s ease;
}
.admin-entry:active{background:#fff;border-color:#E3D6C7}
.admin-entry .ae-ico{font-size:12.5px;opacity:.7;flex:0 0 auto;line-height:1}
.admin-entry b{font-size:11.5px;font-weight:800;color:var(--ink-soft);letter-spacing:-.1px;white-space:nowrap}
.admin-entry small{margin-left:auto;font-size:10.5px;font-weight:700;color:#BCAFA4;white-space:nowrap}
/* v0.8 — 관리자(임원 · 교역자)는 하나 · 관리 탭의 PIN 변경 카드 */
.adm-card .ac-head .pin-chip{
  margin-left:auto;flex:0 0 auto;font-size:10px;font-weight:800;color:#7A6757;
  background:#F6F0E7;border-radius:999px;padding:3px 8px;letter-spacing:.5px;
}
.adm-card .form-inline{margin:0}
.adm-card .form-error{margin:0}
.adm-card .field-hint{margin:0}

@media (max-height:740px){
  .login-mark{width:56px;height:56px;border-radius:19px;font-size:27px;margin-bottom:9px}
  .login-top{margin-bottom:12px}
  .login-top h1{font-size:18px}
  .login-top p{margin-top:4px;font-size:11.5px}
  .class-grid.primary{gap:8px}
  .class-grid.primary .class-card{padding:11px 11px 10px;border-radius:16px}
  .class-grid.primary .cc-name{font-size:14px}
  .admin-entry{margin-top:11px;padding:8px 11px}
  .login-note{margin-top:12px;padding:9px 11px;font-size:11px}
  .login-ver{margin-top:9px}
}

/* ---------------- 헤더 ---------------- */
.app-header{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:11px 14px;background:rgba(250,246,239,.92);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(239,230,218,.9);
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-mark{
  width:34px;height:34px;border-radius:12px;background:#fff;border:1px solid var(--line);
  display:grid;place-items:center;font-size:17px;flex:0 0 auto;
}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:12.5px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;margin-top:1px}
.logout{
  flex:0 0 auto;display:flex;align-items:center;gap:5px;
  font-size:11.5px;font-weight:700;color:var(--ink-soft);
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 10px;
}
.logout span{color:var(--muted);font-weight:600}

/* ---------------- 프로토타입 배너 ---------------- */
.proto-banner{
  display:flex;align-items:flex-start;gap:7px;
  padding:8px 14px;background:linear-gradient(90deg,#F7EFE2,#FBF6EC);
  border-bottom:1px solid var(--line);color:#8B7A6C;font-size:10.5px;line-height:1.5;font-weight:500;
}
.proto-banner b{font-weight:800;color:#7A6757}
/* 공유 저장 상태 표시 (v1.0) */
.sync-badge{
  display:inline-flex;align-items:center;gap:3px;flex:0 0 auto;
  padding:1px 7px;border-radius:999px;white-space:nowrap;
  font-size:10px;font-weight:800;background:#EAF6EE;color:#3F7D5B;
}
.sync-badge.start,.sync-badge.saving{background:#FCF2E0;color:#9A7420}
.sync-badge.error{background:#FBECEE;color:#B25A60}
.sync-badge.offline,.sync-badge.local{background:#F1EBE3;color:#8A7A6C}

/* ---------------- 뷰 공통 ---------------- */
.view{padding:13px 13px 112px;display:flex;flex-direction:column;gap:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.section-title{
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  padding:4px 4px 0;font-size:13px;font-weight:800;color:var(--ink-soft);letter-spacing:-.2px;
}
.section-title small{font-size:11px;font-weight:600;color:var(--muted)}

/* ---------------- 날짜 바 ---------------- */
.date-bar{display:flex;align-items:center;gap:8px;padding:9px 9px}
.date-nav{
  width:40px;height:46px;border-radius:13px;border:1px solid var(--line);background:#FFFDF9;
  color:var(--ink-soft);font-size:17px;font-weight:700;flex:0 0 auto;display:grid;place-items:center;
}
.date-nav:active{background:var(--primary-soft)}
.date-mid{flex:1;min-width:0;text-align:center}
.date-main{font-size:16.5px;font-weight:800;letter-spacing:-.4px}
.date-main .wk{color:var(--primary-dark)}
.date-input{
  display:block;width:100%;margin-top:2px;border:0;background:transparent;color:var(--muted);
  font-size:11.5px;font-weight:600;text-align:center;padding:2px 0;
}
.date-input::-webkit-calendar-picker-indicator{opacity:.45;cursor:pointer}

/* ---------------- 반 선택 칩 (5개 반이 잘리지 않고 한눈에) ---------------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:1px 1px 3px}
.chip{
  flex:1 1 calc(33.333% - 6px);min-width:0;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:9px 6px;border-radius:999px;border:1px solid var(--line);background:#fff;
  color:var(--ink-soft);font-size:12px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;
  transition:background .12s,color .12s,border-color .12s;
}
.chip .nm{overflow:hidden;text-overflow:ellipsis}
.chip .cnt{flex:0 0 auto;font-size:10px;font-weight:800;opacity:.55}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.active .cnt{opacity:.7}
.chip .lock{font-size:9.5px;opacity:.7;flex:0 0 auto}
/* 아주 좁은 폰(320px)에서도 '새친구반'이 잘리지 않도록 */
@media (max-width:359px){
  .chip{font-size:11.5px;letter-spacing:-.4px;gap:4px;padding:9px 4px}
  .chip .lock{font-size:8.5px}
  .chip .cnt{font-size:9.5px}
}

/* ---------------- 요약 카드 ---------------- */
.summary{padding:14px 15px 13px}
.summary-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.summary-top .left{font-size:12.5px;color:var(--muted);font-weight:700}
.summary-big{font-size:15px;color:var(--ink);font-weight:800;letter-spacing:-.2px}
.summary-big b{font-size:23px;color:var(--present);letter-spacing:-.8px;margin-right:1px}
.summary-rate{font-size:12px;font-weight:800;color:var(--present);background:var(--present-soft);border-radius:999px;padding:4px 10px}
.stacked{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--unchecked-soft);margin:11px 0 9px}
.stacked i{display:block;height:100%;transition:width .25s ease}
.counts{display:flex;gap:12px;font-size:11.5px;font-weight:700;color:var(--ink-soft);flex-wrap:wrap}
.counts .d{display:inline-block;width:7px;height:7px;border-radius:3px;margin-right:5px;vertical-align:1px}
.all-btn{
  width:100%;margin-top:11px;padding:11px;border-radius:12px;background:#FFFDF8;
  border:1px solid var(--line);color:var(--primary-dark);font-size:12.5px;font-weight:800;
}
.all-btn:active{background:var(--primary-soft)}
.readonly-note{
  display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:13px;
  background:#FBF6EC;border:1px dashed #E7D6BC;color:#8A7458;font-size:11.5px;font-weight:600;line-height:1.5;
  word-break:keep-all;   /* 한글 단어가 중간에서 끊기지 않도록 */
}

/* ---------------- 생일 스트립 ---------------- */
.bday-strip{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:11px 13px;border-radius:16px;border:1px solid #F2DFC4;
  background:linear-gradient(100deg,#FFF4E3,#FFFBF4);
}
.bday-ico{font-size:20px;flex:0 0 auto}
.bday-txt{flex:1;min-width:0}
.bday-txt b{display:block;font-size:12.5px;font-weight:800;color:#9A6A35;letter-spacing:-.2px}
.bday-txt small{display:block;font-size:11px;color:#B08957;font-weight:600;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:#CBB18E;font-size:17px;font-weight:700}

/* v1.5 — 🎓 졸업 예정자 모아보기 (이달의 생일 스트립과 같은 결) */
.grad-card{border:1px solid #EBDCBF;border-radius:16px;background:linear-gradient(100deg,#FFF8EA,#FFFCF7);overflow:hidden}
.grad-head{display:flex;align-items:center;gap:10px;width:100%;padding:11px 13px;text-align:left}
.grad-head .gh-ico{font-size:20px;flex:0 0 auto}
.grad-head .gh-txt{flex:1;min-width:0}
.grad-head .gh-txt b{display:block;font-size:12.5px;font-weight:800;color:#8A5A12;letter-spacing:-.2px}
.grad-head .gh-txt small{display:block;font-size:11px;color:#B08957;font-weight:600;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grad-card .chev{flex:0 0 auto;transition:transform .16s ease}
.grad-card.open .chev{transform:rotate(90deg)}
.grad-body{border-top:1px solid #F3E6D0;background:#FFFDF9;padding:2px 0}
.grad-row{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border-bottom:1px solid #F7F0E4;text-align:left}
.grad-row:last-child{border-bottom:0}
.grad-row:active{background:#FFF7E9}
.gr-cls{flex:0 0 auto;font-size:9.5px;font-weight:800;border-radius:999px;padding:3px 7px;letter-spacing:-.1px}
.gr-main{flex:1;min-width:0}
.gr-main b{display:block;font-size:13px;font-weight:800;letter-spacing:-.2px}
.gr-main small{display:block;font-size:10.5px;color:var(--muted);font-weight:700;margin-top:1px}
.grad-row .dday{flex:0 0 auto}
.grad-sec{padding:8px 12px 6px;font-size:10px;font-weight:800;color:var(--muted);background:#FCF7EE;border-bottom:1px solid #F7F0E4;line-height:1.5}
.grad-more{display:block;width:100%;padding:11px 12px;border-top:1px solid #F7F0E4;background:#FFFCF6;font-size:11px;font-weight:800;color:#9A7A45;text-align:center}
.grad-more:active{background:#FFF6E7}
.dday.past{background:#F5E6D2;color:#8A5A12}

/* ---------------- 반 그룹 / 아이 목록 ---------------- */
.group-head{display:flex;align-items:center;gap:7px;padding:6px 4px 1px;font-size:12px;font-weight:800;color:var(--ink-soft)}
.group-head .dot{width:8px;height:8px;border-radius:99px;flex:0 0 auto}
.group-head .sub{font-size:10.5px;font-weight:600;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.group-head .cnt{margin-left:auto;font-size:11px;font-weight:800;color:var(--muted)}

.child{
  display:block;background:#fff;border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow-sm);padding:9px 11px;margin-top:7px;
  transition:background .15s,border-color .15s;
}
.child.present{background:linear-gradient(0deg,#F4FAF6,#FFFFFF);border-color:#DCEFE2}
.child.absent{background:linear-gradient(0deg,#FDF1F2,#FFFFFF);border-color:#F5DDE0}
.child-row{display:flex;align-items:center;gap:10px}
.avatar{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
  font-size:16px;font-weight:800;flex:0 0 auto;letter-spacing:-.5px;
}
.child-main{flex:1;min-width:0}
.child-name{display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:14.5px;font-weight:800;letter-spacing:-.3px;min-width:0}
.child-name .cake{font-size:13px}
.tag-new{
  font-size:9.5px;font-weight:800;color:#C97550;background:var(--primary-soft);
  border-radius:999px;padding:2px 6px;letter-spacing:0;
}
.child-meta{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.child-meta.sub{margin-top:1px;color:#A99C92;font-size:10px;letter-spacing:-.1px}
.tag-grad{
  font-size:9.5px;font-weight:800;color:#5B7FA8;background:#EAF1F9;
  border-radius:999px;padding:2px 6px;letter-spacing:0;white-space:nowrap;
}
.tag-grad.soon{color:#B25A60;background:#FDECEE}
/* v1.4 — 졸업 예정자 카드 강조: 졸업까지 1년 이내(due) · 이미 졸업일이 지난 아이(past) */
.child.grad-due{
  border-color:#E8C57C;
  background:linear-gradient(0deg,#FFF7E4,#FFFDF9);
  box-shadow:0 0 0 2px rgba(232,197,124,.26),var(--shadow-sm);
}
.child.grad-past{
  border-color:#DFC1A2;
  background:linear-gradient(0deg,#FBF3EA,#FFFDFA);
  box-shadow:0 0 0 2px rgba(223,193,162,.24),var(--shadow-sm);
}
.child.grad-due.present{background:linear-gradient(0deg,#FFF7E4,#F6FBF7);border-color:#E8C57C}
.child.grad-past.present{background:linear-gradient(0deg,#FBF3EA,#F6FBF7);border-color:#DFC1A2}
.tag-grad.due{color:#8A5A12;background:#FDEFC7}
.tag-grad.past{color:#8A5A12;background:#F5E6D2}
/* v1.4 — 등록카드 사진으로 자동 입력 */
.scan-block{margin:0 0 12px}
.scan-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;width:100%;min-height:46px;
  border-radius:13px;border:1.5px dashed #F1DAC6;background:var(--primary-soft);color:var(--primary-dark);
  font-size:13.5px;font-weight:800;letter-spacing:-.3px;transition:transform .1s,opacity .15s;
}
.scan-btn .ico{font-size:15px}
.scan-btn:active{transform:scale(.985)}
.scan-btn:disabled{opacity:.7}
.scan-btn.busy{animation:scanPulse 1.1s ease-in-out infinite}
@keyframes scanPulse{0%,100%{opacity:.6}50%{opacity:1}}
.scan-note{font-size:10.5px;line-height:1.5;color:var(--muted);font-weight:600;margin-top:6px;text-align:center}
.scan-status{
  margin-top:8px;padding:9px 11px;border-radius:11px;
  background:#F1FAF8;border:1px solid #CBE9E1;color:#2E7E70;
  font-size:11.5px;font-weight:700;line-height:1.5;
}
.scan-status.err{background:#FDF1F2;border-color:#F5DDE0;color:#B25A60}
.scan-status.warn{background:#FBF7F0;border-color:#F0E7DA;color:#8A6A3A}
.info-hint{display:block;margin-top:1px;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:-.1px}
.field-hint{font-size:10.5px;line-height:1.5;color:var(--muted);font-weight:600;margin:-6px 0 12px}
.child-actions{flex:0 0 auto;display:flex;flex-direction:column;align-items:stretch;gap:3px}
.st-btn{
  width:84px;min-height:44px;border-radius:13px;border:1.5px dashed #D9CDC0;background:#FFFDFA;
  color:var(--muted);font-size:12.5px;font-weight:800;letter-spacing:-.2px;
  transition:transform .1s,background .15s,box-shadow .15s;
}
.st-btn:active{transform:scale(.96)}
.st-btn.present{background:var(--present);border:1.5px solid var(--present);color:#fff;box-shadow:0 4px 10px rgba(95,169,124,.26)}
.st-btn.absent{background:var(--absent);border:1.5px solid var(--absent);color:#fff;box-shadow:0 4px 10px rgba(212,120,127,.26)}
.st-btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.memo-btn{width:84px;height:24px;border-radius:8px;color:var(--muted);font-size:10.5px;font-weight:700}
.memo-btn:active{background:var(--bg-soft)}
.memo-btn:disabled{opacity:.35;cursor:default}
.memo-text{
  margin-top:8px;padding:8px 10px;border-radius:10px;background:#FBF7F0;
  border:1px solid #F0E7DA;font-size:11.5px;color:#7A6757;font-weight:600;line-height:1.45;
}
.memo-editor{display:flex;gap:7px;align-items:stretch;margin-top:8px}
.memo-editor textarea{
  flex:1;min-height:46px;border:1px solid var(--line);border-radius:11px;background:#FFFDF9;
  padding:9px 10px;font-size:12.5px;resize:vertical;line-height:1.45;
}
.memo-editor button{
  flex:0 0 auto;padding:0 13px;border-radius:11px;background:var(--ink);color:#fff;font-size:12px;font-weight:800;
}
.add-btn{
  width:100%;padding:15px;border-radius:16px;border:1.5px dashed #E4CBB0;background:#FFFDF8;
  color:#B67A4E;font-size:14px;font-weight:800;letter-spacing:-.2px;
}
.add-btn:active{background:#FFF6EA}
.empty{
  text-align:center;padding:26px 16px;color:var(--muted);font-size:12.5px;font-weight:600;line-height:1.7;
}
.empty .big{font-size:26px;display:block;margin-bottom:6px}

/* ---------------- 생일 탭 ---------------- */
.month-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
.month-nav .mn-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#FFFDF9;font-size:15px;color:var(--ink-soft)}
.month-nav .mn-label{font-size:15px;font-weight:800;letter-spacing:-.2px}
.month-nav .mn-label small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;text-align:center;margin-top:1px}
.bday-card{
  display:flex;align-items:center;gap:11px;padding:12px 13px;
  background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);
}
.bday-body{flex:1;min-width:0}
.bday-name{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:14.5px;font-weight:800;letter-spacing:-.3px}
.pill{font-size:9.5px;font-weight:800;border-radius:999px;padding:2px 7px;letter-spacing:0}
.bday-meta{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.dday{
  flex:0 0 auto;font-size:10.5px;font-weight:800;border-radius:999px;padding:5px 9px;
  background:var(--bg-soft);color:var(--ink-soft);
}
.dday.today{background:var(--primary);color:#fff}
.dday.soon{background:#FFF0DC;color:#B67A4E}

/* ---------------- v1.7 — 선생님 생일 (연도 없이 월·일) ---------------- */
.md-row{display:flex;gap:8px}
.md-row .select{flex:1;min-width:0}
.tb-now{display:inline-block;margin-left:3px;font-size:9px;font-weight:800;color:#C97550;background:var(--primary-soft);border-radius:999px;padding:1px 5px;vertical-align:1px}
.tbd-card{padding:11px 13px 6px;display:flex;flex-direction:column;gap:2px}
.tbd-head{display:flex;align-items:baseline;gap:6px;font-size:12.5px;font-weight:800;color:#9A6A35;padding-bottom:3px}
.tbd-head b{color:#C97550}
.tbd-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #F7EEE2;font-size:12.5px}
.tbd-row .nm{font-weight:800;letter-spacing:-.2px}
.tbd-row .cls{font-size:9.5px;font-weight:800;border-radius:999px;padding:2px 7px}
.tbd-row .md{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.tbd-row .dday{flex:0 0 auto}
.tbd-empty{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.6;padding:2px 0 6px}
.bday-strip.t-strip{border-color:#EFD9E8;background:linear-gradient(100deg,#FCEFF6,#FFFCFD)}
.bday-strip.t-strip .bday-txt b{color:#8E5A7C}
.bday-strip.t-strip .bday-txt small{color:#A9798F}

/* ---------------- v1.8 — 명단 정리 (관리 탭 · 일괄 선택 삭제) ---------------- */
.mg-card{padding:12px 12px 8px;display:flex;flex-direction:column;gap:9px}
.mg-chips{padding:0}
.mg-scroll{max-height:min(46vh,400px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:1px 1px 3px}
.mg-gh{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--muted);padding:7px 3px 1px}
.mg-gh i{width:8px;height:8px;border-radius:99px;display:block;flex:0 0 auto}
.mg-gh span{margin-left:auto;font-weight:700}
.mg-empty{font-size:11.5px;color:var(--muted);font-weight:700;padding:9px 4px;text-align:center}
.sel-row{display:flex;align-items:center;gap:10px;padding:10px 11px;margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-sm);cursor:pointer;-webkit-tap-highlight-color:transparent}
.sel-row.on{background:linear-gradient(0deg,#FDF3EE,#FFFFFF);border-color:#F1DAC6}
.sel-box{width:27px;height:27px;border-radius:9px;border:1.5px solid #DCC9B4;background:#fff;display:grid;place-items:center;font-size:14px;font-weight:800;color:#fff;flex:0 0 auto}
.sel-row.on .sel-box{background:var(--primary);border-color:var(--primary)}
.mg-bar{display:flex;align-items:center;gap:8px;padding-top:9px;border-top:1px solid var(--line)}
.mg-all{flex:0 0 auto;height:44px;padding:0 13px;border-radius:12px;border:1px solid var(--line);background:#FFFDF9;font-size:12px;font-weight:800;color:var(--ink-soft)}
.mg-cnt{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.mg-cnt b{font-size:14px;color:var(--primary-dark)}
.mg-del{flex:0 0 auto;height:44px;padding:0 15px;border-radius:12px;background:#B25A60;color:#fff;font-size:12.5px;font-weight:800}
.mg-del:disabled{opacity:.34}

/* ---------------- 통계 ---------------- */
.stat-hero{display:flex;align-items:center;gap:15px;padding:15px}
.donut{
  width:104px;height:104px;border-radius:50%;flex:0 0 auto;position:relative;
  display:grid;place-items:center;
}
.donut::after{content:'';position:absolute;inset:13px;background:#fff;border-radius:50%}
.donut-hole{position:relative;z-index:1;text-align:center}
.donut-hole b{display:block;font-size:23px;font-weight:800;letter-spacing:-1px;color:var(--present)}
.donut-hole b small{font-size:11px;font-weight:800}
.donut-hole span{display:block;font-size:10px;color:var(--muted);font-weight:700;margin-top:-2px}
.stat-figures{flex:1;min-width:0}
.stat-figures .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:4px 0;font-size:12px;font-weight:700;color:var(--ink-soft)}
.stat-figures .row b{font-size:13.5px;font-weight:800;color:var(--ink)}
.stat-figures .row .k{display:flex;align-items:center;gap:6px}
.stat-figures .row .d{width:8px;height:8px;border-radius:3px;display:inline-block}
.stat-diff{margin-top:6px;font-size:11px;font-weight:700;color:var(--muted)}
.stat-diff.up{color:var(--present)}
.stat-diff.down{color:var(--absent)}
.class-stat{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.class-stat .cs-top{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800}
.class-stat .cs-top .dot{width:8px;height:8px;border-radius:99px}
.class-stat .cs-top .t{font-size:10.5px;color:var(--muted);font-weight:600}
.class-stat .cs-top .n{margin-left:auto;font-size:11.5px;color:var(--ink-soft);font-weight:800}
.cs-bar{height:8px;border-radius:99px;background:var(--unchecked-soft);overflow:hidden;display:flex}
.cs-bar i{height:100%;display:block}
.chart{width:100%;display:block;height:auto}
.chart text{font-family:inherit}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:0 4px 2px;font-size:10.5px;font-weight:700;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:block}
.mini-list{display:flex;flex-direction:column;gap:7px;padding:2px 0 0}
.mini-row{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink-soft);padding:7px 10px;border-radius:11px;background:#FCF9F3;border:1px solid #F3EBDF}
.mini-row .n{flex:1;min-width:0;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-row .s{font-size:10.5px;color:var(--muted);font-weight:700}

/* ---------------- 관리 탭 ---------------- */
.admin-class{padding:13px 14px;display:flex;flex-direction:column;gap:9px}
.admin-class .ac-head{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800}
.admin-class .ac-head .dot{width:9px;height:9px;border-radius:99px}
.admin-class .ac-head .age{font-size:10.5px;color:var(--muted);font-weight:700}
.admin-class .ac-head .now{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--primary-dark);background:var(--primary-soft);padding:3px 8px;border-radius:999px}
.admin-row{display:flex;align-items:center;gap:9px}
.admin-row label{font-size:11.5px;font-weight:800;color:var(--muted);flex:0 0 auto}
.select{
  flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:#FFFDF9;
  padding:0 10px;font-size:13px;font-weight:700;color:var(--ink);
}
.admin-hint{font-size:10.5px;color:var(--muted);font-weight:600}
.move-hint{
  display:flex;gap:6px;margin:-2px 0 12px;padding:9px 11px;border-radius:11px;
  background:#E7F6F3;border:1px solid #CBE9E1;color:#2E7E70;font-size:11px;font-weight:700;line-height:1.5;
}
.nf-tip{
  margin:7px 0 0;padding:8px 11px;border-radius:12px;background:#F1FAF8;
  border:1px dashed #CBE9E1;color:#3C8879;font-size:10.5px;font-weight:700;line-height:1.5;
}
.nf-tip b{color:#2E7E70}
/* v1.3 — 새친구반 카드에서 바로 반 배정 · 졸업 예정 자동/직접 지정 */
.assign-bar{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px;padding-top:8px;
  border-top:1px dashed #D9EDE7;
}
.assign-bar .ab-label{flex:0 0 auto;font-size:10.5px;font-weight:800;color:#2E7E70;letter-spacing:-.1px}
.assign-chips{display:flex;gap:5px;flex:1;min-width:0;flex-wrap:wrap}
.assign-chip{
  height:32px;padding:0 11px;border-radius:999px;border:1px solid #CBE9E1;background:#F1FAF8;
  color:#2E7E70;font-size:12px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;
  transition:transform .1s,background .15s;
}
.assign-chip:active{transform:scale(.95);background:#DFF2ED}
.assign-chip:disabled{opacity:.4}
.seg{display:flex;gap:6px;margin-bottom:7px}
.seg-btn{
  flex:1;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;
  color:var(--muted);font-size:12px;font-weight:800;letter-spacing:-.2px;
}
.seg-btn.active{background:var(--primary-soft);border-color:#F1DAC6;color:var(--primary-dark)}
.grad-auto{
  display:flex;align-items:center;gap:6px;padding:10px 12px;border-radius:12px;
  background:#F1FAF8;border:1px solid #CBE9E1;color:#2E7E70;font-size:13px;font-weight:800;
}
.grad-auto small{font-weight:700;color:#5C9A8C;font-size:10.5px;letter-spacing:-.1px}
.grad-auto.empty{background:#FBF7F0;border-color:#F0E7DA;color:var(--muted);font-weight:700;font-size:12px}
.grad-manual-note{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:5px}
.grad-reset{
  display:inline-flex;align-items:center;gap:4px;margin-top:7px;padding:7px 11px;
  border-radius:9px;border:1px dashed #D9CDC0;background:#fff;color:var(--ink-soft);
  font-size:11px;font-weight:800;letter-spacing:-.1px;
}
.grad-reset:active{background:var(--bg-soft)}
.move-row{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid #F6F0E7}
.move-row:last-child{border-bottom:0}
.move-row .nm{flex:1;min-width:0;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.move-row .nm small{color:var(--muted);font-weight:600;font-size:10.5px;margin-left:4px}
.move-row .select{height:38px;flex:0 0 106px;font-size:12px}
/* v1.5 — 줄을 눌러도 수정 창이 열린다(손가락이 작은 버튼을 빗나가도 되게) */
.tap-row{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mg-row.tap-row:active,.move-row.tap-row:active{background:#FDF8F0}
.admin-group{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.admin-group .ag-head{padding:8px 11px;background:#FCF9F3;border-bottom:1px solid #F3EBDF;font-size:11.5px;font-weight:800;color:var(--ink-soft);display:flex;gap:6px;align-items:center}
.admin-group .ag-head span{margin-left:auto;color:var(--muted);font-weight:700}
/* v1.1 — 관리자 드래그 이동 (PC 마우스·펜 = Pointer Events / 손가락 = Touch Events)
   v1.5 — 손가락으로 잡기 쉽게 44×44, 스크롤·고무줄·텍스트 선택을 막는 touch-action·user-select·callout */
.drag-handle{
  flex:0 0 auto;width:44px;height:44px;display:grid;place-items:center;
  border:1px solid #ECE1D3;background:#FBF7F0;color:#A2937F;font-size:18px;line-height:1;
  border-radius:12px;cursor:grab;padding:0;margin:0;
  touch-action:none;-ms-touch-action:none;                /* 손가락 드래그 중 브라우저 스크롤을 맡기지 않는다 */
  -webkit-user-select:none;user-select:none;              /* 길게 누를 때 텍스트 선택 방지 */
  -webkit-touch-callout:none;                             /* iOS 길게 누르기 미리보기 방지 */
  -webkit-tap-highlight-color:transparent;
}
.drag-handle.armed{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-dark)}
.drag-handle:active{cursor:grabbing;background:#F3EBDF;color:#8A7868}
.drag-handle:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
body.dnd-on,body.dnd-on *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.dnd-on{touch-action:none;overscroll-behavior:none}   /* iOS 고무줄 스크롤 방지 */
body.dnd-on .drag-handle{cursor:grabbing}
.dnd-src{opacity:.4}
.dnd-over{outline:2px dashed var(--primary);outline-offset:3px;background:var(--primary-soft)}
/* 드래그 중 보이는 '놓을 반' 칩 바 — 화면 아래에 고정돼 손가락으로 정확히 누를 수 있다 */
.dnd-targets{
  position:fixed;left:50%;transform:translateX(-50%);z-index:99998;
  bottom:calc(64px + env(safe-area-inset-bottom));width:calc(100% - 22px);max-width:458px;
  padding:9px 10px 10px;border-radius:16px;border:1px solid #E3D6C7;background:rgba(255,253,249,.985);
  box-shadow:0 16px 34px rgba(74,60,51,.26);
}
.dnd-targets .dt-label{font-size:10px;font-weight:800;color:var(--muted);margin:0 0 7px 2px;letter-spacing:-.1px}
.dt-chips{display:flex;flex-wrap:wrap;gap:6px}
.dt-chip{
  flex:1 1 28%;min-height:42px;padding:8px 10px;border-radius:12px;border:1px solid #EFE3D4;background:#fff;
  font-size:12.5px;font-weight:800;color:var(--ink-soft);letter-spacing:-.2px;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
.dt-chip.dnd-over{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-dark);outline:0}
body.dnd-on [data-drop-class].admin-class{border-color:#E3C9A9;box-shadow:0 0 0 2px #F6E7D2}
.dnd-ghost{
  position:fixed;z-index:99999;pointer-events:none;transform:translate(-50%,-140%);
  max-width:78vw;padding:7px 12px;border-radius:12px;
  background:#FFFDF9;border:1px solid #E3D6C7;box-shadow:0 10px 24px rgba(74,60,51,.22);
  font-size:12px;font-weight:800;color:#4A3C33;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dnd-ghost small{display:block;font-size:9.5px;font-weight:700;color:var(--muted);margin-top:1px;letter-spacing:-.1px;white-space:normal;line-height:1.35}
.danger-btn{
  width:100%;padding:13px;border-radius:14px;border:1px solid #F0D8DA;background:#FDF3F4;
  color:#B25A60;font-size:12.5px;font-weight:800;
}
.data-note{font-size:10.5px;line-height:1.6;color:var(--muted);font-weight:600;padding:0 4px}

/* ============ v1.6 — 교사 한 줄 공지 · 반 추가·순서·삭제 ============ */
.notice-bar{
  display:flex;align-items:flex-start;gap:7px;margin:0 0 10px;padding:10px 12px;
  border-radius:14px;background:var(--primary-soft);border:1px solid #F3DCC9;
  color:#8A5A3C;font-size:12px;font-weight:800;line-height:1.5;letter-spacing:-.2px;
}
.notice-bar .nb-ico{flex:0 0 auto;font-size:13px;line-height:1.4}
.notice-bar .nb-tx{flex:1;min-width:0;white-space:pre-wrap;word-break:keep-all}
.mini-btn:disabled{opacity:.32}
.class-add-row{margin:0 0 4px}
.class-add-row .add-btn{margin-top:0}
.set-grid{display:flex;gap:9px}
.set-grid .field{flex:1;min-width:0}
.set-example{margin:0 0 11px;padding:9px 11px;border-radius:12px;background:#F1FAF8;border:1px solid #CBE9E1;color:#2E7E70;font-size:11px;font-weight:800;line-height:1.5}

/* ============ v0.9 — 반으로 입장 · 담당 선생님 명단 · 관리자 전체 권한 ============ */
/* 출석 화면의 '담당 선생님 명단' — 접었다 펴는 카드 */
.roster-card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);overflow:hidden}
.roster-head{display:flex;align-items:center;gap:9px;width:100%;padding:10px 12px;text-align:left}
.roster-head .rh-ico{flex:0 0 auto;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:15px;background:var(--bg-soft)}
.roster-head .rh-txt{flex:1;min-width:0}
.roster-head .rh-txt b{display:block;font-size:12.5px;font-weight:800;letter-spacing:-.2px}
.roster-head .rh-txt small{display:block;font-size:10.5px;color:var(--muted);font-weight:700;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roster-head .chev{flex:0 0 auto;font-size:16px;color:#CBB18E;transition:transform .16s ease}
.roster-card.open .roster-head .chev{transform:rotate(90deg)}
.roster-body{border-top:1px solid #F6F0E7;padding:2px 0}
.rb-row{display:flex;align-items:flex-start;gap:7px;padding:8px 11px;border-bottom:1px solid #F8F3EB}
.rb-row:last-child{border-bottom:0}
.rb-row.now{background:#FFFCF6}
.rb-dot{flex:0 0 auto;width:8px;height:8px;border-radius:99px;margin-top:6px}
.rb-nm{flex:0 0 66px;font-size:11px;font-weight:800;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-t{flex:1;min-width:0;font-size:11.5px;line-height:1.5;color:var(--ink);font-weight:700;word-break:keep-all}
.rb-t.none{color:var(--muted);font-weight:600}
.rb-me{flex:0 0 auto;font-size:9.5px;font-weight:800;color:var(--primary-dark);background:var(--primary-soft);border-radius:999px;padding:2px 6px}
/* 관리 탭 — 선생님 추가 폼 · 명단 줄의 수정/삭제 */
.t-add{display:flex;flex-direction:column;gap:7px}
.t-add .input,.t-add .select{height:44px;font-size:13.5px}
.t-add-row{display:flex;gap:7px}
.t-add-row .select{flex:1;min-width:0}
.t-add-row .assign-add{height:44px;padding:0 16px;border-radius:12px;font-size:13px}
.mg-row .mini-btn.del{color:#B25A60;background:#FDF3F4;border-color:#F0D8DA}
.admin-row.tools{flex-wrap:wrap;gap:6px}
.class-teachers{font-size:10.5px;line-height:1.5;color:var(--muted);font-weight:700;word-break:keep-all}

/* ---------------- 탭바 ---------------- */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;
  display:grid;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:5px 4px calc(5px + env(safe-area-inset-bottom));
}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:12px;
  color:#B0A296;font-size:10.5px;font-weight:800;letter-spacing:-.2px;
}
.tab .ico{font-size:18px;line-height:1.1;filter:grayscale(.55);opacity:.72;transition:filter .15s,opacity .15s}
.tab.active{color:var(--primary-dark)}
.tab.active .ico{filter:none;opacity:1}

/* ---------------- 모달 ---------------- */
.modal-backdrop{
  position:fixed;inset:0;z-index:50;background:rgba(58,47,42,.4);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fade .18s ease-out;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:480px;background:var(--bg);border-radius:24px 24px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));
  max-height:92vh;overflow-y:auto;
  animation:sheet .24s cubic-bezier(.2,.8,.3,1);
  box-shadow:0 -10px 40px rgba(60,40,25,.18);
}
@keyframes sheet{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
@media (min-width:520px){
  .modal-backdrop{align-items:center;padding:18px}
  .modal{border-radius:24px;max-height:88vh}
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-head h3{font-size:17px;font-weight:800;letter-spacing:-.3px}
.modal-head p{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.x-btn{width:34px;height:34px;border-radius:11px;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:15px}
.field{display:block;margin-bottom:11px}
.field>span{display:block;font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-bottom:5px;letter-spacing:-.1px}
.field>span em{font-style:normal;color:var(--primary-dark);font-weight:700;font-size:10.5px;margin-left:3px}
.input{
  display:block;width:100%;height:47px;border-radius:13px;border:1px solid var(--line);
  background:#fff;padding:0 12px;font-size:14.5px;font-weight:600;color:var(--ink);
}
.input::placeholder{color:#C3B6AA;font-weight:500}
textarea.input{height:auto;min-height:62px;padding:11px 12px;resize:vertical;line-height:1.5;font-size:13.5px}
.field-row{display:flex;gap:9px}
.field-row .field{flex:1;min-width:0}
.check{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:13px;background:#fff;border:1px solid var(--line);margin:2px 0 12px;font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.check input{width:18px;height:18px;accent-color:var(--present);flex:0 0 auto}
.form-error{background:#FDF0F1;border:1px solid #F4D8DB;color:#B25A60;border-radius:11px;padding:9px 11px;font-size:12px;font-weight:700;margin-bottom:10px}
.modal-actions{display:flex;gap:9px;margin-top:4px}
.btn{flex:1;height:50px;border-radius:14px;font-size:14.5px;font-weight:800;letter-spacing:-.2px}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink-soft)}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(222,139,98,.32)}
.btn.primary:active{background:var(--primary-dark)}
.confirm-body{font-size:13px;line-height:1.65;color:var(--ink-soft);font-weight:600;margin:-4px 0 16px}

/* ---------------- 아이 사진 ---------------- */
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.avatar.has-photo{border-radius:50%;background:#fff}
.avatar.sm{width:28px;height:28px;border-radius:9px;font-size:11px}
.avatar.sm.has-photo{border-radius:50%}
.avatar-btn{position:relative;padding:0;border:0;cursor:pointer;transition:transform .1s ease}
.avatar-btn::after{content:'';position:absolute;inset:-6px;border-radius:inherit}
.avatar-btn:active{transform:scale(.94)}
.avatar-badge{
  position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:50%;
  background:#fff;border:1px solid var(--line);color:var(--primary-dark);
  font-size:9px;font-weight:800;line-height:1;display:grid;place-items:center;
  box-shadow:0 1px 3px rgba(122,96,72,.18);pointer-events:none;
}
.avatar.sm .avatar-badge{width:13px;height:13px;font-size:7.5px;right:-2px;bottom:-2px}
.photo-block{
  display:flex;align-items:center;gap:13px;padding:12px;margin-bottom:12px;
  background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);
}
.photo-pick{
  width:76px;height:76px;border-radius:50%;flex:0 0 auto;overflow:hidden;
  display:grid;place-items:center;font-size:32px;
  background:linear-gradient(160deg,#FFF3E6,#FDE7D8);border:1px solid #F0DCC7;
}
.photo-pick img{width:100%;height:100%;object-fit:cover;display:block}
.photo-tools{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:7px}
.photo-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;
  height:38px;padding:0 13px;border-radius:11px;border:1px solid #F1DAC6;
  background:var(--primary-soft);color:var(--primary-dark);font-size:12.5px;font-weight:800;
}
.photo-btn:active{transform:scale(.97)}
.photo-btn.del{background:#FDF3F4;border-color:#F0D8DA;color:#B25A60}
.photo-btn:disabled{opacity:.38;cursor:default;transform:none}
.photo-hint{flex:1 1 100%;margin-top:1px;font-size:10.5px;line-height:1.5;color:var(--muted);font-weight:600}
.photo-input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.info-list{display:flex;flex-direction:column;gap:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.info-row{display:flex;align-items:baseline;gap:10px;padding:10px 12px;border-bottom:1px solid #F6F0E7;font-size:12.5px}
.info-row:last-child{border-bottom:0}
.info-row>b{flex:0 0 68px;font-size:11px;font-weight:800;color:var(--muted)}
.info-row>span{flex:1;min-width:0;font-weight:700;color:var(--ink);line-height:1.5;word-break:break-word}
.info-row>span.muted,.info-row .muted{color:var(--muted);font-weight:600}

/* ---------------- 토스트 ---------------- */
.toast{
  position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
  z-index:60;max-width:min(420px,88vw);background:rgba(58,47,42,.94);color:#fff;
  font-size:12.5px;font-weight:700;line-height:1.45;padding:11px 16px;border-radius:13px;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;text-align:center;
  box-shadow:0 8px 24px rgba(40,25,15,.28);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* =========================================================
   v2.0 — 순복이(교회 마스코트) 캐릭터
   그림은 assets/soonbok-*.png (투명 배경 · 긴 변 360px)
   ========================================================= */
.sb-img{display:block;object-fit:contain;-webkit-user-drag:none;user-select:none}

/* 머리글 — 순복이 얼굴(누르면 도움말) */
.brand-mark{
  width:34px;height:34px;padding:0;border:0;background:transparent;box-shadow:none;
  border-radius:12px;display:block;position:relative;flex:0 0 auto;overflow:visible;
}
.brand-mark img{width:34px;height:34px;display:block;object-fit:contain}
.brand-mark::after{content:"";position:absolute;inset:-6px;border-radius:14px}   /* 손가락 누를 자리를 넓힌다 */
.brand-mark:active img{transform:scale(.94)}
.hdr-tools{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.hdr-help{
  flex:0 0 auto;width:30px;height:30px;border-radius:999px;background:#fff;border:1px solid var(--line);
  color:var(--ink-soft);font-size:13px;font-weight:800;line-height:1;display:grid;place-items:center;
  box-shadow:var(--shadow-sm);
}
.hdr-help:active{background:var(--primary-soft)}
/* 아주 좁은 폰(320px)에서도 제목이 잘리지 않게 머리글을 조금 조인다 */
@media (max-width:359px){
  .app-header{padding:10px 11px;gap:6px}
  .brand{gap:7px}
  .brand-txt b{font-size:11.5px}
  .hdr-tools{gap:5px}
  .hdr-help{width:28px;height:28px;font-size:12px}
  .logout{font-size:11px;padding:6px 8px}
}

/* 로그인 — 손 흔드는 순복이 */
.login-mark{
  width:auto;height:auto;padding:0;border:0;background:transparent;box-shadow:none;border-radius:0;
  margin:0 auto 10px;font-size:0;
}
.login-mark img{
  width:118px;height:118px;display:block;object-fit:contain;
  filter:drop-shadow(0 10px 18px rgba(150,110,70,.18));
}
.login-help{
  display:block;margin:9px auto 0;padding:7px 13px;border-radius:999px;
  background:rgba(255,255,255,.72);border:1px solid var(--line);
  color:var(--ink-soft);font-size:11px;font-weight:800;
}
.login-help:active{background:var(--primary-soft)}
@media (max-height:740px){
  .login-mark img{width:92px;height:92px}
}

/* 생일 · 관리 탭 맨 위 인사 띠 */
.sb-hero{
  display:flex;align-items:center;gap:8px;padding:9px 10px 9px 13px;border-radius:16px;
  border:1px solid #F2DFC4;background:linear-gradient(100deg,#FFF4E3,#FFFBF4);overflow:hidden;
}
.sb-hero .sb-tx{flex:1;min-width:0}
.sb-hero .sb-tx b{display:block;font-size:12.5px;font-weight:800;color:#8A5A12;letter-spacing:-.2px}
.sb-hero .sb-tx small{display:block;margin-top:2px;font-size:10.5px;line-height:1.45;font-weight:600;color:#B08957;word-break:keep-all}
.sb-hero img{flex:0 0 auto;width:66px;height:66px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(160,120,80,.16))}
.sb-hero.sb-admin{border-color:#E7DCC9;background:linear-gradient(100deg,#FBF4E9,#FEFBF6)}
.sb-hero.sb-admin .sb-tx b{color:#7C6242}

/* 졸업 카드 — 조용히 앉은 순복이 */
.grad-head .gh-lamb{flex:0 0 auto;width:38px;height:38px;object-fit:contain;margin-right:-2px}

/* 빈 화면 */
.empty .empty-lamb{display:block;width:104px;height:104px;margin:0 auto 6px;object-fit:contain}

/* PIN 창 — 반 색 배지 안의 순복이 */
.pin-who .cc-emoji{overflow:hidden}
.pin-who .cc-emoji img{width:100%;height:100%;object-fit:contain;transform:scale(1.12)}

/* 순복이의 사용법 안내 */
.help-hero{display:flex;align-items:center;gap:9px;margin:0 0 12px}
.help-hero img{flex:0 0 auto;width:84px;height:84px;object-fit:contain}
.help-bubble{
  position:relative;flex:1;min-width:0;padding:11px 13px;border-radius:16px;
  background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm);
  font-size:12.5px;font-weight:700;line-height:1.55;color:var(--ink-soft);word-break:keep-all;
}
.help-bubble::before{
  content:"";position:absolute;left:-6px;top:24px;width:10px;height:10px;background:#fff;
  border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg);
}
.help-list{display:flex;flex-direction:column;gap:8px}
.help-item{display:flex;gap:10px;padding:11px 12px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.help-item .hi-ico{flex:0 0 auto;font-size:16px;line-height:1.25}
.help-item b{display:block;font-size:12.5px;font-weight:800;letter-spacing:-.2px;color:var(--ink)}
.help-item p{margin-top:3px;font-size:11.5px;line-height:1.6;font-weight:600;color:var(--ink-soft);word-break:keep-all}
.help-item .k{display:inline-block;padding:0 5px;border-radius:6px;background:var(--bg-soft);color:var(--ink-soft);font-weight:800}
.help-foot{margin:12px 2px 11px;font-size:11px;line-height:1.6;font-weight:600;color:var(--muted);text-align:center;word-break:keep-all}
.help-close{width:100%}

/* =========================================================
   v2.1 — 🐑 순복이 가져간 친구 · 🙏 선생님 기도제목
   ========================================================= */
/* 로그인 화면 맨 위 — 이번 주 순복이 카드 */
.sb-take{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:0 0 16px;
  padding:12px 12px 12px 13px;border-radius:20px;border:1px solid #F2DFC4;
  background:linear-gradient(105deg,#FFF6E7,#FFFCF6 62%,#FFF1DF);
  box-shadow:0 8px 22px rgba(160,120,80,.12);
}
.sb-take:active{transform:scale(.99)}
.sb-take .sbt-img{flex:0 0 auto;width:62px;height:62px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(160,120,80,.18))}
.sb-take .sbt-tx{flex:1;min-width:0;display:block}
.sb-take .sbt-k{display:block;font-size:10.5px;font-weight:800;color:#B08957;letter-spacing:-.1px}
.sb-take .sbt-main{display:block;margin-top:2px;font-size:13.5px;font-weight:800;color:#6E4B16;line-height:1.42;letter-spacing:-.3px;word-break:keep-all}
.sb-take .sbt-main b{color:#B4691C}
.sb-take .sbt-cls{font-weight:700;color:#9A7644;font-size:11.5px}
.sb-take .sbt-sub{display:block;margin-top:3px;font-size:10.5px;font-weight:700;color:#BBA184}
.sbt-none{color:#A9967E;font-weight:800}

/* 출석 화면 — 순복이 카드 */
.sb-card{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:8px 12px 8px 8px;margin-top:10px;
  border:1px solid #F3E3CB;background:linear-gradient(100deg,#FFF8EC,#FFFFFF);
}
.sb-card:active{background:#FFF4E4}
.sb-card .sc-lamb{flex:0 0 auto;width:46px;height:46px;object-fit:contain}
.sb-card .sc-tx{flex:1;min-width:0}
.sb-card .sc-k{display:block;font-size:10px;font-weight:800;color:#B08957}
.sb-card .sc-main{display:block;font-size:13px;font-weight:800;color:#6E4B16;letter-spacing:-.2px;margin-top:1px;word-break:keep-all}
.sb-card .sc-main b{color:#B4691C}
.sb-card .sc-memo{display:block;font-size:10.5px;font-weight:700;color:#A98C67;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-card .sc-chev{flex:0 0 auto;color:#CBB79C;font-size:18px;font-weight:800}

/* 순복이 창 — 주차 이동 · 이번 주 · 고르기 · 지난 기록 */
.sbm-week{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:14px;background:#fff;border:1px solid var(--line);margin-bottom:11px}
.sbm-week .mn-btn{width:38px;height:40px;border-radius:11px;border:1px solid var(--line);background:#FFFDF9;font-size:16px;color:var(--ink-soft);flex:0 0 auto}
.sbm-week .wk{flex:1;min-width:0;text-align:center}
.sbm-week .wk b{display:block;font-size:13.5px;font-weight:800;letter-spacing:-.3px}
.sbm-week .wk small{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-top:1px}
.sbm-hero{display:flex;align-items:center;gap:10px;padding:12px;border-radius:18px;border:1px solid #F2DFC4;background:linear-gradient(105deg,#FFF6E7,#FFFCF7);margin-bottom:4px}
.sbm-hero img{flex:0 0 auto;width:70px;height:70px;object-fit:contain}
.sbm-hero .sh-tx{flex:1;min-width:0}
.sbm-hero .sh-k{display:block;font-size:10.5px;font-weight:800;color:#B08957}
.sbm-hero .sh-main{display:block;margin-top:2px;font-size:14px;font-weight:800;color:#5F4213;line-height:1.45;letter-spacing:-.3px;word-break:keep-all}
.sbm-hero .sh-main b{color:#B4691C}
.sbm-hero .sh-sub{display:block;margin-top:3px;font-size:10.5px;font-weight:700;color:#B09A7E;word-break:keep-all}
.sbm-hero.none{background:linear-gradient(105deg,#F8F4EE,#FFFDFB);border-color:#EDE3D6}
.sbm-hero.none .sh-k{color:#A9967E}
.sbm-hero.none .sh-main{color:#8A7A6C}
.sbm-memo{display:flex;gap:7px;align-items:center;margin-top:8px}
.sbm-memo .input{height:42px;font-size:12.5px}
.sbm-memo .save{flex:0 0 auto;height:42px;padding:0 14px;border-radius:12px;background:var(--primary-soft);color:var(--primary-dark);font-size:12px;font-weight:800}
.sb-del{display:block;width:100%;margin-top:8px;padding:9px;border-radius:12px;background:#FDF0F1;border:1px solid #F4D8DB;color:#B25A60;font-size:11.5px;font-weight:800}
.sb-note{margin-top:9px;font-size:10.5px;line-height:1.55;font-weight:700;color:var(--muted);word-break:keep-all}
.sb-pick-h{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 7px;font-size:11.5px;font-weight:800;color:var(--ink-soft)}
.sb-pick-h small{font-size:10px;font-weight:700;color:var(--muted)}
.sb-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.sb-kid{display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:13px;background:#fff;border:1px solid var(--line);text-align:left;min-width:0}
.sb-kid .av{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--bg-soft);color:var(--ink-soft);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sb-kid .av img{width:100%;height:100%;object-fit:cover;display:block}
.sb-kid .nm{flex:1;min-width:0;font-size:12px;font-weight:800;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-kid .cl{flex:0 0 auto;font-size:9px;font-weight:800;color:var(--muted)}
.sb-kid.on{border-color:#E2A66F;background:#FFF5EA;box-shadow:inset 0 0 0 1px #E2A66F}
.sb-kid.on .nm{color:#B4691C}
.sb-grp{display:flex;align-items:center;gap:5px;margin:10px 2px 5px;font-size:10.5px;font-weight:800;color:var(--muted)}
.sb-grp i{width:7px;height:7px;border-radius:99px;background:currentColor;opacity:.6}
.sb-hist{margin-top:12px}
.sb-tabs{display:flex;gap:6px;margin:11px 0 2px}
.sb-tabs button{flex:1;min-width:0;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:11.5px;font-weight:800;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.sb-tabs button.on{background:var(--primary-soft);border-color:#EBCDB6;color:var(--primary-dark)}
.sb-tabs button b{font-weight:800;color:var(--primary-dark)}
.sb-tabs + .sb-hist{margin-top:10px}
.sb-pickbtn{margin-top:12px;padding:13px;font-size:13px}
.sb-h{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:13px;background:#fff;border:1px solid var(--line);margin-bottom:6px}
.sb-h .d{flex:0 0 auto;width:44px;font-size:11.5px;font-weight:800;color:var(--ink-soft)}
.sb-h .d small{display:block;font-size:9px;font-weight:700;color:var(--muted);margin-top:1px}
.sb-h .n{flex:1;min-width:0;font-size:12.5px;font-weight:800;color:var(--ink)}
.sb-h .n small{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-h .go{flex:0 0 auto;color:#C7B8A8;font-weight:800;font-size:14px}
.sb-h.now{border-color:#EAD6BC;background:#FFFBF5}
.sb-h.none{background:#FBF8F3;border-style:dashed;color:var(--muted)}
.sb-h.none .n{color:var(--muted)}
.sb-h.none .n small{color:#BDB0A2}

/* 🙏 선생님 기도제목 — 기도 탭에 바로 보이는 카드 */
.tp-empty-note{margin:2px 0 6px;padding:11px 12px;border-radius:13px;border:1px dashed #DED7F5;background:#FBFAFE;color:#6A5CAE;font-size:11px;font-weight:700;line-height:1.6;word-break:keep-all}
.tp-card{padding:10px 12px;border-radius:15px;background:#fff;border:1px solid var(--line);margin-bottom:7px}
.tp-card .tp-h{display:flex;align-items:center;gap:6px}
.tp-card .tp-h .nm{font-size:12.5px;font-weight:800;color:var(--ink)}
.tp-card .tp-h .dt{margin-left:auto;font-size:9.5px;font-weight:700;color:var(--muted)}
.tp-card .tp-h .edit{flex:0 0 auto;margin-left:auto;font-size:10.5px;font-weight:800;color:var(--primary-dark);background:var(--primary-soft);border-radius:999px;padding:4px 9px}
.tp-card .tp-by{margin-top:6px;font-size:9.5px;font-weight:700;color:var(--muted)}

  function mdLong(b) { return b.m + '월 ' + b.d + '일'; }
  // 오늘부터 다음 생일까지 남은 날수 (0 = 오늘)
  function daysToBirthday(b) {
    var now = startOfDay(new Date());
    var t = new Date(now.getFullYear(), b.m - 1, b.d);
    if (startOfDay(t) < now) t = new Date(now.getFullYear() + 1, b.m - 1, b.d);
    return Math.round((startOfDay(t) - now) / 86400000);
  }
  function bdayDayHtml(b, pastText) {
    var d = daysToBirthday(b);
    if (d === 0) return '<span class="dday today">오늘 🎉</span>';
    if (d <= 30) return '<span class="dday soon">D-' + d + '</span>';
    return '<span class="dday">' + (pastText ? esc(pastText) : 'D-' + d) + '</span>';
  }
  function teachersBirthdayIn(month) {
    var out = [];
    data.teachers.forEach(function (t) {
      var b = teachBirth(t);
      if (b && b.m === month) out.push({ t: t, b: b });
    });
    return out.sort(function (x, y) { return x.b.d - y.b.d; });
  }
  // 생일이 가까운 순 — 앞으로 60일 안에 생일이 오는 선생님
  function upcomingTeacherBirthdays(days) {
    var lim = (days == null) ? 60 : days;
    var out = [];
    data.teachers.forEach(function (t) {
      var b = teachBirth(t);
      if (!b) return;
      var d = daysToBirthday(b);
      if (d <= lim) out.push({ t: t, b: b, left: d });
    });
    return out.sort(function (x, y) { return x.left - y.left; });
  }
  // 관리 탭 — 이번 달 선생님 생일 모아 보기
  function teacherBdayCardHtml() {
    var mo = new Date().getMonth() + 1;
    var rows = teachersBirthdayIn(mo);
    var head = '<div class="tbd-head"><span>🎂 ' + mo + '월 선생님 생일</span>' +
      (rows.length ? '<b>' + rows.length + '명</b>' : '<b style="color:var(--muted);font-weight:700">없음</b>') + '</div>';
    var body = '';
    if (rows.length) {
      body = rows.map(function (x) {
        var clsId = (x.t.classIds || [])[0];
        var meta = classMeta(clsId);
        var cls = clsId ? className(clsId) : '미배정';
        return '<div class="tbd-row">' +
          '<span class="cls" style="background:' + meta.soft + ';color:' + meta.color + '">' + esc(cls) + '</span>' +
          '<span class="nm">' + esc(x.t.name) + '</span>' +
          '<span class="md">' + mdLong(x.b) + '</span>' +
          bdayDayHtml(x.b) +
        '</div>';
      }).join('');
    } else {
      var next = upcomingTeacherBirthdays(400);
      if (!next.length) {
        body = '<div class="tbd-empty">아직 넣은 선생님 생일이 없어요. 아래 명단에서 <b>✏️ 수정</b>을 눌러 생일(월·일)을 넣으면 여기 모아 보여 드려요.</div>';
      } else {
        var nx = next[0];
        body = '<div class="tbd-empty">이번 달은 생일 선생님이 없어요. 다음 생일은 <b>' + esc(nx.t.name) + '</b> ' + mdLong(nx.b) +
          ' (D-' + nx.left + ')이에요.</div>';
      }
    }
    return '<div class="card tbd-card">' + head + body + '</div>';
  }

  /* ---------- v1.8 — 명단 정리 (관리 탭 · 일괄 선택 삭제) ---------- */
  function resetSel() { ui.selIds = {}; }
  function selCount() {
    var n = 0;
    Object.keys(ui.selIds || {}).forEach(function (id) { if (ui.selIds[id] && childById(id)) n++; });
    return n;
  }
  // 관리 탭 정리는 그 반 아이를 입교일과 상관없이 모두 보여 준다 (지난주 이후 등록한 아이도 지울 수 있게)
  function mgVisibleChildIds() {
    var visible = ui.mgCls === 'all' ? data.classes : data.classes.filter(function (c) { return c.id === ui.mgCls; });
    var out = [];
    visible.forEach(function (c) {
      kidsOf(c.id).forEach(function (k) { out.push(k.id); });
    });
    return out;
  }
  function selAllOn() {
    var ids = mgVisibleChildIds();
    if (!ids.length) return false;
    for (var i = 0; i < ids.length; i++) if (!ui.selIds[ids[i]]) return false;
    return true;
  }
  function classMeta(id) {
    if (CLASS_META[id]) return CLASS_META[id];
    var c = null;
    try { c = (data && data.classes) ? classById(id) : null; } catch (e) { c = null; }
    // v1.6 — 관리자가 새로 만든 반은 만들 때 정한 색·이모지를 그대로 쓴다
    if (c && c.color && c.soft && c.emoji) return { color: c.color, soft: c.soft, emoji: c.emoji };
    return FALLBACK_META;
  }
  // v1.6 — 반 순서는 저장된 배열 순서를 그대로 따른다 (관리 탭 ▲▼로 바꾼 그 순서).
  //  같은 id가 두 번 들어온 경우에만 앞의 하나를 남긴다.
  function orderClasses(list) {
    var out = [], seen = {};
    (list || []).forEach(function (c) {
      if (!c || !c.id || seen[c.id]) return;
      seen[c.id] = true;
      out.push(c);
    });
    return out;
  }
  function classRank(id) {
    for (var i = 0; i < data.classes.length; i++) if (data.classes[i].id === id) return i;
    return -1;
  }
  function classById(id) {
    for (var i = 0; i < data.classes.length; i++) if (data.classes[i].id === id) return data.classes[i];
    return null;
  }
  function classIdExists(classes, id) {
    for (var i = 0; i < classes.length; i++) if (classes[i].id === id) return true;
    return false;
  }
  function className(id) { var c = classById(id); return c ? c.name : '미배정'; }
  function childById(id) {
    for (var i = 0; i < data.children.length; i++) if (data.children[i].id === id) return data.children[i];
    return null;
  }
  function isDataImage(s) {
    return typeof s === 'string' && /^data:image\/(png|jpeg|jpg|webp);base64,[A-Za-z0-9+/=]+$/i.test(s);
  }
  function photoKb(photo) {
    return photo ? Math.max(1, Math.round(photo.length * 0.75 / 1024)) : 0;
  }

  /* =========================================================
     3-1. 사진 — 고른 사진을 160px 정사각형 JPEG로 줄여 저장
     ========================================================= */
  var PHOTO_SIZE = 160;          // 화면의 동그란 사진에 충분하고 저장은 가볍도록
  var PHOTO_TARGET = 24000;      // data URL 길이 상한(약 18KB)
  var PHOTO_MAX_FILE = 15 * 1024 * 1024;

  function photoFromFile(file, cb) {
    if (!file) { cb('사진 파일을 찾지 못했어요.'); return; }
    if (String(file.type || '').indexOf('image/') !== 0) { cb('사진 파일(JPG·PNG)만 올릴 수 있어요.'); return; }
    if (file.size && file.size > PHOTO_MAX_FILE) { cb('사진이 너무 커요. 15MB 이하 사진으로 다시 골라 주세요.'); return; }
    if (typeof FileReader === 'undefined' || typeof Image === 'undefined') { cb('이 브라우저에서는 사진을 읽을 수 없어요.'); return; }

    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var out = shrinkToSquare(img);
        if (out) cb(null, out);
        else cb('사진을 줄이지 못했어요. 다른 사진으로 다시 시도해 주세요.');
      };
      img.onerror = function () {
        cb('이 사진은 열 수 없어요. JPG나 PNG로 바꾼 뒤 다시 골라 주세요(아이폰 HEIC 사진).');
      };
      img.src = String(reader.result || '');
    };
    reader.onerror = function () { cb('사진을 읽지 못했어요. 다시 시도해 주세요.'); };
    reader.readAsDataURL(file);
  }

  // 정사각형 가운데 자르기 → 작게 줄이기. 용량이 크면 한 단계씩 더 줄인다.
  function shrinkToSquare(img) {
    var tries = [
      { size: PHOTO_SIZE, q: 0.75 },
      { size: 140, q: 0.68 },
      { size: 120, q: 0.60 }
    ];
    var best = '';
    for (var i = 0; i < tries.length; i++) {
      var out = drawSquare(img, tries[i].size, tries[i].q);
      if (!out) continue;
      best = out;
      if (out.length <= PHOTO_TARGET) return out;
    }
    return best;
  }

  function drawSquare(img, size, quality) {
    try {
      var w = img.naturalWidth || img.width || 0;
      var h = img.naturalHeight || img.height || 0;
      if (!w || !h) return '';
      var side = Math.min(w, h);
      var dim = Math.min(size, side);       // 작은 원본을 억지로 늘리지 않는다
      var cv = document.createElement('canvas');
      if (!cv || !cv.getContext) return '';
      cv.width = dim; cv.height = dim;
      var cx = cv.getContext('2d');
      if (!cx) return '';
      try { cx.imageSmoothingQuality = 'high'; } catch (e) {}
      cx.fillStyle = '#FFFFFF';   // 투명 PNG도 하얀 배경으로
      cx.fillRect(0, 0, dim, dim);
      cx.drawImage(img, (w - side) / 2, (h - side) / 2, side, side, 0, 0, dim, dim);
      var out = cv.toDataURL('image/jpeg', quality);
      return isDataImage(out) ? out : '';
    } catch (e) { return ''; }
  }

  /* =========================================================
     4-1. 새친구반 샘플 출석 (seedData · 마이그레이션 공용)
     ========================================================= */
  function applyNewFriendSample(attendance, children, weeks) {
    weeks.forEach(function (w, i) {
      var key = (typeof w === 'string') ? w : w.key;
      var wi = (typeof w === 'string') ? i : w.wi;
      var plan = NF_WEEKS[wi] || {};
      Object.keys(plan).forEach(function (id) {
        var st = plan[id];
        if (!st) return;
        var kid = null;
        for (var i = 0; i < children.length; i++) if (children[i].id === id) { kid = children[i]; break; }
        if (!kid || kid.classId !== NEW_FRIEND_CLASS) return;
        if (kid.enrolled && kid.enrolled > key) return;      // 첫 방문 전 주일
        if (!attendance[key]) attendance[key] = {};
        if (attendance[key][id]) return;                     // 이미 적힌 기록은 그대로
        attendance[key][id] = {
          s: st,
          note: st === 'a' ? '적응 중이라 일찍 귀가' : '',
          by: 'seed',
          at: parseISO(key).getTime()
        };
      });

  // 형식 점검 — 반·관리자·선생님·아이·출석·기도를 그대로 두고, 빠진 형식만 채운다.

  // v0.8 · v0.9 — '함께 기도했어요' 표시의 옛 주체를 지금 형식으로 모은다.

  function unifyActors(map) {

  // v2.1 — 선생님 기도제목은 { 선생님 id: { text, by, byName, at } } · 빈 글은 저장하지 않는다
